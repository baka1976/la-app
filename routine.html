<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LA 오늘의 루틴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+JP:wght@500;700&family=Poor+Story&family=Gowun+Dodum&family=Hi+Melody&family=Gaegu:wght@400;700&family=Klee+One:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 한 장씩 넘기는 학습 카드 한 줄 + 위쪽 진행 막대. 책 출처를 카드마다 아래에 둔다. */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1d2321; --mute:#5f6a66; --line:#d9ddd8;
  --accent:#1f5f6b; --accent-ink:#ffffff; --ok:#2e7a46; --bad:#b4413a; --mark:#f3e3a8;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1d2422; --fg:#e7ece9; --mute:#9aa6a1; --line:#33403c;
  --accent:#6fb3bf; --accent-ink:#0f1614; --ok:#6cc58a; --bad:#ef8a80; --mark:#5b5222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --card:#1d2422; --fg:#e7ece9; --mute:#9aa6a1; --line:#33403c;
  --accent:#6fb3bf; --accent-ink:#0f1614; --ok:#6cc58a; --bad:#ef8a80; --mark:#5b5222; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:8px}
h1{font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:13px}
.bar{display:flex;gap:4px;flex-wrap:wrap}
.bar span{font-size:11px;letter-spacing:.02em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.bar span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar span.done{color:var(--fg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kind{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700}
.lvb{display:inline-block;margin-left:6px;padding:0 7px;border:1px solid var(--accent);border-radius:999px;font-size:11px;letter-spacing:0}
.jp{font-family:var(--jp);font-size:19px;line-height:1.75}
.jp.big{font-size:28px;text-align:center}
.ko{color:var(--mute)}
.src{font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px}
u{text-decoration:none;background:var(--mark);padding:0 2px;border-bottom:2px solid var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;min-height:44px}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.opt{width:100%;text-align:left}
button.okb{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
button.badb{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
button:disabled{opacity:1;cursor:default}
.opts{display:flex;flex-direction:column;gap:8px}
img.fig{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;border-radius:8px;border:1px solid var(--line);background:#fff;padding:6px;box-sizing:border-box}   /* 11-19 청해 그림 보기(책 그림, 흑백) — 어두운 화면에서도 흰 바탕 */
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--fg)}
.res{font-weight:700}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.turn{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.who{font-size:12px;color:var(--mute);padding-top:6px;white-space:nowrap}
details summary{cursor:pointer;color:var(--accent)}
.note{font-size:13px;color:var(--mute)}
.qask{font-size:16px;line-height:1.5;color:var(--fg);margin:0 0 8px}.qask b{background:var(--mark);padding:0 3px;border-radius:3px}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;max-height:320px;overflow:auto}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
/* 2026-11-04 개편: 위쪽 탭(오늘·복습·골라 풀기·설정), 큰 시작 버튼, 확신도 칩, 글자 크기 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-height:40px;padding:6px 8px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabs button.gear{flex:0 0 auto;min-width:48px}
button.start{width:100%;font-size:18px;padding:16px;min-height:60px}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips button{min-height:32px;padding:3px 12px;font-size:13px;border-radius:99px}
.lvsel{border:1px solid var(--line,#ccc);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stat{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.board{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card))}
.board .head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.board .big{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-2px;color:var(--accent);font-variant-numeric:tabular-nums}
.board .big small{font-size:28px;font-weight:700;letter-spacing:0}
.wboard .grade{font-size:15px;font-weight:800;padding:4px 12px;border-radius:999px;color:#fff}
.board .grade{font-size:20px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;align-self:center}
.board .sub{font-size:13px;color:var(--mute)}
.scale{position:relative;height:30px;border-radius:8px;overflow:visible;display:flex}
.scale>span{flex:none;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.scale>span:first-child{border-radius:8px 0 0 8px}.scale>span:last-of-type{border-radius:0 8px 8px 0}
.scale .pin{position:absolute;top:-8px;width:0;height:46px;border-left:3px solid var(--fg)}
.scale .pin::after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--fg);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
input{font:inherit;box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg)}
:root[data-fs="s"] body{font-size:14px}:root[data-fs="s"] .jp{font-size:17px}
:root[data-fs="l"] body{font-size:17px}:root[data-fs="l"] .jp{font-size:22px}:root[data-fs="l"] .jp.big{font-size:32px}
/* 2026-11-05 단어 찾기(앱 안 사전) · 단어장 · 공책 모양(오답노트·단어장): 줄 공책 + 빨간 여백선 + 형광펜 + 빨간 펜 */
:root{--paper:#fffdf5;--rule:#c9dcef;--margin:#ee9d9d;--pen:#22396f;--red:#cf2a22;--hl:rgba(255,226,60,.6);
  --hk:"Poor Story";--hand:"Klee One",var(--hk),var(--ui);--hz:1;--hw:400;--jph:"Klee One",var(--jp)}
:root[data-hand="gowun"]{--hk:"Gowun Dodum";--hz:.95}
:root[data-hand="melody"]{--hk:"Hi Melody";--hz:1.15}
:root[data-hand="gaegu"]{--hk:"Gaegu";--hz:1.05;--hw:700}
.ic{width:1.05em;height:1.05em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1f2421;--rule:rgba(130,170,210,.2);--margin:rgba(230,100,100,.45);--pen:#a9c2ff;--red:#ff7d72;--hl:rgba(255,215,50,.3)}}
:root[data-theme="dark"]{--paper:#1f2421;--rule:rgba(130,170,210,.2);--margin:rgba(230,100,100,.45);--pen:#a9c2ff;--red:#ff7d72;--hl:rgba(255,215,50,.3)}
.card.nb{background-color:var(--paper);background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);
  background-position:0 6px;padding-left:44px;font-family:var(--hand);font-size:calc(19px*var(--hz));font-weight:var(--hw);line-height:32px;color:var(--pen);border-color:var(--rule)}
.nb .kind{font-family:var(--hand);font-size:calc(24px*var(--hz));letter-spacing:0;color:var(--red);font-weight:var(--hw)}
.nb .jp{color:var(--fg)}
.nb,.nb *{font-family:var(--hand)!important}
.nb .note{font-size:calc(17px*var(--hz));font-weight:var(--hw);color:var(--pen);opacity:.85}
.nb h3{font-family:var(--hand);font-weight:var(--hw);font-size:calc(22px*var(--hz));color:var(--red);margin:8px 0 0}
.nb details>summary{color:var(--pen)}
.nb button,.nb input,.nb textarea{font-family:var(--ui);line-height:1.4}
.nb .res.ok{color:var(--ok)}.nb .res.bad,.nb .rp{color:var(--red);font-family:var(--hand);font-size:calc(19px*var(--hz));font-weight:var(--hw)}
.hl,.nb u{background:linear-gradient(100deg,transparent 2%,var(--hl) 4%,var(--hl) 96%,transparent 98%) 0 70%/100% 55% no-repeat;border:0;padding:0 2px;color:inherit}
.stamp{display:inline-block;font-family:var(--hand);font-size:calc(16px*var(--hz));line-height:1.1;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 6px;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.wrow{border-bottom:1px dashed var(--rule);padding:4px 0 8px;display:flex;flex-direction:column;gap:2px}
.wrow .w{font-family:var(--jph);font-size:22px;color:var(--fg)}
.wrow .r{font-family:var(--jph);font-size:15px;color:var(--red);margin-left:8px}
.wrow .m{font-family:var(--hand);font-size:calc(19px*var(--hz));font-weight:var(--hw)}
.wrow .row button,.wrow .row a{min-height:34px;padding:3px 10px;font-size:13px}
a.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--accent);text-decoration:none;font-size:14px;background:var(--card)}
button.on-star{border-color:var(--red);color:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;box-sizing:border-box}
.sheet.card{animation:none}
.nitem>summary{line-height:1.6;padding:4px 0}
.askt{font-family:var(--hand);font-size:calc(19px*var(--hz));color:var(--pen)}
.ask{border-left:3px solid var(--red);padding:2px 0 2px 10px;margin:6px 0}.ask p{margin:2px 0;font-size:calc(19px*var(--hz))}
.wbox{margin:6px 0}.wline{padding:4px 0 6px;border-bottom:1px dashed var(--rule)}
.m2{font-family:var(--hand);font-size:calc(18px*var(--hz))}
.ex{display:flex;flex-direction:column;padding-left:12px;line-height:1.6;margin:2px 0}.ex .jp{font-size:16px}
.ko2{font-size:14px;color:var(--mute);font-family:var(--ui)}.exs{font-size:11px;color:var(--mute);font-family:var(--ui)}
.tag{display:inline-block;font-size:12px;font-family:var(--ui);border:1px solid var(--red);color:var(--red);border-radius:4px;padding:0 5px;vertical-align:2px}
.aibox{margin:6px 0}.ai{white-space:pre-wrap;font-family:var(--ui);font-size:14px;line-height:1.7;color:var(--fg);background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;max-height:420px;overflow:auto}
.warn{border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);padding:6px 10px;border-radius:4px;font-size:13px;line-height:1.6;color:var(--fg)}
.nb .warn{font-size:calc(15px*var(--hz))}
.jbox{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.purpose{margin:-6px 0 0;font-size:12px;color:var(--mute)}
#nums button.playing{outline:3px solid var(--accent);outline-offset:2px}
#selbtn{display:inline-flex;align-items:center;gap:6px;position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.idx{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;line-height:1.5}
@keyframes flipN{from{opacity:.15;transform:perspective(900px) rotateY(-30deg) translateX(28px)}to{opacity:1;transform:none}}
@keyframes flipP{from{opacity:.15;transform:perspective(900px) rotateY(30deg) translateX(-28px)}to{opacity:1;transform:none}}
.page.flipN{animation:flipN .3s ease-out;transform-origin:right center}.page.flipP{animation:flipP .3s ease-out;transform-origin:left center}
@media(prefers-reduced-motion:reduce){.page.flipN,.page.flipP{animation:none}}
.pgjump{margin:2px 0 10px}.pgjump input[type=range]{flex:1;min-width:120px}.pgjump input[type=number]{width:70px}
.pgnav{align-items:center;justify-content:space-between;gap:6px}
/* 2026-11-17 화면 새 단장: 쪽빛(藍) + 벚꽃 파스텔, 제목 고운바탕, 그림자 카드, 알약 탭 */
:root{--bg:#f3f4f8;--card:#ffffff;--fg:#232838;--mute:#6c7284;--line:#e1e4ee;--accent:#46659e;--accent-ink:#ffffff;--ok:#3f8f6b;--bad:#c2546a;--mark:#f9dde6;--soft:#e1e9f7;--soft-ink:#2f4c86;--g1:#d7e5f8;--g2:#e7e3f7;--g3:#f8dfe8;--g-ink:#27365e;--g-sh:rgba(70,101,158,.22);--u1:#f2b8cb;--u2:#8fb0e3;
  --p-sky:#dcecfb;--p-mint:#d9f1e6;--p-lav:#e8e2fb;--p-peach:#fde3d6;--p-butter:#fbf0c9;--p-pink:#fbe1ea;
  --shadow:0 1px 2px rgba(40,50,80,.05),0 6px 18px rgba(40,50,80,.06);--head:"Gowun Batang",var(--ui)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161a24;--card:#1f2433;--fg:#e7eaf3;--mute:#9da4b8;--line:#30374a;--accent:#9db8ec;--accent-ink:#161a24;--ok:#86d1ab;--bad:#f19aac;--mark:#4d2f3c;--soft:#26304a;--soft-ink:#cbd9f6;--g1:#2a3a57;--g2:#352f52;--g3:#4a2e3d;--g-ink:#e7eaf3;--g-sh:rgba(0,0,0,.3);
  --p-sky:#22303f;--p-mint:#203229;--p-lav:#2c2840;--p-peach:#3a2b25;--p-butter:#363020;--p-pink:#3a2630;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a24;--card:#1f2433;--fg:#e7eaf3;--mute:#9da4b8;--line:#30374a;--accent:#9db8ec;--accent-ink:#161a24;--ok:#86d1ab;--bad:#f19aac;--mark:#4d2f3c;--soft:#26304a;--soft-ink:#cbd9f6;--g1:#2a3a57;--g2:#352f52;--g3:#4a2e3d;--g-ink:#e7eaf3;--g-sh:rgba(0,0,0,.3);
  --p-sky:#22303f;--p-mint:#203229;--p-lav:#2c2840;--p-peach:#3a2b25;--p-butter:#363020;--p-pink:#3a2630;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
body{letter-spacing:-.005em}
h1{font-family:var(--head);font-size:22px;font-weight:700;letter-spacing:-.01em}
h1::after{content:"";display:block;width:28px;height:3px;border-radius:3px;margin-top:6px;background:linear-gradient(90deg,var(--u1,#f6b8c8),var(--u2,#b9aef5))}

/* 카드: 굵은 테두리 대신 부드러운 그림자 */
.card{border:0;border-radius:18px;box-shadow:var(--shadow);padding:18px}
.kind{color:var(--soft-ink);letter-spacing:.04em}
.lvb{border:0;background:var(--soft);color:var(--soft-ink);font-weight:700}
.src{border-top:1px solid var(--line)}

/* 탭: 상자 6개 → 한 줄 알약 막대, 글자 줄바꿈 없음 */
.tabs{flex-wrap:nowrap;gap:2px;padding:4px;background:var(--card);border-radius:999px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:999px;min-height:38px;padding:4px 6px;white-space:nowrap;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--soft);color:var(--soft-ink);font-weight:700}
.tabs button.gear{min-width:0}

/* 버튼 */
button{border-radius:12px;border-color:var(--line);transition:background .15s,border-color .15s,transform .1s}
button:active{transform:scale(.98)}
button.pri{background:var(--accent);border-color:var(--accent)}
button.start{border:0;border-radius:16px;font-size:19px;font-weight:700;color:var(--g-ink,#2f2a55);
  background:linear-gradient(120deg,var(--g1,#fcd5df) 0%,var(--g2,#e3dafc) 55%,var(--g3,#d3e8fb) 100%);box-shadow:0 6px 16px var(--g-sh,rgba(150,130,220,.25))}
button.opt{background:var(--card);padding:12px 14px}
@media (hover:hover){button.opt:not(:disabled):hover{background:var(--soft)}}
/* 2026-11-17 배색 고르기: 밝은 값은 :root[data-pal], 어두운 값은 그보다 강한 선택자로 덮음 */
.chips .sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
:root[data-pal="sage"]{--bg:#f5f3ec;--card:#fffefa;--fg:#26302b;--mute:#6f7a74;--line:#e4e6dc;--accent:#5d8c78;--accent-ink:#fffefa;--soft:#e2efe7;--soft-ink:#3b6a56;--mark:#f3e6ad;--g1:#d4ecdd;--g2:#e9f0d6;--g3:#f7ead3;--g-ink:#2c4a3d;--g-sh:rgba(95,140,120,.25);--u1:#9fcab4;--u2:#e8d49a}

/* 2026-11-17 PC 전용 구조(가로 1024px 이상). 휴대폰·태블릿 세로는 위의 앱 모양 그대로.
   위쪽 메뉴(움직이는 표시) · 첫 화면 대시보드(.dash) · 풀이는 프레젠테이션 모드(body.pres: 넓은 슬라이드, 보기 2열, 1~4·Enter 키) */
@media (min-width:1024px){
  body{padding:0}
  .wrap{max-width:none;gap:0}
  header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 32px;padding:14px max(40px,calc((100vw - 1200px)/2));
    background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}

  .tabs::before{content:"";position:absolute;top:5px;bottom:5px;left:var(--pl,5px);width:var(--pw,0);border-radius:999px;background:var(--soft);transition:left .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1)}
  .tabs button{position:relative;z-index:1;flex:none;padding:8px 20px;min-height:40px;font-size:15px}
  .tabs button.on{background:transparent}

  .tabs:has(#quit){justify-self:start;grid-column:2/4;flex-wrap:nowrap;gap:16px}
  .bar{grid-column:1/-1;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}

  main#view{max-width:1200px;margin:0 auto;padding:36px 40px 80px;box-sizing:border-box;width:100%}
  main#view>.card{padding:28px 34px;gap:16px}

  .qask{font-size:17px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:20px;max-height:80vh;max-width:760px}
  :root[data-fs="l"] .jp{font-size:24px}
  /* 첫 화면 대시보드 */
  .dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:stretch}
  .dash>.card{margin:0}

@media (min-width:1024px) and (prefers-reduced-motion:no-preference){

/* 2026-11-20 모던 배색(기본): 흑백 + 쪽빛 하나 + 벚꽃 조금, 큰 글자 대비, 얇은 선, 검정 알약 버튼 */
:root[data-pal="modern"]{--bg:#f5f5f2;--card:#fff;--fg:#111216;--mute:#6f717a;--line:#e3e3de;--accent:#2337c6;--accent-ink:#fff;--ok:#14a06b;--bad:#e5484d;--mark:#ffe3ec;--soft:#ececE7;--soft-ink:#111216;
  --g1:#e4e8fb;--g2:#ececE7;--g3:#ffe3ec;--g-ink:#111216;--g-sh:rgba(35,55,198,.25);--u1:#ff5d8f;--u2:#2337c6;--p-pink:#ffe3ec;--p-mint:#dff3ea;

  --g1:#1f2440;--g2:#1f2026;--g3:#3b2230;--g-ink:#f2f2f0;--g-sh:rgba(0,0,0,.4);--p-pink:#3b2230;--p-mint:#173027}}
:root[data-pal="modern"][data-theme="dark"]{--bg:#0d0e11;--card:#17181d;--fg:#f2f2f0;--mute:#8d8f98;--line:#272930;--accent:#7d8cff;--accent-ink:#0d0e11;--ok:#3ccf91;--bad:#ff6b6f;--mark:#3b2230;--soft:#1f2026;--soft-ink:#f2f2f0;
  --g1:#1f2440;--g2:#1f2026;--g3:#3b2230;--g-ink:#f2f2f0;--g-sh:rgba(0,0,0,.4);--p-pink:#3b2230;--p-mint:#173027}
[data-pal="modern"] body{letter-spacing:-.012em;-webkit-font-smoothing:antialiased}

.card.fxhit{animation:fxHit .45s cubic-bezier(.2,.9,.25,1.25)}.card.fxmiss{animation:fxMiss .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes fxHit{25%{transform:scale(1.018)}100%{transform:none}}

function bindPager(id){const R=$('#pgr_'+id);if(!R)return;const T=R.querySelector('.pgr-t'),P=[...T.children],ch=R.querySelectorAll('.pgr-ch button'),dots=R.querySelectorAll('.pgr-d i'),no=R.querySelector('.pgr-no b'),L=R.querySelector('.pgr-a.l'),Rb=R.querySelector('.pgr-a.r');
  let cur=Math.min(PGI[id]||0,P.length-1);const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const fit=()=>{const h=P[cur]&&P[cur].offsetHeight;T.style.height=h?h+'px':'auto'};
  const mark=i=>{cur=i;PGI[id]=i;no.textContent=i+1;ch.forEach((b,k)=>b.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i));L.disabled=i===0;Rb.disabled=i===P.length-1;P.forEach((pg,k)=>pg.classList.toggle('cur',k===i));fit();
    const cb=ch[i];if(cb){const c=cb.parentNode;c.scrollTo({left:cb.offsetLeft-c.offsetLeft-c.clientWidth/2+cb.offsetWidth/2,behavior:still?'auto':'smooth'})}};
  const go=i=>{i=Math.max(0,Math.min(P.length-1,i));T.scrollTo({left:i*T.clientWidth,behavior:still?'auto':'smooth'});mark(i)};
  T.scrollLeft=cur*T.clientWidth;mark(cur);
  let tm=0;T.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{const i=Math.round(T.scrollLeft/Math.max(1,T.clientWidth));if(i!==cur)mark(i)},90)},{passive:true});
  ch.forEach(b=>b.onclick=()=>go(+b.dataset.pk));L.onclick=()=>go(cur-1);Rb.onclick=()=>go(cur+1);R.__go=d=>go(cur+d);

function wReq(items){const rid=Math.random().toString(36).slice(2,6).toUpperCase(),L=[`[LA 작문 판정 요청] ${today()} · 번호 ${rid}`,''],art=items.some(x=>x.k==='art');

function buildTest(lv){const keep=S.levels;S.levels=[lv];try{const st=[...pickSteps('moji',10),...pickSteps('gram',6),...pickSteps('tg',1),...pickReadQ(8),...pickSteps('listen',5)];

// 2026-11-17 헷갈린 짝: 오답노트에 남은 「고른 보기」(pick, 책 번호)로 정답 말 ↔ 내가 고른 말 짝을 모은다(어휘 문맥·유의·표기, 문법 빈칸만)
const CP_T=['context','paraphrase','orthography','word_formation','grammar_form'];
function confPairs(){const m=new Map();for(const e of Object.values(S.notes||{})){if(!['moji','gram'].includes(e.k))continue;const x=find('mock',e.id);if(!x||!CP_T.includes(x.type)||x.passage)continue;
  for(const a of e.a||[]){if(a.ok!==false||!a.pick)continue;const c=x.choices[x.answer-1],p=x.choices[a.pick-1];if(!c||!p||c===p)continue;
    const k=c+'\u0001'+p,o=m.get(k)||{c,p,n:0,ids:[],t:0,g:x.type==='grammar_form',s:x.stem};o.n++;if(!o.ids.includes(e.k+'|'+e.id))o.ids.push(e.k+'|'+e.id);o.t=Math.max(o.t,a.t||0);m.set(k,o)}}
  return[...m.values()].sort((a,b)=>b.n-a.n||b.t-a.t)}
const cpDict=w=>{const e=dx().m.get(String(w).replace(/^[～〜]+|[～〜]+$/g,''));return e?{r:e[1]||'',ko:e[2]||''}:{r:'',ko:''}};

     <div><span class="note">고른 말</span> <span class="jp" style="font-size:18px">${esc(o.p)}</span>${b.r&&b.r!==o.p?` <span class="note">${esc(b.r)}</span>`:''}${b.ko?` <span class="note">${esc(b.ko)}</span>`:''}${o.n>1?` <span class="tag">${o.n}번</span>`:''}</div>

function cpBind(){const P=confPairs();document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const o=P[+b.dataset.cp];if(!o)return;const now=Date.now(),key=o.ids[0];

  const L=[`[LA 일본어 실력 리포트] ${today()} · 목표 레벨 ${lv}`,`※ JLPT식 60점 환산 추정(앱이 계산): 처음 푼 문제 최근 60개, 애매하게 맞힌 건 0.5점`];

  if(T.length)L.push(`레벨 테스트: `+T.map(t=>`${t.date} ${t.sc.lang}/${t.sc.read}/${t.sc.listen}`).join(', '));
  if(ty.length)L.push(`\n유형별 정답률(낮은 순): `+ty.slice(0,8).map(t=>`${t.t} ${pct(t.p)}(${t.n}문항, 평균 ${Math.round(t.ms/1000)}초)`).join(' / '));
  {const W=wSeries();if(W.length)L.push(`쓰기 점수(AI 판정, 15점 만점 평균): `+W.slice(-6).map(w=>`${w.d.slice(5)} ${w.avg.toFixed(1)}`).join(' → ')+` · 항목 평균 문법 ${wAvg(0)}/5 · 문형 ${wAvg(1)}/5 · 자연스러움 ${wAvg(2)}/5`)}
  const days=new Set(S.log.filter(l=>!l.kind).map(l=>l.date));L.push(`학습 일수 ${days.size}일 · 연속 ${streak()}일 · 복습 대기 ${openNotes()}문제`);

// 틀린 어휘·한자 문제의 단어는 단어장에 자동으로 넣는다(어휘 카드·청해 단어·한자 퀴즈·모의고사 한자 읽기/표기)
function autoWords(s){s.steps.forEach((st,i)=>{const r=s.res[i];if(!r||r.ok!==false)return;let e=null,sn='';const dm=w=>dx().m.get(w)||(wordsIn(w).find(h=>!h.unk&&h.sf.length>=w.length-3)||{}).e||['','',''];
  if(st.k==='v5'){const x=find('v5',st.id);if(x){e=[x.jp,x.yomi||dm(x.jp)[1],x.ko];sn=x.ctx?x.ctx[0]:''}}
  else if(st.k==='vocab'){const x=find('vocab',st.id);if(x){e=[x.jp,dm(x.jp)[1],x.ko];sn=x.ctx?x.ctx[0]:''}}
  else if(st.k==='kanji'){const x=find('kanji',st.id);if(x&&x.t){const w=x.sec===1?x.t:x[x.ans],rd=x.sec===1?x[x.ans]:x.t;e=[w,rd,dm(w)[2]];sn=x.s}}
  else if(st.k==='kr'){const x=find('kr',st.id);if(x){const d=dm(x.w);e=[x.w,x.choices[x.answer-1],d[2]||x.why.split('= ')[1]||''];sn=x.stem.replace(/[【】]/g,'')}}
  else if(st.k==='moji'){const x=find('mock',st.id),u=x&&(x.stem.match(/【(.+?)】/)||[])[1];
    // 활용형(飽きられて)은 사전에서 찾으면 사전형(飽きる)으로 넣는다
    if(u&&x.type==='kanji_reading'){const d=dm(u);e=d[0]&&d[0]!==u?[d[0],d[1]||x.choices[x.answer-1],d[2]]:[u,x.choices[x.answer-1],d[2]]}
    if(u&&x.type==='orthography'){const w=x.choices[x.answer-1],d=dm(w);e=d[0]&&d[0]!==w?[d[0],d[1]||u,d[2]]:[w,u,d[2]]}sn=x?x.stem.replace(/[【】]/g,''):''}
  let kind='';
  if(st.k==='gram'||st.k==='tg'){const x=find('mock',st.id);if(x&&x.pattern){e=[x.pattern.form,'',x.pattern.ko];kind='p';sn=x.type==='grammar_form'?filled(x):''}}
  if(st.k==='p630'){const x=find('p630',st.id);if(x){e=[x.pattern,'',x.meaning];kind='p';sn=x.ex[0]?x.ex[0][0]:''}}
  if(!e||!e[0]||liveW(e[0]))return;const now=Date.now(),o=S.words[e[0]]||{},key=st.k+'|'+st.id;

// 끝 화면: 점수 + 틀린 것만 + 버튼 두 개(판정 요청문 복사 · 처음으로). 판정 붙여넣기는 그 아래
function finish(){
  const s=S.cur,had=s.rid,rp=report(s),kind=s.review?'review':s.test?'test':s.custom?'custom':'';CURLV=null;$('#bar').innerHTML='';

   ${p==='auto'?`<div class="note">날씨 지역</div><div class="chips">${fxCities().map(([v,n])=>`<button data-fxc="${v}" class="${c===v?'on':''}">${n}</button>`).join('')}</div>`:''}
   <p class="note">지금: ${esc(n[0]==='off'?'효과 없음':nm)}${p==='auto'?' · '+esc(n[1]):''}</p>
   <div><b>풀이 효과음</b> <span class="note">(정답·오답 때 짧은 소리 · 진동과 화면 효과는 늘 켜짐, 기기의 「동작 줄이기」를 켜면 꺼짐)</span></div><div class="chips">${[['','끔'],['1','켬']].map(([v,n])=>`<button data-sfx="${v}" class="${(S.pref.sfx?'1':'')===v?'on':''}">${n}</button>`).join('')}</div>`}
function fxBind(){document.querySelectorAll('button[data-sfx]').forEach(b=>b.onclick=()=>{S.pref.sfx=b.dataset.sfx==='1';save();render()});document.querySelectorAll('button[data-fx]').forEach(b=>b.onclick=()=>{S.pref.fx=b.dataset.fx;save();applyFx();render()});
  document.querySelectorAll('button[data-fxc]').forEach(b=>b.onclick=()=>{S.pref.fxcity=b.dataset.fxc;save();applyFx();render();fxWeather().then(()=>{applyFx();if(VIEW==='set')render()})})}
applyFx();fxWeather().then(applyFx);setInterval(()=>fxWeather().then(applyFx),3600e3);

if(SELFTEST){render();setTimeout(selfTest,300)}
else{render();
syncNow().then(r=>{if(r==='ok'&&VIEW!=='sess')render()})}
</script>
<script>
/* 루틴 팩(LARTN1)을 기기(IndexedDB)에서 꺼내 본 화면을 실행. 없으면 파일을 고르게 한다. 팩은 저장소에 없음 */
(function(){
  const DB='la-routine',ST='pack';
  const idb=()=>new Promise((ok,ng)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
  const get=async()=>{const d=await idb();return new Promise(ok=>{const q=d.transaction(ST).objectStore(ST).get('cur');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})};
  const put=async v=>{const d=await idb();return new Promise((ok,ng)=>{const tx=d.transaction(ST,'readwrite');tx.objectStore(ST).put(v,'cur');tx.oncomplete=ok;tx.onerror=()=>ng(tx.error)})};
  const run=p=>{window.__PACK=p;window.__AUD=p.audio;const s=document.createElement('script');s.textContent=document.getElementById('main').textContent;document.body.appendChild(s);
    const sub=document.getElementById('sub');if(sub)sub.insertAdjacentHTML('beforeend',` · 문제 ${p.built} · 음원 ${Object.keys(p.audio||{}).length}개 <a href="#" id="repack">팩 추가·교체</a>`);
    const rp=document.getElementById('repack');if(rp)rp.onclick=e=>{e.preventDefault();ask(true)}};
  // 비공개 기록 저장소(packs/manifest.json)에서 팩 자동 받기. 저장소·토큰은 앱의 자동 동기화 설정과 같은 값(la-sync-v1)
  let SY;try{SY=JSON.parse(localStorage.getItem('la-sync-v1'))||{}}catch(e){SY={}}
  const raw=async path=>{const r=await fetch('https://api.github.com/repos/'+SY.repo+'/contents/'+encodeURI(path),{cache:'no-store',headers:{Authorization:'Bearer '+SY.token,Accept:'application/vnd.github.raw'}});if(!r.ok)throw new Error(path+' ('+r.status+')');return r.json()};
  async function fromRepo(old,say){const man=await raw('packs/manifest.json');old=old||{format:'LARTN1',audio:{}};
    const all={format:'LARTN1',data:old.data,built:old.built,audio:Object.assign({},old.audio||{}),av:Object.assign({},old.av||{})};let ch=false;
    if(man.built!==old.built){say&&say('문제 팩 받는 중…');const p=await raw(man.data);all.data=p.data;all.built=p.built;ch=true}
    for(const a of man.audio){if(all.av[a.path]!==a.v){say&&say('음원 받는 중… ('+a.path.replace('packs/','')+')');const p=await raw(a.path);Object.assign(all.audio,p.audio);all.av[a.path]=a.v;ch=true}}
    if(ch)await put(all);return{all,ch}}
  function ask(again){
    const v=document.getElementById('view');
    v.innerHTML=`<section class="card"><div class="kind">루틴 팩 불러오기</div>
      <p>이 앱에는 문제가 들어 있지 않습니다. 드라이브나 메일로 받은 <b>루틴 팩 파일</b>을 골라 주세요(여러 개 함께 골라도 됩니다). 이 기기에 저장되어 다음부터는 바로 열립니다.</p>
      <p class="note">처음: 「LA_루틴_문제_날짜」와 「LA_루틴_음원1·2…」를 모두. 문제가 늘면 「문제」 파일 하나만 새로 고르면 되고, 음원은 새 음원 파일이 있을 때만.</p>
      <input type="file" id="pf" accept=".json,application/json" multiple><p class="note" id="pm"></p>
      <details ${SY.repo?'':'open'}><summary>기록 저장소에서 자동으로 받기</summary><p class="note">앱의 「자동 동기화 설정」과 같은 저장소·토큰입니다. 한 번 넣으면 새 팩이 올라올 때마다 자동으로 받습니다.</p>
      <input id="ar" value="${SY.repo||'baka1976/la-records'}" autocomplete="off" spellcheck="false"><input id="at" type="password" placeholder="토큰" autocomplete="off" spellcheck="false">
      <div class="row"><button class="pri" id="ag">저장소에서 받기</button></div></details>
      ${again?'<div class="row"><button id="pc">취소</button></div>':''}</section>`;
    document.getElementById('ag').onclick=async()=>{const m=document.getElementById('pm');const repo=document.getElementById('ar').value.trim(),tok=document.getElementById('at').value.replace(/\s+/g,'');
      if(!repo||(!tok&&!SY.token)){m.textContent='저장소와 토큰을 넣어 주세요.';return}SY.repo=repo;if(tok)SY.token=tok;try{localStorage.setItem('la-sync-v1',JSON.stringify(SY))}catch(e){}
      try{await fromRepo(await get(),t=>m.textContent=t);m.textContent='받았습니다.';setTimeout(()=>location.reload(),500)}catch(err){m.textContent='받지 못했습니다: '+err.message}};
    const pc=document.getElementById('pc');if(pc)pc.onclick=()=>location.reload();
    document.getElementById('pf').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;const m=document.getElementById('pm');m.textContent='읽는 중…';
      try{const ps=await Promise.all(fs.map(f=>f.text().then(JSON.parse)));
        if(ps.some(p=>p.format!=='LARTN1'))throw new Error('루틴 팩 파일이 아닙니다');
        const old=(await get())||{format:'LARTN1',audio:{}};
        const ds=ps.filter(p=>p.data).sort((a,b)=>a.built<b.built?1:-1);
        const all={format:'LARTN1',data:ds.length?ds[0].data:old.data,built:ds.length?ds[0].built:old.built,audio:Object.assign({},old.audio||{},...ps.map(p=>p.audio||{}))};
        await put(all);if(!all.data){m.textContent=`음원 ${Object.keys(all.audio).length}개를 저장했습니다. 이제 문제 파일(LA_루틴_문제_날짜)을 골라 주세요.`;e.target.value='';return}const na=Object.keys(all.audio).length;m.textContent=`저장했습니다(문제 ${all.built}, 음원 ${na}개).`;setTimeout(()=>location.reload(),600)}catch(err){m.textContent='불러오지 못했습니다: '+err.message}};
  }
  get().then(async p=>{
    if(p&&p.format==='LARTN1'&&p.data){run(p);
      if(SY.repo&&SY.token)fromRepo(p).then(r=>{if(r.ch){const sub=document.getElementById('sub');if(sub)sub.insertAdjacentHTML('beforeend',' · <b>새 팩을 받았습니다</b> <a href="#" onclick="location.reload();return false">새로고침</a>')}}).catch(()=>{});return}
    if(SY.repo&&SY.token){try{const v=document.getElementById('view');v.innerHTML='<section class="card"><p id="pm">기록 저장소에서 팩을 받는 중…</p></section>';const r=await fromRepo(p,t=>{const m=document.getElementById('pm');if(m)m.textContent=t});run(r.all);return}catch(e){}}
    ask(false)}).catch(()=>ask(false));
})();
</script>

</body></html>
