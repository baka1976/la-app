<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LA 오늘의 루틴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+JP:wght@500;700&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Klee+One:wght@400;600&display=swap">
<style>
/* 레이아웃: 한 장씩 넘기는 학습 카드 한 줄 + 위쪽 진행 막대. 책 출처를 카드마다 아래에 둔다. */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1d2321; --mute:#5f6a66; --line:#d9ddd8;
  --accent:#1f5f6b; --accent-ink:#ffffff; --ok:#2e7a46; --bad:#b4413a; --mark:#f3e3a8;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1d2422; --fg:#e7ece9; --mute:#9aa6a1; --line:#33403c;
  --accent:#6fb3bf; --accent-ink:#0f1614; --ok:#6cc58a; --bad:#ef8a80; --mark:#5b5222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --card:#1d2422; --fg:#e7ece9; --mute:#9aa6a1; --line:#33403c;
  --accent:#6fb3bf; --accent-ink:#0f1614; --ok:#6cc58a; --bad:#ef8a80; --mark:#5b5222; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:8px}
h1{font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:13px}
.bar{display:flex;gap:4px;flex-wrap:wrap}
.bar span{font-size:11px;letter-spacing:.02em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.bar span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar span.done{color:var(--fg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kind{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700}
.lvb{display:inline-block;margin-left:6px;padding:0 7px;border:1px solid var(--accent);border-radius:999px;font-size:11px;letter-spacing:0}
.jp{font-family:var(--jp);font-size:19px;line-height:1.75}
.jp.big{font-size:28px;text-align:center}
.ko{color:var(--mute)}
.src{font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px}
u{text-decoration:none;background:var(--mark);padding:0 2px;border-bottom:2px solid var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 14px;min-height:44px}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.opt{width:100%;text-align:left}
button.okb{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
button.badb{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
button:disabled{opacity:1;cursor:default}
.opts{display:flex;flex-direction:column;gap:8px}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--fg)}
.res{font-weight:700}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.turn{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.who{font-size:12px;color:var(--mute);padding-top:6px;white-space:nowrap}
details summary{cursor:pointer;color:var(--accent)}
.note{font-size:13px;color:var(--mute)}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;max-height:320px;overflow:auto}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
/* 2026-11-04 개편: 위쪽 탭(오늘·복습·골라 풀기·설정), 큰 시작 버튼, 확신도 칩, 글자 크기 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-height:40px;padding:6px 8px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabs button.gear{flex:0 0 auto;min-width:48px}
button.start{width:100%;font-size:18px;padding:16px;min-height:60px}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips button{min-height:32px;padding:3px 12px;font-size:13px;border-radius:99px}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stat{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.board{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card))}
.board .head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.board .big{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-2px;color:var(--accent);font-variant-numeric:tabular-nums}
.board .big small{font-size:28px;font-weight:700;letter-spacing:0}
.board .grade{font-size:20px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;align-self:center}
.board .sub{font-size:13px;color:var(--mute)}
.scale{position:relative;height:30px;border-radius:8px;overflow:visible;display:flex}
.scale>span{flex:none;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.scale>span:first-child{border-radius:8px 0 0 8px}.scale>span:last-of-type{border-radius:0 8px 8px 0}
.scale .pin{position:absolute;top:-8px;width:0;height:46px;border-left:3px solid var(--fg)}
.scale .pin::after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--fg);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
input{font:inherit;box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg)}
:root[data-fs="s"] body{font-size:14px}:root[data-fs="s"] .jp{font-size:17px}
:root[data-fs="l"] body{font-size:17px}:root[data-fs="l"] .jp{font-size:22px}:root[data-fs="l"] .jp.big{font-size:32px}
/* 2026-11-05 단어 찾기(앱 안 사전) · 단어장 · 공책 모양(오답노트·단어장): 줄 공책 + 빨간 여백선 + 형광펜 + 빨간 펜 */
:root{--paper:#fffdf5;--rule:#c9dcef;--margin:#ee9d9d;--pen:#22396f;--red:#cf2a22;--hl:rgba(255,226,60,.6);
  --hand:"Gaegu","Nanum Pen Script",var(--ui);--hand2:"Nanum Pen Script","Gaegu",var(--ui);--jph:"Klee One",var(--jp)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1f2421;--rule:rgba(130,170,210,.2);--margin:rgba(230,100,100,.45);--pen:#a9c2ff;--red:#ff7d72;--hl:rgba(255,215,50,.3)}}
:root[data-theme="dark"]{--paper:#1f2421;--rule:rgba(130,170,210,.2);--margin:rgba(230,100,100,.45);--pen:#a9c2ff;--red:#ff7d72;--hl:rgba(255,215,50,.3)}
.card.nb{background-color:var(--paper);background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);
  background-position:0 6px;padding-left:44px;font-family:var(--hand);font-size:19px;font-weight:700;line-height:32px;color:var(--pen);border-color:var(--rule)}
.nb .kind{font-family:var(--hand2);font-size:26px;letter-spacing:0;color:var(--red);font-weight:400}
.nb .jp{font-family:var(--jph);color:var(--fg)}
.nb .note{font-size:17px;font-weight:700;color:var(--pen);opacity:.85}
.nb h3{font-family:var(--hand2);font-weight:400;font-size:24px;color:var(--red);margin:8px 0 0}
.nb details>summary{color:var(--pen)}
.nb button,.nb input,.nb textarea{font-family:var(--ui);line-height:1.4}
.nb .res.ok{color:var(--ok)}.nb .res.bad,.nb .rp{color:var(--red);font-family:var(--hand2);font-size:22px;font-weight:400}
.hl,.nb u{background:linear-gradient(100deg,transparent 2%,var(--hl) 4%,var(--hl) 96%,transparent 98%) 0 70%/100% 55% no-repeat;border:0;padding:0 2px;color:inherit}
.stamp{display:inline-block;font-family:var(--hand2);font-size:20px;line-height:1.1;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 6px;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.wrow{border-bottom:1px dashed var(--rule);padding:4px 0 8px;display:flex;flex-direction:column;gap:2px}
.wrow .w{font-family:var(--jph);font-size:22px;color:var(--fg)}
.wrow .r{font-family:var(--jph);font-size:15px;color:var(--red);margin-left:8px}
.wrow .m{font-family:var(--hand);font-size:19px;font-weight:700}
.wrow .row button,.wrow .row a{min-height:34px;padding:3px 10px;font-size:13px}
a.btn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--accent);text-decoration:none;font-size:14px;background:var(--card)}
button.on-star{border-color:var(--red);color:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;box-sizing:border-box}
.sheet.card{animation:none}
#selbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style></head><body>
<div class="wrap">
  <header>
    <h1>LA 오늘의 일본어</h1>
    <nav class="tabs" id="tabs"></nav>
    <div class="bar" id="bar"></div>
  </header>
  <main id="view"></main>
</div>
<script type="text/plain" id="main">
const D=window.__PACK?window.__PACK.data:JSON.parse(document.getElementById('data').textContent);
const AU=p=>(window.__AUD&&window.__AUD[p])||p;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const KEY='la-daily-v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.ptr=S.ptr||{};S.wrong=S.wrong||{};S.log=S.log||[];S.known=S.known||[];S.notes=S.notes||{};S.seen=S.seen||{};S.judges=S.judges||{};S.levels=S.levels||['N1'];S.hist=S.hist||[];S.ux=S.ux||[];S.tests=S.tests||[];S.wsc=S.wsc||{};S.pref=S.pref||{};S.words=S.words||{};
// 보기 설정(이 기기만): 글자 크기, 화면 테마
const applyPref=()=>{const r=document.documentElement;r.dataset.fs=S.pref.fs||'m';if(S.pref.theme)r.dataset.theme=S.pref.theme;else delete r.dataset.theme};applyPref();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const PLAN=[['wb',0,'단어장'],['listen',3,'청해'],['kanji',3,'한자'],['vocab',6,'어휘'],['moji',5,'어휘'],['v5',3,'어휘'],['gram',3,'문법'],['pat',1,'문형'],['p630',1,'문형'],['pat2',1,'문형'],['ilyeok',1,'일역'],['hanyeok',1,'한역'],['tg',5,'글의 문법'],['reading',1,'독해'],['talk',1,'회화'],['write',1,'작문'],['write2',1,'작문']];
function take(kind,pool,n,skip=()=>false){
  const byId=new Map(pool.map(x=>[x.id,x])),out=[],w=(S.wrong[kind]||[]).filter(id=>byId.has(id));
  for(const id of w){if(out.length>=Math.ceil(n/2))break;const x=byId.get(id);if(!skip(x,out))out.push(x)}
  let p=S.ptr[kind]||0;
  let g=0;while(out.length<n&&g++<pool.length*2){const x=pool[p%pool.length];p++;if(!out.includes(x)&&!skip(x,out))out.push(x)}
  return {items:out,next:p};
}
// 출제 레벨(JLPT N1~N5): 고른 레벨의 문항만 낸다. 레벨 구분이 없는 자료(lv 없음)는 항상 포함.
// 고른 레벨에 자료가 하나도 없는 영역은 전체에서 낸다(예: 청해·독해는 지금 N1 자료뿐)
const LVS=['N1','N2','N3','N4','N5'];
const inLv=x=>!x||x.lv==null||S.levels.includes(x.lv);
const lvPool=a=>{const f=a.filter(inLv);return f.length?f:a};
// 청해는 두 책을 번갈아
const LISTEN=(()=>{const g=D.listen.filter(x=>x.id.startsWith('GS')),k=D.listen.filter(x=>!x.id.startsWith('GS')),o=[];
  for(let i=0;i<Math.max(g.length,k.length);i++){if(g[i])o.push(g[i]);if(i%2===0&&k[i/2])o.push(k[i/2])}return o.concat(k.slice(Math.ceil(g.length/2)))})();
const LISTEN_U=[...new Map(LISTEN.map(x=>[x.id,x])).values()];
function buildSession(){
  const s={date:today(),steps:[],next:{},res:[]};
  const L=take('listen',lvPool(LISTEN_U),3);s.next.listen=L.next;L.items.forEach(x=>s.steps.push({k:'listen',id:x.id}));
  const K=take('kanji',D.kanji,3);s.next.kanji=K.next;K.items.forEach(x=>s.steps.push({k:'kanji',id:x.id}));
  // 문자어휘·문법은 실전모의고사 N1에서. 유형이 고루 섞이게 유형별로 돌아가며 늘어놓음
  const rr=a=>{const g={};a.forEach(x=>(g[x.type]=g[x.type]||[]).push(x));const q=Object.values(g),o=[];while(q.some(x=>x.length))q.forEach(x=>x.length&&o.push(x.shift()));return o};
  const MJ=take('moji',rr(lvPool(D.mock.filter(x=>['kanji_reading','orthography','word_formation','context','paraphrase','usage'].includes(x.type)))),5);s.next.moji=MJ.next;MJ.items.forEach(x=>s.steps.push({k:'moji',id:x.id}));
  const GF=take('gf',lvPool(D.mock.filter(x=>x.type==='grammar_form')),2),SO=take('so',lvPool(D.mock.filter(x=>x.type==='sentence_order')),1);
  s.next.gf=GF.next;s.next.so=SO.next;GF.items.concat(SO.items).forEach(x=>s.steps.push({k:'gram',id:x.id}));
  // 오늘 문법 문항의 문형 → 문형 카드·작문
  let pt=GF.items.concat(SO.items).find(x=>x.pattern);
  if(!pt){const P=lvPool(D.mock.filter(x=>x.pattern)),pi=(S.ptr.pt||0)%P.length;pt=P[pi];s.next.pt=pi+1}
  // 필수어휘 5000(800급, 예문 있는 것) 3개
  if(D.v5&&D.v5.length){const V=take('v5',lvPool(D.v5).filter(v=>!S.known.includes(v.jp)),3);s.next.v5=V.next;V.items.forEach(x=>s.steps.push({k:'v5',id:x.id}))}
  // 문형 630: N1·N2(본문 ★1·★2) 문형을 책 순서대로 하루 1개, 모른다고 한 문형은 먼저
  if(D.p630&&D.p630.length){const P6=take('p630',lvPool(D.p630),1);s.next.p630=P6.next;P6.items.forEach(x=>s.steps.push({k:'p630',id:x.id}))}
  s.steps.push({k:'pat2',id:pt.id});
  const tr=(S.ptr.tr||0)%D.trans.length,a=D.trans[tr],b=D.trans[(tr+1)%D.trans.length];s.next.tr=tr+2;
  s.steps.push({k:'ilyeok',ja:a[0],ko:a[1],src:a[2]});
  s.steps.push({k:'hanyeok',ja:b[0],ko:b[1],src:b[2]});
  // 글의 문법(모의고사 지문 빈칸 5문항): 남은 지문이 있을 때만. 독해는 따로 청해 문제3 대본
  const TG=[...new Set(lvPool(D.mock.filter(x=>x.type==='text_grammar')).map(x=>x.passage))],tgi=S.ptr.tg||0;
  if(tgi<TG.length){D.mock.filter(x=>x.passage===TG[tgi]).forEach(x=>s.steps.push({k:'tg',id:x.id}));s.next.tg=tgi+1}
  // 독해: 급소공략 N1 독해. 지문 하나(단문 1문항, 중문 3, 장문 4 …)를 하루에
  const RU=[];lvPool(D.reading).forEach(x=>{const u=RU[RU.length-1];if(x.pid&&u&&u.pid===x.pid)u.ids.push(x.id);else RU.push({pid:x.pid,ids:[x.id]})});
  const ri=(S.ptr.reading||0)%RU.length;s.next.reading=ri+1;RU[ri].ids.forEach(id=>s.steps.push({k:'reading',id}));
  const ti=(S.ptr.talk||0)%D.talk.length;s.next.talk=ti+1;s.steps.push({k:'talk',id:D.talk[ti].id});
  s.steps.push({k:'write2',id:pt.id});
  s.i=0;return s;
}
function find(k,id){if(k==='listen')return LISTEN_U.find(x=>x.id===id);if(k==='kanji')return D.kanji.find(x=>x.id===id);
  if(k==='vocab')return D.vocab.find(x=>x.jp===id);if(k==='pat')return D.pats.find(x=>x.no===id);
  if(k==='reading')return D.reading.find(x=>x.id===id);if(k==='mock')return D.mock.find(x=>x.id===id);if(k==='talk')return D.talk.find(x=>x.id===id);if(k==='v5')return(D.v5||[]).find(x=>x.id===id);if(k==='p630')return(D.p630||[]).find(x=>x.id===id)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let player=null;
function play(list){if(player){player.pause()}let i=0;const nxt=()=>{if(i>=list.length)return;player=new Audio(AU(list[i++]));player.onended=()=>setTimeout(nxt,600);player.play().catch(()=>{})};nxt()}
// 답 기록: 걸린 시간(ms, 10분까지)·확신도(conf)를 붙이고, 객관식은 풀이 이력(hist)에도 한 줄씩 남긴다(난이도 측정용)
function rec(r){const s=S.cur;r.ms=Math.min(Date.now()-(s.t0||Date.now()),600000);if(CONF_K.includes(r.k))r.conf=(s.conf||{})[s.i]||'sure';s.res[s.i]=r;
  if((r.k==='reading'||r.k==='tg')&&r.id!=null)S.seen[r.k+'|'+r.id]={t:Date.now(),ok:r.ok};
  if('ok' in r&&r.id!=null){S.hist.push({t:Date.now(),d:s.date,k:r.k,id:r.id,ok:r.ok,ms:r.ms,...(r.conf?{c:r.conf}:{}),...(s.review?{m:'rv'}:s.test?{m:'lt'}:s.custom?{m:'pk'}:{})});if(S.hist.length>20000)S.hist=S.hist.slice(-20000)}
  save()}
function mark(kind,id,ok){const w=new Set(S.wrong[kind]||[]);ok?w.delete(id):w.add(id);S.wrong[kind]=[...w].slice(-60);S.seen[kind+'|'+id]={t:Date.now(),ok}}
// 오답노트: 틀린 객관식, 주관식 답, 질문·의견을 문항별로 쌓는다(기기 사이에 합칠 수 있게 t=시각을 붙임)

const recDump=()=>({fmt:'LAREC1',at:new Date().toISOString(),ptr:S.ptr,wrong:S.wrong,log:S.log,known:S.known,notes:S.notes,seen:S.seen,judges:S.judges,hist:S.hist,ux:S.ux,tests:S.tests,wsc:S.wsc,words:S.words});

function recParse(t){t=t.trim();if(t.startsWith('LAREC1:'))t=decodeURIComponent(escape(atob(t.slice(7).replace(/\s+/g,''))));const o=JSON.parse(t);if(!o||o.fmt!=='LAREC1')throw new Error('LA 기록 코드가 아닙니다');return o}
// 합치기: 지우지 않고 더한다. 같은 문항을 두 기기에서 풀었으면 나중 결과(seen.t)를 따른다
function recMerge(o){
  for(const[k,v]of Object.entries(o.seen||{})){const c=S.seen[k];if(!c||v.t>c.t)S.seen[k]=v}
  for(const[k,v]of Object.entries(o.notes||{})){const c=S.notes[k];if(!c){S.notes[k]=v;continue}
    const have=new Set(c.a.map(x=>x.t));v.a.forEach(x=>{if(!have.has(x.t))c.a.push(x)});c.a.sort((a,b)=>a.t-b.t)}
  for(const k of new Set([...Object.keys(S.wrong),...Object.keys(o.wrong||{})])){
    S.wrong[k]=[...new Set([...(S.wrong[k]||[]),...((o.wrong||{})[k]||[])])].filter(id=>{const v=S.seen[k+'|'+id];return !v||!v.ok}).slice(-120)}
  const lk=x=>x.date+'|'+x.ok+'|'+x.n,lg=new Map(S.log.map(x=>[lk(x),x]));(o.log||[]).forEach(x=>lg.has(lk(x))||lg.set(lk(x),x));
  S.log=[...lg.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).slice(-60);
  for(const[d,v]of Object.entries(o.judges||{})){const c=S.judges[d];if(!c||v.t>c.t)S.judges[d]=v}
  for(const[k,v]of Object.entries(o.notes||{})){const c=S.notes[k];if(c&&v.st&&(!c.st||v.st.t>c.st.t))c.st=v.st}
  S.known=[...new Set([...S.known,...(o.known||[])])];
  for(const[k,v]of Object.entries(o.ptr||{}))S.ptr[k]=Math.max(S.ptr[k]||0,v);
  {const hk=x=>x.t+'|'+x.k+'|'+x.id,h=new Map(S.hist.map(x=>[hk(x),x]));(o.hist||[]).forEach(x=>h.has(hk(x))||h.set(hk(x),x));S.hist=[...h.values()].sort((a,b)=>a.t-b.t).slice(-20000)}
  {const m=new Map(S.tests.map(x=>[x.t,x]));(o.tests||[]).forEach(x=>m.has(x.t)||m.set(x.t,x));S.tests=[...m.values()].sort((a,b)=>a.t-b.t)}
  for(const[d,v]of Object.entries(o.wsc||{})){const c=S.wsc[d];if(!c||v.t>c.t)S.wsc[d]=v}
  {const u=new Map(S.ux.map(x=>[x.t,x]));(o.ux||[]).forEach(x=>u.has(x.t)||u.set(x.t,x));S.ux=[...u.values()].sort((a,b)=>a.t-b.t)}
  for(const[k,v]of Object.entries(o.words||{})){const c=S.words[k];if(!c||(v.u||0)>(c.u||0))S.words[k]=v}
  save()}

function parseW(t){const re=/쓰기\s*점수\s*[:：]\s*문법\s*(\d(?:\.\d)?)\s*\/\s*5[^\d]*?(\d(?:\.\d)?)\s*\/\s*5[^\d]*?(\d(?:\.\d)?)\s*\/\s*5/g,o=[];let m;while((m=re.exec(t)))o.push([+m[1],+m[2],+m[3]].map(v=>Math.min(5,v)));return o}

// 사전(D.dict = [단어, 읽기, 뜻])은 문제 팩 안의 책 단어 모음. 문장에서 가장 긴 단어부터 찾아 읽기·뜻을 보여 준다.
// 동사·형용사는 끝 글자를 뗀 줄기로도 찾는다(訪れる → 訪れた). 사전에 없는 한자어는 네이버 사전 링크만 준다.
const KJ=/[㐀-鿿々]/;
let DX=null;
function dx(){if(DX)return DX;const m=new Map(),st=new Map();let mx=2;
  (D.dict||[]).forEach(e=>{const w=e[0].replace(/^[～〜]+|[～〜]+$/g,'');if(w.length<2)return;if(!m.has(w))m.set(w,e);mx=Math.max(mx,w.length);
    const s=w.endsWith('する')?w.slice(0,-2):w.replace(/[だなるうくぐすつぬぶむい]$/,'');
    if(s!==w&&s.length>=2&&KJ.test(s)&&!m.has(s)&&!st.has(s))st.set(s,e)});
  return DX={m,st,mx}}
const dHit=(t,i)=>{const{m,st,mx}=dx();for(let l=Math.min(mx,t.length-i);l>=2;l--){const s=t.substr(i,l),e=m.get(s)||st.get(s);if(e&&(KJ.test(s)||l>=4))return{e,sf:s}}return null};
function wordsIn(t){t=String(t||'').replace(/[【】\[\]]/g,'');const out=[],seen=new Set();
  for(let i=0;i<t.length;){const h=dHit(t,i);
    if(h){if(!seen.has(h.e[0])){seen.add(h.e[0]);out.push(h)}i+=h.sf.length;continue}
    if(KJ.test(t[i])){let j=i;while(j<t.length&&KJ.test(t[j])&&(j===i||!dHit(t,j)))j++;const sf=t.slice(i,j);
      if(sf.length>=2&&!seen.has(sf)){seen.add(sf);out.push({e:[sf,'',''],sf,unk:true})}i=j;continue}
    i++}
  return out}
// 문항의 일본어 글(문제·보기·지문·예문)
function stepText(k,id,st){const J=a=>a.filter(Boolean).join('\n');
  if(['moji','gram','tg','pat2','write2'].includes(k)){const x=find('mock',id);return x?J([x.passage,x.stem,...x.choices]):''}
  const x=id!=null&&['listen','kanji','vocab','v5','p630','reading','talk','pat'].includes(k)?find(k,id):null;
  if(k==='listen'&&x)return J([x.q.ja,...x.ch.map(c=>c[0])]);
  if(k==='kanji'&&x)return J([x.s,x.a,x.b]);
  if(k==='vocab'&&x)return J([x.jp,x.ctx&&x.ctx[0]]);
  if(k==='v5'&&x)return J([x.jp,x.ctx&&x.ctx[0],...(x.rel||[]).map(r=>r[0])]);
  if(k==='p630'&&x)return J([x.pattern,...x.ex.map(e=>e[0])]);

function searchDict(q){const{m}=dx(),out=[],seen=new Set(),add=e=>{if(e&&!seen.has(e[0])&&out.length<12){seen.add(e[0]);out.push({e,sf:e[0]})}};

let LV_SEL=null;
// 레벨 테스트: 고른 레벨 문항으로 실제 시험 비율을 줄인 30문항 안팎(문자·어휘 10, 문법 6, 글의 문법 1지문, 독해 3지문, 청해 5). 안 푼 문제 먼저
function buildTest(lv){const keep=S.levels;S.levels=[lv];try{const st=[...pickSteps('moji',10),...pickSteps('gram',6),...pickSteps('tg',1),...pickSteps('reading',3),...pickSteps('listen',5)];
  const g=st.filter(x=>x.k==='gram').map(x=>find('mock',x.id)).find(x=>x&&x.pattern)||shuffle(lvPool(D.mock.filter(x=>x.pattern)))[0],tr=D.trans[Math.floor(Math.random()*D.trans.length)];
  if(g)st.push({k:'write2',id:g.id});if(tr)st.push({k:'hanyeok',ja:tr[0],ko:tr[1],src:tr[2]});return st}finally{S.levels=keep}}
function testScore(s){const r={};for(const[k,,ks]of SEC){const L=s.steps.map((st,i)=>({st,r:s.res[i]})).filter(o=>ks.includes(o.st.k)&&o.r&&'ok' in o.r);r[k]=L.length?Math.round(L.reduce((a,o)=>a+(o.r.ok?(o.r.conf==='unsure'?0.5:1):0),0)/L.length*60):0;r[k+'_n']=L.length}return r}
// AI에게 보낼 실력 리포트(무료 모델용): 숫자와 약점, 최근 오답 예를 묶고 분석·계획을 요청
function levelReport(lv){const e=estimate(lv),ty=typeStats(lv),cb=calib(lv),w=weekly(lv).slice(-8),T=S.tests.filter(t=>t.lv===lv).slice(-3);
  const L=[`[LA 일본어 실력 리포트] ${today()} · 목표 레벨 ${lv}`,`※ JLPT식 60점 환산 추정(앱이 계산): 처음 푼 문제 최근 60개, 애매하게 맞힌 건 0.5점`];
  SEC.forEach(([s,n])=>L.push(`- ${n}: ${e[s].sc==null?'기록 부족':e[s].sc+'/60'} (${e[s].n}문항)`));
  if(e.total!=null)L.push(`- 합계 ${e.total}/180`);
  if(w.length>1)L.push(`\n주별 추세: `+w.map(p=>{const d=new Date(p.w);return `${d.getMonth()+1}/${d.getDate()} 언${p.e.lang.sc??'-'}·독${p.e.read.sc??'-'}·청${p.e.listen.sc??'-'}`}).join(' → '));
  if(T.length)L.push(`레벨 테스트: `+T.map(t=>`${t.date} ${t.sc.lang}/${t.sc.read}/${t.sc.listen}`).join(', '));
  if(ty.length)L.push(`\n유형별 정답률(낮은 순): `+ty.slice(0,8).map(t=>`${t.t} ${pct(t.p)}(${t.n}문항, 평균 ${Math.round(t.ms/1000)}초)`).join(' / '));
  L.push(`확신도: 확신했는데 틀림 ${pct(cb.wrongSure)} · 애매했는데 맞힘 ${pct(cb.rightUnsure)} · 애매 비율 ${pct(cb.unsureRate)}`);
  {const W=wSeries();if(W.length)L.push(`쓰기 점수(AI 판정, 15점 만점 평균): `+W.slice(-6).map(w=>`${w.d.slice(5)} ${w.avg.toFixed(1)}`).join(' → ')+` · 항목 평균 문법 ${wAvg(0)}/5 · 문형 ${wAvg(1)}/5 · 자연스러움 ${wAvg(2)}/5`)}
  const days=new Set(S.log.filter(l=>!l.kind).map(l=>l.date));L.push(`학습 일수 ${days.size}일 · 연속 ${streak()}일 · 복습 대기 ${Object.values(S.notes).filter(x=>noteStat(x)==='open').length}문제`);
  const wr=S.hist.filter(h=>!h.ok&&h.m!=='rv').slice(-8).map(h=>{const x=hItem(h);if(!x)return null;const t=x.stem||x.q&&x.q.ja||'';return `- [${KN[h.k]||h.k}${x.type&&TYN[x.type]&&TYN[x.type]!==KN[h.k]?' · '+TYN[x.type]:''}] ${String(t).replace(/[【】]/g,'').slice(0,60)}`}).filter(Boolean);
  if(wr.length)L.push(`\n최근 틀린 문제 예:\n`+wr.join('\n'));
  L.push(`\n요청: 위 숫자로 (1) 지금 ${lv} 기준 수준과 합격 가능성, (2) 가장 먼저 보완할 영역·유형 3가지와 이유, (3) 앞으로 2주 공부 방법(하루 20분 기준)을 알려 주세요. 숫자가 적은 영역은 추정이 불안정하다는 점도 감안해 주세요.`);
  return L.join('\n')}
// 틀린 어휘·한자 문제의 단어는 단어장에 자동으로 넣는다(어휘 카드·청해 단어·한자 퀴즈·모의고사 한자 읽기/표기)
function autoWords(s){s.steps.forEach((st,i)=>{const r=s.res[i];if(!r||r.ok!==false)return;let e=null,sn='';const dm=w=>dx().m.get(w)||(wordsIn(w).find(h=>!h.unk&&h.sf.length>=w.length-3)||{}).e||['','',''];
  if(st.k==='v5'){const x=find('v5',st.id);if(x){e=[x.jp,x.yomi||dm(x.jp)[1],x.ko];sn=x.ctx?x.ctx[0]:''}}
  else if(st.k==='vocab'){const x=find('vocab',st.id);if(x){e=[x.jp,dm(x.jp)[1],x.ko];sn=x.ctx?x.ctx[0]:''}}
  else if(st.k==='kanji'){const x=find('kanji',st.id);if(x&&x.t){const w=x.sec===1?x.t:x[x.ans],rd=x.sec===1?x[x.ans]:x.t;e=[w,rd,dm(w)[2]];sn=x.s}}
  else if(st.k==='moji'){const x=find('mock',st.id),u=x&&(x.stem.match(/【(.+?)】/)||[])[1];
    // 활용형(飽きられて)은 사전에서 찾으면 사전형(飽きる)으로 넣는다
    if(u&&x.type==='kanji_reading'){const d=dm(u);e=d[0]&&d[0]!==u?[d[0],d[1]||x.choices[x.answer-1],d[2]]:[u,x.choices[x.answer-1],d[2]]}
    if(u&&x.type==='orthography'){const w=x.choices[x.answer-1],d=dm(w);e=d[0]&&d[0]!==w?[d[0],d[1]||u,d[2]]:[w,u,d[2]]}sn=x?x.stem.replace(/[【】]/g,''):''}
  if(!e||!e[0]||liveW(e[0]))return;const now=Date.now(),o=S.words[e[0]]||{};
  S.words[e[0]]={w:e[0],r:o.r||e[1]||'',ko:o.ko||e[2]||'',t:now,u:now,ok:0,n:o.n||0,st:'',del:false,src:{k:st.k,id:st.id,d:s.date,auto:1},s:sentOf(sn,e[0])||String(sn).slice(0,90)}})}
// 끝 화면: 점수 + 틀린 것만 + 버튼 두 개(판정 요청문 복사 · 처음으로). 판정 붙여넣기는 그 아래
function finish(){
  const s=S.cur,rp=report(s),kind=s.review?'review':s.test?'test':s.custom?'custom':'';CURLV=null;$('#bar').innerHTML='';
  if(!s.closed){Object.assign(S.ptr,s.next);S.log.push({date:s.date,ok:rp.ok,n:rp.n,...(kind?{kind}:{})});S.log=S.log.slice(-200);autoWords(s);addNotes(s);if(s.test){s.sc=testScore(s);S.tests.push({t:Date.now(),date:s.date,lv:s.lv,sc:s.sc})}s.closed=true;save();syncNow().then(r=>{const e=$('#fsync');if(e&&r!=='off')e.textContent=r==='ok'?'기록을 동기화했습니다.':'동기화 실패: '+SY.err})}
  const wrong=s.steps.map((st,i)=>({st,r:s.res[i]})).filter(x=>x.r&&(x.r.ok===false||x.r.conf==='unsure'));
  const title=x=>{const st=x.st,m=['moji','gram','tg'].includes(st.k)?find('mock',st.id):null,o=m||(OBJ.includes(st.k)?find(st.k,st.id):null);
    const t=m?m.stem:st.k==='listen'&&o?o.q.ja:st.k==='kanji'&&o?o.s:st.k==='v5'&&o?o.jp:st.k==='p630'&&o?o.pattern:st.k==='reading'&&o?o.q.ja:st.id||'';
    return `${KN[st.k]||st.k}${x.r.ok===false?'':' (애매)'} · ${String(t).replace(/[【】]/g,'').slice(0,40)}`};
  const sub=s.steps.some(st=>['ilyeok','hanyeok','write','write2'].includes(st.k));
  const nm=kind==='review'?'복습':kind==='test'?'레벨 테스트 '+(s.lv||''):kind==='custom'?'골라 풀기':'오늘 학습';
  $('#view').innerHTML=card('결과 · '+nm,`<div class="res">객관식 ${rp.ok}/${rp.n} 정답</div>
   ${s.sc?scoreBoard(s.sc,s.lv,'레벨 테스트 '+(s.lv||'N1')+' 결과')+'<p class="note">「실력」 탭의 그래프와 테스트 기록에 들어갔습니다. 문항 수가 적은 영역(특히 독해)은 오차가 큽니다.</p>':''}
   ${wrong.length?`<details open><summary>복습에 들어간 문제 ${wrong.length}</summary>${wrong.map(x=>`<p class="note">${esc(title(x))}</p>`).join('')}</details>`:'<p class="note">틀리거나 애매한 문제가 없어요.</p>'}
   <p>${sub?'일역·한역·작문과 오답 이유를 판정받으려면 판정 요청문을 복사해 AI(유료·무료 아무거나)에게 붙여 넣으세요.':'질문이나 오답 이유를 물어보려면 판정 요청문을 복사해 AI에게 붙여 넣으세요.'}</p>
   <div class="row"><button class="pri" id="copy">판정 요청문 복사</button><button id="again">처음으로</button></div><p class="note" id="msg"></p>
   <details><summary>판정 요청문 내용 보기</summary><pre class="out" id="out">${esc(rp.text)}</pre></details>
   <p class="note" id="fsync">${SY.repo?'동기화 중…':''}</p>${judgeUI(s.date)}`);bindJudge(s.date);
  $('#copy').onclick=()=>{navigator.clipboard.writeText(rp.text).then(()=>$('#msg').textContent='복사했습니다. AI 채팅에 붙여 넣으세요.',()=>{const d=$('#out').closest('details');d.open=true;const r=document.createRange();r.selectNodeContents($('#out'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$('#msg').textContent='복사 버튼이 막혀 있어 내용을 선택해 두었습니다. 직접 복사하세요.'})};
  $('#again').onclick=()=>{const back=kind==='review'?'review':kind==='test'?'level':kind==='custom'?'pick':'today';S.cur=active(S.pause)?S.pause:null;S.pause=null;VIEW=back;save();render()};
}
if(S.cur&&S.cur.closed&&S.cur.date!==today())S.cur=null;
if(S.pause&&S.pause.closed)S.pause=null;
render();
syncNow().then(r=>{if(r==='ok'&&VIEW!=='sess')render()});
</script>
<script>
/* 루틴 팩(LARTN1)을 기기(IndexedDB)에서 꺼내 본 화면을 실행. 없으면 파일을 고르게 한다. 팩은 저장소에 없음 */
(function(){
  const DB='la-routine',ST='pack';
  const idb=()=>new Promise((ok,ng)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
  const get=async()=>{const d=await idb();return new Promise(ok=>{const q=d.transaction(ST).objectStore(ST).get('cur');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})};
  const put=async v=>{const d=await idb();return new Promise((ok,ng)=>{const tx=d.transaction(ST,'readwrite');tx.objectStore(ST).put(v,'cur');tx.oncomplete=ok;tx.onerror=()=>ng(tx.error)})};
  const run=p=>{window.__PACK=p;window.__AUD=p.audio;const s=document.createElement('script');s.textContent=document.getElementById('main').textContent;document.body.appendChild(s);
    const sub=document.getElementById('sub');if(sub)sub.insertAdjacentHTML('beforeend',` · 문제 ${p.built} · 음원 ${Object.keys(p.audio||{}).length}개 <a href="#" id="repack">팩 추가·교체</a>`);
    const rp=document.getElementById('repack');if(rp)rp.onclick=e=>{e.preventDefault();ask(true)}};
  // 비공개 기록 저장소(packs/manifest.json)에서 팩 자동 받기. 저장소·토큰은 앱의 자동 동기화 설정과 같은 값(la-sync-v1)
  let SY;try{SY=JSON.parse(localStorage.getItem('la-sync-v1'))||{}}catch(e){SY={}}
  const raw=async path=>{const r=await fetch('https://api.github.com/repos/'+SY.repo+'/contents/'+encodeURI(path),{cache:'no-store',headers:{Authorization:'Bearer '+SY.token,Accept:'application/vnd.github.raw'}});if(!r.ok)throw new Error(path+' ('+r.status+')');return r.json()};
  async function fromRepo(old,say){const man=await raw('packs/manifest.json');old=old||{format:'LARTN1',audio:{}};
    const all={format:'LARTN1',data:old.data,built:old.built,audio:Object.assign({},old.audio||{}),av:Object.assign({},old.av||{})};let ch=false;
    if(man.built!==old.built){say&&say('문제 팩 받는 중…');const p=await raw(man.data);all.data=p.data;all.built=p.built;ch=true}
    for(const a of man.audio){if(all.av[a.path]!==a.v){say&&say('음원 받는 중… ('+a.path.replace('packs/','')+')');const p=await raw(a.path);Object.assign(all.audio,p.audio);all.av[a.path]=a.v;ch=true}}
    if(ch)await put(all);return{all,ch}}
  function ask(again){
    const v=document.getElementById('view');
    v.innerHTML=`<section class="card"><div class="kind">루틴 팩 불러오기</div>
      <p>이 앱에는 문제가 들어 있지 않습니다. 드라이브나 메일로 받은 <b>루틴 팩 파일</b>을 골라 주세요(여러 개 함께 골라도 됩니다). 이 기기에 저장되어 다음부터는 바로 열립니다.</p>
      <p class="note">처음: 「LA_루틴_문제_날짜」와 「LA_루틴_음원1·2…」를 모두. 문제가 늘면 「문제」 파일 하나만 새로 고르면 되고, 음원은 새 음원 파일이 있을 때만.</p>
      <input type="file" id="pf" accept=".json,application/json" multiple><p class="note" id="pm"></p>
      <details ${SY.repo?'':'open'}><summary>기록 저장소에서 자동으로 받기</summary><p class="note">앱의 「자동 동기화 설정」과 같은 저장소·토큰입니다. 한 번 넣으면 새 팩이 올라올 때마다 자동으로 받습니다.</p>
      <input id="ar" value="${SY.repo||'baka1976/la-records'}" autocomplete="off" spellcheck="false"><input id="at" type="password" placeholder="토큰" autocomplete="off" spellcheck="false">
      <div class="row"><button class="pri" id="ag">저장소에서 받기</button></div></details>
      ${again?'<div class="row"><button id="pc">취소</button></div>':''}</section>`;
    document.getElementById('ag').onclick=async()=>{const m=document.getElementById('pm');const repo=document.getElementById('ar').value.trim(),tok=document.getElementById('at').value.replace(/\s+/g,'');
      if(!repo||(!tok&&!SY.token)){m.textContent='저장소와 토큰을 넣어 주세요.';return}SY.repo=repo;if(tok)SY.token=tok;try{localStorage.setItem('la-sync-v1',JSON.stringify(SY))}catch(e){}
      try{await fromRepo(await get(),t=>m.textContent=t);m.textContent='받았습니다.';setTimeout(()=>location.reload(),500)}catch(err){m.textContent='받지 못했습니다: '+err.message}};
    const pc=document.getElementById('pc');if(pc)pc.onclick=()=>location.reload();
    document.getElementById('pf').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;const m=document.getElementById('pm');m.textContent='읽는 중…';
      try{const ps=await Promise.all(fs.map(f=>f.text().then(JSON.parse)));
        if(ps.some(p=>p.format!=='LARTN1'))throw new Error('루틴 팩 파일이 아닙니다');
        const old=(await get())||{format:'LARTN1',audio:{}};
        const ds=ps.filter(p=>p.data).sort((a,b)=>a.built<b.built?1:-1);
        const all={format:'LARTN1',data:ds.length?ds[0].data:old.data,built:ds.length?ds[0].built:old.built,audio:Object.assign({},old.audio||{},...ps.map(p=>p.audio||{}))};
        await put(all);if(!all.data){m.textContent=`음원 ${Object.keys(all.audio).length}개를 저장했습니다. 이제 문제 파일(LA_루틴_문제_날짜)을 골라 주세요.`;e.target.value='';return}const na=Object.keys(all.audio).length;m.textContent=`저장했습니다(문제 ${all.built}, 음원 ${na}개).`;setTimeout(()=>location.reload(),600)}catch(err){m.textContent='불러오지 못했습니다: '+err.message}};
  }
  get().then(async p=>{
    if(p&&p.format==='LARTN1'&&p.data){run(p);
      if(SY.repo&&SY.token)fromRepo(p).then(r=>{if(r.ch){const sub=document.getElementById('sub');if(sub)sub.insertAdjacentHTML('beforeend',' · <b>새 팩을 받았습니다</b> <a href="#" onclick="location.reload();return false">새로고침</a>')}}).catch(()=>{});return}
    if(SY.repo&&SY.token){try{const v=document.getElementById('view');v.innerHTML='<section class="card"><p id="pm">기록 저장소에서 팩을 받는 중…</p></section>';const r=await fromRepo(p,t=>{const m=document.getElementById('pm');if(m)m.textContent=t});run(r.all);return}catch(e){}}
    ask(false)}).catch(()=>ask(false));
})();
</script>
