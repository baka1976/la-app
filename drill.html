<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LA 통역 드릴</title>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunken:#f5f7fa; --ink:#1b2331; --muted:#5a6477; --line:#d6dce5;
  --accent:#1f4e8c; --accent-soft:#e2eaf6; --on-accent:#ffffff;
  --red:#c0261b; --red-soft:#fde4e1; --ok:#1d7448; --ok-soft:#e1f2e8; --warn:#9a5a00; --warn-soft:#fbefd9;
  --f-jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-jps:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-ui:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --sunken:#151a22; --ink:#e5e9f0; --muted:#9aa4b5; --line:#2d3644;
  --accent:#8fb2ec; --accent-soft:#1e2b40; --on-accent:#0f1724; --red:#ff8b7f; --red-soft:#3d1d1a; --ok:#62c693; --ok-soft:#173327; --warn:#efb45e; --warn-soft:#3a2c16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --sunken:#151a22; --ink:#e5e9f0; --muted:#9aa4b5; --line:#2d3644;
  --accent:#8fb2ec; --accent-soft:#1e2b40; --on-accent:#0f1724; --red:#ff8b7f; --red-soft:#3d1d1a; --ok:#62c693; --ok-soft:#173327; --warn:#efb45e; --warn-soft:#3a2c16; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hrow{display:flex;align-items:baseline;gap:10px;padding-top:12px}
.brand{font-weight:700;font-size:1.05rem}
.ver{font-size:.78rem;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:.92rem;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
main.wrap{padding-block:18px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;min-width:0}
h2{font-size:1.02rem;margin:0}
h3{font-size:.85rem;margin:0;color:var(--muted)}
p{margin:0}
.note{font-size:.82rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:8px;padding:9px 16px;font:inherit;font-size:.92rem;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.rule b{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.tag{padding:2px 9px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);color:var(--muted)}
.ko{font-size:1.25rem;line-height:1.75;font-weight:600}
.ko.memo{font-size:1.05rem;font-weight:500;white-space:pre-line}
.ja{font-family:var(--f-jp);font-size:1.2rem;line-height:2.2}
.ja.s{font-size:1rem;line-height:2}
ruby rt{font-family:var(--f-jps);font-size:.55em;color:var(--muted)}
.timer{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .2s linear}
.big{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;color:var(--accent)}
.pts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.pts label{display:grid;grid-template-columns:22px 1fr;gap:8px;cursor:pointer;align-items:start}
.pts input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--accent)}
.alt{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--line)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:12px 0;font-size:1.05rem}
.grade .o[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grade .t[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.grade .x[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:.9rem;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:.8rem;line-height:1.5}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.sum div{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid}
.sum b{font-size:1.4rem}
.sum span{font-size:.76rem;color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--red)}
.hide{display:none!important}
.meas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem}
.meas b{font-family:var(--f-mono)}
.auto{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:.88rem}
.auto .heard{font-family:var(--f-jps);font-size:.95rem;line-height:1.8}
.lvl{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s linear}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.opt input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.ko.listen{font-size:1.05rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:14px;text-align:center}
.rec,.hfr{display:grid;gap:6px}
.hfr{border-top:1px solid var(--line);padding-top:12px}
audio{max-width:100%}
@media (max-width:480px){.ko{font-size:1.12rem}.ja{font-size:1.08rem}.card{padding:15px}}
</style>
<style>
/* ==== LA 디자인 v3 — 쪽빛 학습 노트 (문제은행·통역 드릴 공통) ==== */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#f4f6fa; --ink:#172033; --muted:#5d6880; --line:#e1e6ee;
  --accent:#2a4c9a; --accent-2:#5a80d8; --accent-soft:#e8eefb; --accent-ink:#ffffff; --on-accent:#ffffff;
  --ok:#1f8a5a; --ok-soft:#e3f4ec; --bad:#c43b2f; --bad-soft:#fde8e5; --red:#c43b2f; --red-soft:#fde8e5; --warn:#a8650a; --warn-soft:#fcf0dc;
  --shadow:0 1px 2px rgba(20,32,60,.05),0 8px 24px -12px rgba(20,32,60,.18);
  --shadow-up:0 2px 4px rgba(20,32,60,.06),0 14px 30px -12px rgba(20,32,60,.24);
  --ease:cubic-bezier(.2,.7,.2,1); --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#181e28; --sunken:#131821; --ink:#e6eaf2; --muted:#9ba5b8; --line:#283141;
  --accent:#8fb0f0; --accent-2:#6d8fe0; --accent-soft:#1c2840; --accent-ink:#0c1424; --on-accent:#0c1424;
  --ok:#5fcf98; --ok-soft:#14301f; --bad:#ff8f84; --bad-soft:#3a1c1a; --red:#ff8f84; --red-soft:#3a1c1a; --warn:#f0b866; --warn-soft:#3a2b15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); --shadow-up:0 2px 4px rgba(0,0,0,.35),0 14px 30px -12px rgba(0,0,0,.6);
}}
body{background:radial-gradient(1200px 420px at 50% -120px,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed}

/* 머리: 반투명 고정 + 탭 밑줄이 미끄러지듯 */
header{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 3px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.ver{padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
nav button{position:relative;border-bottom-color:transparent!important;transition:color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--accent)!important}
nav button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));animation:tabIn .35s var(--ease) both}

/* 카드: 선 대신 그림자, 둥글게 */
.card{border-color:color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--r);box-shadow:var(--shadow)}
.item{border-color:color-mix(in srgb,var(--line) 75%,transparent);border-radius:12px;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
button.item:hover{transform:translateY(-2px);box-shadow:var(--shadow-up);border-color:var(--accent)}
.tag{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--surface)));border-radius:7px}
.watch{border-radius:12px}
details{border-radius:10px}

/* 버튼·칩: 누를 때 눌리고, 주 버튼은 그라디언트 */
.btn,.chip,.seg button,.grade button,.opt{transition:transform .12s var(--ease),background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.btn{border-radius:10px}
.btn:active:not(:disabled),.chip:active,.seg button:active,.grade button:active{transform:scale(.96)}
.btn.primary,.btn.pri{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover:not(:disabled),.btn.pri:hover:not(:disabled){box-shadow:0 8px 18px -6px color-mix(in srgb,var(--accent) 75%,transparent);transform:translateY(-1px)}
.chip[aria-pressed="true"]{box-shadow:0 2px 8px -3px color-mix(in srgb,var(--accent) 60%,transparent)}
.seg{border-radius:10px}

/* 진행 막대·타이머 */
.prog{height:6px;border-radius:3px;background:var(--sunken)}
.prog i{background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;transition:width .45s var(--ease)}
.timer{height:8px;border-radius:4px}
.timer i{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;box-shadow:0 0 10px color-mix(in srgb,var(--accent-2) 60%,transparent)}
.big{font-variant-numeric:tabular-nums;animation:tick 1s steps(1) infinite}
.lvl{height:8px;border-radius:4px}
.lvl i{background:linear-gradient(90deg,var(--ok),var(--accent-2));border-radius:4px}

/* 문제 풀이: 정답은 살짝 튀고, 오답은 흔들림 */
.opt{border-radius:12px}
.opt:hover:not(:disabled){transform:translateX(3px);box-shadow:var(--shadow)}
.opt.ok{animation:okPop .5s var(--ease);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.opt.bad{animation:shake .4s ease}
.fb{animation:rise .35s var(--ease) both;border-radius:12px}
.stem{letter-spacing:.01em}
.score{background:linear-gradient(135deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.score .muted{-webkit-text-fill-color:var(--muted)}
.grade button[aria-pressed="true"]{animation:okPop .35s var(--ease)}
.wrong{border-radius:12px} .model{border-radius:12px;animation:rise .35s var(--ease) both}

/* 그래프·표가 그려지며 나타남 */
.bar .t i,.pbar .t i,.para .t i,.prog i{transform-origin:left}
.bar .t i,.pbar .t i{animation:grow .8s var(--ease) both .1s}
table.heat td{animation:fade .5s ease both}
.stat div,.sum div{border-radius:12px;border-color:color-mix(in srgb,var(--line) 70%,transparent);background:linear-gradient(180deg,var(--surface),var(--sunken))}

/* 화면이 바뀔 때 카드가 차례로 떠오름 (같은 화면을 다시 그릴 때는 생략) */
#view>*{animation:rise .45s var(--ease) both}
#view>*:nth-child(2){animation-delay:.05s} #view>*:nth-child(3){animation-delay:.1s}
#view>*:nth-child(4){animation-delay:.15s} #view>*:nth-child(n+5){animation-delay:.2s}
#view>.still{animation:none!important}
#view>.still .bar .t i,#view>.still .pbar .t i,#view>.still table.heat td{animation:none!important}

/* 넓은 화면: 목록은 2열, 작문·번역은 과제(왼쪽)와 쓰는 칸(오른쪽) 2단 */
@media (min-width:1000px){
  .wrap{max-width:1080px}
  .stage .list,#view>.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #view:has(>section.task){grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start;column-gap:20px}
  #view:has(>section.task)>*{grid-column:1}
  #view:has(>section.task)>section.card:has(#wt),#view:has(>section.task)>section.card:has(#ko),#view:has(>section.task)>section.card:has(#bk){grid-column:2;grid-row:1/span 6;position:sticky;top:120px}
  #view:has(>section.task) textarea.write{min-height:22rem}
}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tabIn{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes okPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes tick{0%{opacity:1}50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>
  <div class="wrap">
    <div class="hrow"><span class="brand">LA 통역 드릴</span><span class="ver">S3-2 · v5.2 · AI 없이 동작</span></div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="drill">연습</button>

      <button role="tab" data-tab="log">기록</button>
      <button role="tab" data-tab="check">기기 점검</button>
      <button role="tab" data-tab="help">사용법</button>
    </nav>
  </div>
</header>

<script>
/* ===== 문장 은행 =====
   ja·alt의 漢字{よみ}는 후리가나로 표시되고, 음성 읽기에는 よみ를 쓴다.
   문항별 선택 항목: limit(제한 시간, 초) · kw(목표 표현 [[후보…]…]) · ng(피할 표현) · lead(결론 먼저 확인할 말).
   P-01 세트의 한국어는 일부러 공문체·메모체다 (그 문체를 말로 푸는 것이 훈련 목표). */
const SETS = {
  P01:{name:"P-01 명사 나열 풀기", short:"P-01", chip:"P-01 명사 나열", limit:10,
    rule:"한국어 공문체의 '명사 + 및 + 명사 + 후'를 그대로 옮기지 않는다. 말로 할 때는 동사로 이어서 순서대로 말한다. (한국어 원문이 딱딱한 것은 일부러다.)",

    chunk:"結論から申し上げますと、～ ／ ～の件、～でした ／ ～ためです"},
  P04:{name:"P-04 한국 회사 용어", short:"P-04", chip:"P-04 회사 용어", limit:10,
    rule:"한국 회사 용어를 한자 그대로 옮기지 않는다. 일본 업무어는 훈독 동사에서 온 말이 많다. 한국 한자어가 일본어에도 있는지, 뜻이 같은지, 그 장면에서 실제로 쓰는지 확인한다.",
    chunk:"差し戻し ／ 決裁が下りる ／ 引き継ぎ ／ 相殺 ／ 催促"},
  H1:{name:"H1 한자어 함정 (일상)", short:"H1", chip:"H1 한자어 함정", limit:8,
    rule:"한국 한자어를 일본어 음으로 그대로 읽지 않는다. ① 일본어에 그 말이 있는가 ② 뜻이 같은가 ③ 회화에서 쓰는가를 확인한다. 회화에서는 한자어 동사(決定する·到着する)보다 고유어 동사(決める·着く)가 자연스러운 경우가 많다.",
    chunk:"勉強 ／ 恋人 ／ 手紙 ／ 友達 ／ 魚 ／ お会計 ／ 決める ／ 着く"},
  C1:{name:"C1 장면별 말투", short:"C1", chip:"C1 장면별 말투", limit:10,
    rule:"말하기 전에 관계를 먼저 정한다: 친구 = タメ口, 처음 보는 사람 = です・ます, 점원 = 접객 경어, 회사 밖 사람 = 우리 쪽(사장 포함)을 낮춘다. 한국어 존댓말 수준을 그대로 옮기지 않는다.",
    chunk:"～てて ／ ～そう ／ ～ですか ／ お持ちですか ／ ～しております ／ 承ります"}
};

/* ===== 자동 확인 규칙 (v4, 참고용) =====
   음성 인식은 틀린 말을 그럴듯하게 다듬어 적는다. 그래서 '틀린 곳 찾기'에는 쓰지 않고,

const SET_CHK={
  P01:{kw:[{label:"동사로 잇기 (～てから·～たうえで·～たら 등)",alts:["てから","たうえで","た上で","たうえに","た上に","たら","かどうか","ないか","次第","ましたら"]}],
       ng:["及び","および","確認後","発生時","有無","変更後","作成後","完了後"]},
  P04:{kw:[],ng:[]}, L1:{kw:[],ng:[]}, H1:{kw:[],ng:[]}, C1:{kw:[],ng:[]}
};
const CHK={
 "P04-01":{kw:[["稟議","りんぎ"],["下り","おり"]]},
 "P04-02":{kw:[["差し戻","差戻","さしもど"],["不備","ふび"]]},
 "P04-03":{kw:[["引き継","引継","ひきつ"]]},
 "P04-04":{kw:[["相殺","そうさい"]]},
 "P04-05":{kw:[["入館証","にゅうかんしょう","セキュリティカード","入構証"],["下げ","身につけ","つけて"]]},
 "P04-07":{kw:[["議事録","ぎじろく"]]},
 "P04-08":{kw:[["催促","さいそく"]]},
 "P04-09":{kw:[["有給","ゆうきゅう","有休"]]},
 "P04-10":{kw:[["飲み会","懇親会","のみかい"]]},
 "P04-11":{kw:[["定時","ていじ"],["上がら","失礼"]]},
 "P04-12":{kw:[["外出","外回り","がいしゅつ"],["席を外","不在"]]},
 "P04-13":{kw:[["週報","しゅうほう"]]},
 "L1-01":{lead:["受注"]}, "L1-02":{lead:["納品","遅れ","ずれ"]}, "L1-03":{lead:["A案","Ａ案","エー案"]},
 "L1-04":{lead:["問題"]}, "L1-05":{lead:["明日"]}, "L1-06":{lead:["申し訳","見送","難しい","お断り","恐縮"]},
 "L1-07":{lead:["決裁","下り"]}, "L1-08":{lead:["納期","間に合"]}, "L1-09":{lead:["10時","十時","１０時"]},
 "L1-10":{lead:["正常","現在","解決"]}, "L1-11":{lead:["木曜"]}, "L1-12":{lead:["手伝"]}
};
const normJa=s=>String(s||"").replace(/[\s、。,.!?！？「」]/g,"");
function autoCheck(it,heard){
  const h=normJa(heard); if(!h) return null;
  const base=SET_CHK[it.set]||{kw:[],ng:[]}, own=Object.assign({},CHK[it.id]||{}), out=[];
  ["kw","ng","lead"].forEach(k=>{if(it[k]) own[k]=it[k];});
  base.kw.forEach(g=>out.push({label:g.label,ok:g.alts.some(a=>h.includes(a))}));
  (own.kw||[]).forEach(g=>out.push({label:"목표 표현 "+plainJa(g[0]),ok:g.some(a=>h.includes(normJa(plainJa(a))))}));
  const ng=base.ng.concat(own.ng||[]);
  if(ng.length){const f=ng.filter(a=>h.includes(a)); out.push({label:"피할 표현 "+(f.length?f.join("·")+" 나옴":"안 나옴"),ok:!f.length});}
  if(own.lead){const head=h.slice(0,Math.max(12,Math.round(h.length*.35))); out.push({label:"결론 먼저 ("+own.lead[0]+")",ok:own.lead.some(a=>head.includes(a))});}
  return out;
}

/* ===== 마이크: 첫마디까지 걸린 시간·멈춤 (v4) =====
   소리 크기만 본다. 음성 인식이 필요 없고, 녹음을 저장하지 않는다. */
const MIC={ok:false,stream:null,ctx:null,an:null,buf:null,paused:false};
async function micStart(){
  if(MIC.ok){try{await MIC.ctx.resume()}catch(e){} return true;}
  try{
    MIC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const AC=window.AudioContext||window.webkitAudioContext; MIC.ctx=new AC(); await MIC.ctx.resume();
    const src=MIC.ctx.createMediaStreamSource(MIC.stream); MIC.an=MIC.ctx.createAnalyser(); MIC.an.fftSize=1024; src.connect(MIC.an);
    MIC.buf=new Float32Array(MIC.an.fftSize); MIC.ok=true; MIC.paused=false; return true;
  }catch(e){micOff(); return false;}
}
function micOff(){measStop(true); if(MIC.stream) MIC.stream.getTracks().forEach(t=>t.stop()); if(MIC.ctx){try{MIC.ctx.close()}catch(e){}} Object.assign(MIC,{ok:false,stream:null,ctx:null,an:null,buf:null,paused:false});}
/* v5.1 아이폰: 마이크가 열려 있으면 재생 소리가 통화용 수화부로 아주 작게 나간다.
   녹음을 재생할 때는 마이크를 닫고(paused), 다음 문장에서 측정·녹음을 시작할 때 다시 연다. */
function micPause(){ if(!MIC.ok||MEAS||REC.mr) return; micOff(); MIC.paused=true; }
const micOn=()=>MIC.ok||MIC.paused; /* 열려 있거나, 재생 때문에 잠시 닫아 둔 상태 */
document.addEventListener("play",e=>{ if(e.target&&e.target.tagName==="AUDIO") micPause(); },true);
function micLevel(){MIC.an.getFloatTimeDomainData(MIC.buf); let s=0; for(let i=0;i<MIC.buf.length;i++) s+=MIC.buf[i]*MIC.buf[i]; return Math.sqrt(s/MIC.buf.length);}
let MEAS=null;
function measStart(){
  measStop(true); if(!MIC.ok) return;
  MEAS={t0:performance.now(),cal:[],thr:null,run:0,onset:null,lastV:null,silStart:null,pauses:[],hold:false};
  MEAS.iv=setInterval(measTick,40);
}
function measTick(){
  const m=MEAS; if(!m||!MIC.ok) return;
  const now=performance.now(), r=micLevel();
  const bar=document.getElementById("lvl"); if(bar) bar.style.width=Math.min(100,r*900)+"%";
  if(m.hold) return;
  if(m.thr===null){m.cal.push(r); if(now-m.t0>=350){const a=m.cal.slice().sort((x,y)=>x-y); m.thr=Math.max((a[Math.floor(a.length/2)]||.001)*3.2,.012);} return;}
  if(r>m.thr){
    m.run+=40;
    if(m.onset===null&&m.run>=160) m.onset=now-m.run-m.t0;
    if(m.onset!==null){ if(m.silStart!==null){const gap=now-m.silStart; if(gap>=600) m.pauses.push(gap); m.silStart=null;} m.lastV=now-m.t0; }
  } else { m.run=0; if(m.onset!==null&&m.silStart===null) m.silStart=now; }
}
function measHold(on){ if(!MEAS) return; if(on){MEAS.hold=true;} else {Object.assign(MEAS,{hold:false,t0:performance.now(),onset:null,lastV:null,silStart:null,pauses:[],run:0});} }
function measStop(discard){
  const m=MEAS; MEAS=null; if(!m) return null; clearInterval(m.iv);
  if(discard) return null;
  if(m.onset===null) return {lat:null};
  return {lat:Math.round(m.onset),spk:Math.round((m.lastV||m.onset)-m.onset),pz:m.pauses.length,pzMax:m.pauses.length?Math.round(Math.max(...m.pauses)):0};
}
const sec=ms=>ms==null?"-":(ms/1000).toFixed(1)+"초";
function measText(x){ if(!x) return ""; if(x.lat==null) return "목소리를 못 잡음"; return `첫마디 ${sec(x.lat)} · 멈춤 ${x.pz}번${x.pz?` (최장 ${sec(x.pzMax)})`:""}`; }

/* ===== 음성 인식 (실험) ===== */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const ASR={ok:!!SRC,rec:null,keep:false,log:[]};
/* 비교용: 띄어쓰기·문장부호를 빼고 본다 */
const asrNorm=s=>(s||"").replace(/[\s、。，,．.!?！？「」]/g,"");
function asrStart(){
  if(!ASR.ok) return; asrAbort();
  const r=new SRC(); r.lang="ja-JP"; r.continuous=true; r.interimResults=false; r.maxAlternatives=1; r._t="";
  /* v5.1 아이폰은 같은 확정 결과를 되풀이해 보낸다: 매번 처음부터 확정 결과만 모으고, 이미 모은 글 끝과 같으면 건너뛴다.
     다시 시작(onend)하기 전까지 모은 글은 _base에 둔다.
     v5.2 띄어쓰기·문장부호 차이는 무시, 앞 조각을 이어 키운 결과는 바꿔 끼우고, 한 조각 안에 같은 말이 두 번이면 하나로. */
  r._base=""; ASR.log=[];
  r.onresult=e=>{
    ASR.log.push(e.resultIndex+":"+Array.from(e.results,x=>(x.isFinal?"F":"i")+x[0].transcript).join("|"));
    if(ASR.log.length>8) ASR.log.shift();
    const parts=[];
    for(let i=0;i<e.results.length;i++){
      if(!e.results[i].isFinal) continue;
      let s=e.results[i][0].transcript, k=asrNorm(s);
      if(!k) continue;
      const h=k.length/2; if(k.length%2===0&&k.slice(0,h)===k.slice(h)){ k=k.slice(0,h); s=k; }
      if(asrNorm(r._base+parts.join("")).endsWith(k)) continue;
      if(parts.length&&k.startsWith(asrNorm(parts[parts.length-1]))){ parts[parts.length-1]=s; continue; }
      parts.push(s);
    }
    r._t=r._base+parts.join("");
  };
  r.onerror=()=>{}; r.onend=()=>{ if(ASR.rec===r&&ASR.keep){r._base=r._t; try{r.start()}catch(e){}} };
  ASR.rec=r; ASR.keep=true; try{r.start()}catch(e){}
}
function asrAbort(){const r=ASR.rec; ASR.keep=false; ASR.rec=null; if(r){try{r.abort()}catch(e){}}}
function asrStop(){
  return new Promise(res=>{
    const r=ASR.rec; ASR.keep=false; ASR.rec=null; if(!r){res("");return;}
    let done=false; const fin=()=>{if(!done){done=true; res(r._t||"");}};
    r.onend=fin; try{r.stop()}catch(e){fin()} setTimeout(fin,1800);
  });
}

/* ===== 녹음 다시 듣기 (v5) =====
   이번 세션 동안만 메모리에 두고, 저장·전송하지 않는다. 새로 시작하거나 페이지를 닫으면 사라진다. */
const REC={ok:!!(window.MediaRecorder&&navigator.mediaDevices),mr:null,chunks:[],urls:[],type:""};
function recStart(){
  if(!REC.ok||!MIC.stream) return; recAbort();
  try{
    /* v5.1 아이폰 사파리가 확실히 재생하는 mp4(AAC)를 먼저 */
    const t=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(x=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x));
    const mr=new MediaRecorder(MIC.stream,t?{mimeType:t}:undefined); REC.chunks=[]; REC.type=mr.mimeType||t||"";
    mr.ondataavailable=e=>{if(e.data&&e.data.size) REC.chunks.push(e.data);};
    mr.start(); REC.mr=mr;
  }catch(e){REC.mr=null;}
}
function recAbort(){const mr=REC.mr; REC.mr=null; if(mr&&mr.state!=="inactive"){mr.ondataavailable=null; try{mr.stop()}catch(e){}}}
function recStop(){
  return new Promise(res=>{
    const mr=REC.mr; REC.mr=null; if(!mr||mr.state==="inactive"){res(null);return;}
    const chunks=REC.chunks; let done=false;
    const fin=()=>{if(done)return; done=true; const b=new Blob(chunks,{type:mr.mimeType||"audio/webm"}); if(!b.size){res(null);return;} const u=URL.createObjectURL(b); REC.urls.push(u); res(u);};
    mr.onstop=fin; try{mr.stop()}catch(e){fin()} setTimeout(fin,1500);
  });
}
function recClear(){recAbort(); REC.urls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}}); REC.urls=[];}
const audioHTML=u=>!u?"":!REC.urls.includes(u)?`<p class="note">이 녹음은 지워졌습니다 (연습·핸즈프리를 새로 시작하면 이전 녹음은 사라집니다).</p>`:`<audio controls playsinline preload="auto" src="${u}" style="width:100%"></audio>`;

const CKEY="la-interp-custom-v1";
const BUILTIN_SETS=Object.keys(SETS), BUILTIN_IDS=new Set(ITEMS.map(i=>i.id));
let CUSTOM={sets:{},items:[]};
function loadCustom(){try{const s=localStorage.getItem(CKEY);if(s){const d=JSON.parse(s);CUSTOM={sets:d.sets||{},items:d.items||[]};}}catch(e){} applyCustom();}

function applyCustom(){
  Object.keys(SETS).forEach(k=>{if(!BUILTIN_SETS.includes(k)) delete SETS[k];});
  for(let i=ITEMS.length-1;i>=0;i--) if(!BUILTIN_IDS.has(ITEMS[i].id)) ITEMS.splice(i,1);
  Object.entries(CUSTOM.sets).forEach(([k,s])=>{if(!SETS[k]) SETS[k]=s;});

/* 붙여 넣은 글에서 JSON을 찾아 검사한다. 돌려주는 값: {sets, items, skipped:[이유…]} */
function parseCustom(txt){
  const s=String(txt||""), a=s.indexOf("{"), b=s.lastIndexOf("}");
  if(a<0||b<a) throw new Error("JSON을 찾지 못했습니다.");
  const d=JSON.parse(s.slice(a,b+1)), sets={}, items=[], skipped=[];
  Object.entries(d.sets||{}).forEach(([k,v])=>{
    if(BUILTIN_SETS.includes(k)){skipped.push(`세트 ${k}: 기본 세트와 이름이 같음`);return;}
    if(!v||!v.name){skipped.push(`세트 ${k}: name 없음`);return;}
    sets[k]={name:String(v.name),short:String(v.short||k),chip:String(v.chip||v.name),limit:+v.limit||10,rule:String(v.rule||""),chunk:String(v.chunk||"")};
  });
  (Array.isArray(d.items)?d.items:[]).forEach((v,n)=>{
    const id=v&&String(v.id||"");
    if(!id||!v.set||!v.ko||!v.ja){skipped.push(`${n+1}번째: id·set·ko·ja 중 빠진 것이 있음`);return;}
    if(BUILTIN_IDS.has(id)){skipped.push(`${id}: 기본 문항과 번호가 같음`);return;}
    if(!SETS[v.set]&&!sets[v.set]&&!CUSTOM.sets[v.set]){skipped.push(`${id}: 세트 ${v.set}가 없음`);return;}
    const arr=x=>Array.isArray(x)?x.map(String):[];
    const it={id,set:String(v.set),type:String(v.type||"문장형"),scene:String(v.scene||""),ko:String(v.ko),ja:String(v.ja),alt:arr(v.alt),pts:arr(v.pts)};
    if(!it.pts.length) it.pts=["모범 답과 뜻이 같다"];
    if(v.tip) it.tip=String(v.tip);
    if(+v.limit) it.limit=+v.limit;
    if(Array.isArray(v.kw)) it.kw=v.kw.filter(Array.isArray).map(arr);
    if(Array.isArray(v.ng)) it.ng=arr(v.ng);
    if(Array.isArray(v.lead)) it.lead=arr(v.lead);
    items.push(it);
  });
  return {sets,items,skipped};
}

  Object.assign(CUSTOM.sets,p.sets);
  p.items.forEach(it=>{const i=CUSTOM.items.findIndex(x=>x.id===it.id); if(i>=0) CUSTOM.items[i]=it; else CUSTOM.items.push(it);});

}

    ${!c.shown&&(DB.opt.mic&&micOn()||DB.opt.asr&&ASR.ok||DB.opt.rec&&micOn())?`${micOn()?`<div class="lvl" title="마이크 소리 크기"><i id="lvl"></i></div>`:""}<p class="note">${[DB.opt.mic&&micOn()?"🎤 재는 중":"",DB.opt.rec&&micOn()?"⏺ 녹음 중":"",DB.opt.asr&&ASR.ok?"음성 인식 중":""].filter(Boolean).join(" · ")} — 다 말했으면 버튼을 누르세요.</p>`:""}
    <div class="row">
      ${TTS.ok&&!c.shown?`<button class="btn" id="sayKo" ${c.listen&&c.plays===0?"disabled":""}>${c.listen?`한 번 더 듣기${DB.opt.replay<9?` (${left()}회)`:""}`:"한국어 듣기"}</button>`:""}
      ${c.shown?"":`<button class="btn pri" id="reveal">말했어요 · 답 보기</button>`}
    </div>
  </section>
  ${c.shown?answerCard(c):""}`;
  if(c.shown){bindAnswer(c);return;}
  const alive=()=>my===CARD&&RUN&&RUN.items[RUN.i]===c&&!c.shown;
  const sayBtn=()=>{const b=$("#sayKo"); if(!b) return; if(c.listen){b.textContent=`한 번 더 듣기${DB.opt.replay<9?` (${left()}회)`:""}`; b.disabled=left()<=0;}};
  const close=()=>{
    if(c.shown) return; c.shown=true; clearTimer(); if(TTS.ok) speechSynthesis.cancel();
    c.capPending=true;
    capStop(it).then(o=>{
      Object.assign(c,o); c.capPending=false;
      if(!RUN||RUN.items[RUN.i]!==c||TAB!=="drill") return;
      const a=$("#auto"); if(a) a.outerHTML=autoHTML(c);
      const r=$("#myrec"); if(r) r.outerHTML=recHTML(c);
      const m=$("#measbox"); if(m) m.outerHTML=measHTML(c);
    });
  };
  if(timed){
    TM={left:lim*1000,last:Date.now(),paused:c.listen};
    TIMER=setInterval(()=>{
      if(!TM) return;
      const now=Date.now(); if(!TM.paused) TM.left-=now-TM.last; TM.last=now;
      const sec=$("#sec"),bar=$("#bar");
      if(!sec){clearTimer();return;}
      const l=Math.max(0,TM.left); sec.textContent=Math.ceil(l/1000); bar.style.width=(l/(lim*1000)*100)+"%";
      if(TM.left<=0){c.timeout=true;close();viewCard();}
    },200);
    if(c.listen) timerPause(true);
  }
  $("#reveal").onclick=()=>{close();viewCard();};
  if(c.listen){
    c.plays=1;
    speak(koSpeech(it),"ko").then(async()=>{ if(!alive()) return; await capStartMic(alive); if(!alive()) return; timerPause(false); sayBtn(); });
  } else capStartMic(alive);
  if(TTS.ok&&$("#sayKo")) $("#sayKo").onclick=async()=>{
    if(c.listen&&left()<=0) return;
    speechSynthesis.cancel(); c.plays++; sayBtn(); $("#sayKo").disabled=true;
    timerPause(true); measHold(true); if(DB.opt.asr&&ASR.ok) asrAbort();
    await speak(koSpeech(it),"ko");
    if(!alive()) return;
    measHold(false); if(DB.opt.asr&&ASR.ok) asrStart(); timerPause(false); sayBtn(); if(!c.listen&&$("#sayKo")) $("#sayKo").disabled=false;
  };
}

function gradeNote(c){

function autoHTML(c){
  if(c.capPending) return `<div class="auto" id="auto"><span class="note">음성 인식 결과를 정리하는 중…</span></div>`;
  if(!c.heard) return `<div class="auto" id="auto"><span class="note">음성 인식이 아무것도 받지 못했습니다 (조용한 곳에서, 화면을 켠 채로 말해 보세요).</span></div>`;

    ${(c.auto||[]).length?`<div class="meas">${c.auto.map(a=>`<span class="${a.ok?"ok":"bad"}">${a.ok?"✓":"✗"} ${esc(a.label)}</span>`).join("")}</div>`:`<span class="note">이 문장은 자동 확인 항목이 없습니다.</span>`}</div>`;
}
function bindAnswer(c){

    c.g=b.dataset.g;

  });

    else viewCard();

}
function commit(c){
  const r=rec(c.it.id), g=finalGrade(c); c.fg=g;
  r.n++;r.g=g;
  if(g==="○"){r.streak++;r.due=addDays([3,7,14,30][Math.min(r.streak-1,3)]);}
  else{r.streak=0;r.due=addDays(1);}
  r.hist.push({d:today(),st:RUN.stage,g,said:c.g,miss:c.ptsOk.map((v,k)=>v?null:k).filter(v=>v!=null),listen:c.listen||undefined,lat:c.meas&&c.meas.lat!=null?c.meas.lat:undefined,pz:c.meas&&c.meas.lat!=null?c.meas.pz:undefined,auto:c.auto?c.auto.filter(a=>a.ok).length+"/"+c.auto.length:undefined});
  if(r.hist.length>30)r.hist=r.hist.slice(-30);
  save();
}
const runCount=()=>{const n={"○":0,"△":0,"×":0};RUN.items.forEach(c=>{if(c.fg)n[c.fg]++;});return n;};
function saveSession(){
  const L=RUN.items.map(c=>c.meas&&c.meas.lat).filter(v=>v!=null);
  DB.sessions.push({at:stamp(),src:RUN.src,stage:RUN.stage,n:RUN.items.length,cnt:runCount(),listen:RUN.items.some(c=>c.listen)||undefined,min:Math.round((RUN.end-RUN.start)/60000),lat:L.length?Math.round(L.reduce((a,b)=>a+b,0)/L.length):undefined});
  if(DB.sessions.length>60)DB.sessions=DB.sessions.slice(-60);
  save();
}
function srcName(s){return s==="MIX"?"섞어서":s==="DUE"?"복습 대상":SETS[s]?SETS[s].short+" "+SETS[s].name.replace(SETS[s].short+" ",""):s;}
function talkStatus(k){
  const t=DB.talk[k]||{seq:[]};let run=0;for(let i=t.seq.length-1;i>=0;i--){if(t.seq[i]===false)run++;else break;}
  return {run,total:t.seq.length,grad:run>=3};
}
function drillRate(k,stage){
  const h=[];ITEMS.filter(i=>i.set===k).forEach(i=>{const r=DB.items[i.id];if(r)r.hist.forEach(x=>{if(!stage||x.st===stage)h.push(x);});});
  h.sort((a,b)=>a.d<b.d?-1:1);const last=h.slice(-10);
  if(!last.length)return null;
  return Math.round(last.filter(x=>x.g==="○"||x.g==="말함").length/last.length*100);
}
function drillLat(k){
  const h=[];ITEMS.filter(i=>i.set===k).forEach(i=>{const r=DB.items[i.id];if(r)r.hist.forEach(x=>{if(x.lat!=null)h.push(x);});});
  h.sort((a,b)=>a.d<b.d?-1:1);const last=h.slice(-10); if(!last.length) return null;
  return Math.round(last.reduce((a,x)=>a+x.lat,0)/last.length);
}
/* Claude가 새 문장을 이 형식으로 주면 기록 탭 「문제 추가하기」에 그대로 붙여 넣을 수 있다 */
function jsonAsk(){
  const d=today().slice(5).replace("-","");
  return `새 문장은 아래 JSON 형식으로 주세요 (통역 드릴 기록 탭 → 문제 추가하기에 붙여 넣습니다). set은 ${Object.keys(SETS).join("·")} 중 하나, id는 「세트-${d}-번호」(예: H1-${d}-1)로 겹치지 않게. ja·alt·pts의 한자에는 읽기를 漢字{よみ}로 붙일 수 있습니다. kw는 음성 인식으로 확인할 목표 표현(한자와 읽기를 같은 묶음에), ng는 나오면 안 되는 직역·음독 표현입니다.
{"items":[{"id":"","set":"","type":"문장형","scene":"","ko":"","ja":"","alt":[""],"pts":[""],"tip":"","kw":[["",""]],"ng":[""]}]}`;
}
function resultText(){
  const cnt=runCount();
  const bad=RUN.items.filter(c=>c.fg==="×"||c.fg==="△");
  let t=`[LA 통역 드릴 결과지] ${stamp()} · 세트 ${srcName(RUN.src)} · 단계 ${RUN.stage}${RUN.items.some(c=>c.listen)?" · 듣고 통역":""} · ${RUN.items.length}문장 · 약 ${Math.max(1,Math.round((RUN.end-RUN.start)/60000))}분\n○ ${cnt["○"]} · △ ${cnt["△"]} · × ${cnt["×"]} (×=막힘, △=말했지만 빠진 포인트 있음)\n`;
  t+=`\n── 다시 볼 문장 (${bad.length})\n`;
  bad.forEach((c,k)=>{const it=c.it; t+=`${k+1}) ${c.fg} [${it.id} · ${it.type} · ${it.scene}] ${it.ko.replace(/\n/g," / ")}${c.timeout?" (시간 초과)":""}\n`;
    const miss=it.pts.filter((p,j)=>!c.ptsOk[j]); if(c.fg==="△"&&miss.length) t+=`   빠진 포인트: ${miss.map(plainJa).join(" / ")}\n`;
    if(c.memo)t+=`   메모: ${c.memo}\n`;});
  const memo=RUN.items.filter(c=>c.fg==="○"&&c.memo);
  if(memo.length){t+=`\n── ○ 문장의 메모\n`;memo.forEach(c=>t+=`- [${c.it.id}] ${c.memo}\n`);}
  const measured=RUN.items.filter(c=>c.meas||c.heard);
  if(measured.length){
    const L=RUN.items.map(c=>c.meas&&c.meas.lat).filter(v=>v!=null);
    t+=`\n── 측정 (참고)${L.length?` · 첫마디 평균 ${sec(Math.round(L.reduce((a,b)=>a+b,0)/L.length))}`:""}\n`;
    measured.forEach(c=>{t+=`- [${c.it.id}] ${c.fg}${c.meas?` · ${measText(c.meas)}`:""}${c.heard?`\n   자동 인식: ${c.heard}`:""}${c.auto&&c.auto.length?`\n   자동 확인: ${c.auto.map(a=>(a.ok?"✓ ":"✗ ")+a.label).join(" / ")}`:""}\n`;});
  }
  if((RUN.trans||"").trim()){t+=`\n── 녹음 받아쓰기 (내가 실제로 말한 문장)\n${RUN.trans.trim()}\n`;}
  t+=`\n── 말하기 상태\n`;
  Object.keys(SETS).forEach(k=>{const r=drillRate(k);const s=talkStatus(k);const lt=drillLat(k);if(r===null&&!s.total)return;t+=`${SETS[k].short}: 드릴 최근 10회 ○ ${r===null?"-":r+"%"}${lt!=null?` · 첫마디 평균 ${sec(lt)}`:""} · 대화 속 연속 안 나옴 ${s.run}/3${s.grad?" (말하기 졸업)":""}\n`;});
  t+=`\n── 요청\n`;
  t+=`○△×의 포인트 체크는 내가 스스로 한 것입니다. `;
  if(RUN.items.some(c=>c.heard)) t+=`자동 인식 문장은 음성 인식이 다듬어 적었을 수 있습니다. 목표 표현을 썼는지·결론을 먼저 말했는지 같은 구조는 자동 인식으로 판정하고, 조사·활용 같은 세부는 받아쓰기한 문장이 있을 때만 판정해 주세요.\n`;
  t+= (RUN.trans||"").trim()
    ? `받아쓴 문장을 문항 번호의 모범 답·포인트 기준으로 채점해 주세요(포인트별 지킴/못 지킴, 틀림/부자연/변이 구분, 한자어는 읽기 병기). 내 포인트 체크와 다른 곳이 있으면 짚어 주세요. ×·△ 문장은 원인을 LA-07 패턴으로 짚고, 같은 패턴으로 내용·장면이 다른 새 문장 5개를 만들어 주세요.\n`
    : `×·△ 문장의 원인을 LA-07 패턴으로 짚고, 같은 패턴으로 내용·장면이 다른 새 문장 5개를 만들어 주세요. 메모에 적은 문장이 있으면 포인트 기준으로 채점해 주세요.\n`;
  t+=jsonAsk();
  return t;
}

    <h3>녹음 받아쓰기 (선택, 주 1회 권장)</h3>

async function runHands(){
  HF.msg="";
  if(needMic()&&!(await micStart())) HF.msg="마이크를 쓸 수 없어 측정·녹음 없이 진행합니다.";
  recClear(); HF.results=[];
  HF.running=true;const my=++HF.token;viewHands();
  try{ if(navigator.wakeLock) HF.lock=await navigator.wakeLock.request("screen"); }catch(e){}
  const items=shuffle(pool(HF.src));
  const now=t=>{HF.msg=t;const el=$("#hnow");if(el)el.textContent=t;};
  for(let i=0;i<items.length;i++){
    if(my!==HF.token)return;
    const it=items[i],lim=limitOf(it);
    now(`${i+1}/${items.length} · ${it.id} · 한국어`);
    await speak(koSpeech(it),"ko",HF.rate);
    if(HF.koTwice){await wait(700);if(my!==HF.token)return;await speak(koSpeech(it),"ko",HF.rate);}
    if(my!==HF.token)return;
    capStart();
    for(let s=lim;s>0;s--){if(my!==HF.token)return;now(`${i+1}/${items.length} · 말하기 ${s}초`);await wait(1000);}
    if(my!==HF.token)return;
    const o=await capStop(it);
    if(my!==HF.token)return;
    const x=Object.assign({it},o); x.pick=!!((x.auto||[]).some(a=>!a.ok)||(x.meas&&x.meas.lat==null)); HF.results.push(x);
    now(`${i+1}/${items.length} · 모범 답`);
    await speak(speakJa(it.ja),"ja",HF.rate);
    if(HF.twice){await wait(800);if(my!==HF.token)return;await speak(speakJa(it.ja),"ja",HF.rate);}
    await wait(2000);
  }
  if(my===HF.token){stopHands();micOff();HF.msg="끝. 아래에서 녹음과 자동 확인을 보고 복습할 문장을 고르세요.";viewHands();}
}

function stopCheck(){CK.token++;CK.busy="";if(CK.iv){clearInterval(CK.iv);CK.iv=null;}if(TTS.ok)speechSynthesis.cancel();asrAbort();recAbort();}
function ckSet(id,st,msg,html){CK.res[id]={st,msg,html};if(st!=="run"&&st!=="ask"){CK.at=stamp();DB.dev={at:CK.at,res:Object.fromEntries(Object.entries(CK.res).filter(([k,v])=>v.st!=="run"&&v.st!=="ask").map(([k,v])=>[k,{st:v.st,msg:v.msg}]))};save();}if(TAB==="check")viewCheck();}
/* ms 동안 마이크 소리 크기를 모은다. 막대(id)를 함께 움직인다 */
function ckSample(ms,barId,my){
  return new Promise(res=>{
    const a=[], end=performance.now()+ms;
    CK.iv=setInterval(()=>{
      if(my!==CK.token||!MIC.ok){clearInterval(CK.iv);CK.iv=null;res(a);return;}
      const r=micLevel(); a.push(r); const b=document.getElementById(barId); if(b) b.style.width=Math.min(100,r*900)+"%";
      if(performance.now()>=end){clearInterval(CK.iv);CK.iv=null;res(a);}
    },40);
  });
}
const pct=(a,p)=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*p))];};
const lv=v=>Math.round(v*1000);
async function ckRun(id){
  stopCheck(); const my=++CK.token; CK.busy=id;
  const alive=()=>my===CK.token;
  try{
  if(id==="ko"||id==="ja"){
    if(!TTS.ok) return ckSet(id,"bad","이 브라우저는 음성 읽기를 지원하지 않습니다.");
    const v=voiceFor(id); ckSet(id,"run","읽는 중…");
    const t0=performance.now();
    await speak(id==="ko"?"안녕하세요. 한국어 음성 점검입니다. 잘 들리면 들림을 누르세요.":"こんにちは。日本語の音声テストです。お会計お願いします。",id);
    if(!alive()) return;
    const quick=performance.now()-t0<600;
    ckSet(id,"ask",`${v?"음성: "+v.name:"이 언어 음성을 찾지 못해 기본 음성으로 읽었습니다"}${quick?" · 재생이 너무 빨리 끝났습니다 (소리가 안 났을 수 있음)":""}. 들렸나요?`);
    CK.res[id].voice=!!v;
  }
  else if(id==="mic"){
    ckSet(id,"run","마이크 권한을 요청하는 중…");
    if(!(await micStart())) return ckSet(id,"bad","마이크를 쓸 수 없습니다 (주소창의 마이크 권한 허용, 다른 앱이 마이크를 쓰는지 확인).");
    if(!alive()) return;
    ckSet(id,"run","「あー」 하고 소리를 내세요 (4초)");
    const a=await ckSample(4000,"lvl-mic",my); if(!alive()) return;
    const floor=pct(a,.1), peak=pct(a,.95);
    if(peak>Math.max(floor*3,.02)) ckSet(id,"ok",`목소리가 잘 잡힙니다 (소음 ${lv(floor)} · 목소리 ${lv(peak)}).`);
    else if(peak>.012) ckSet(id,"warn",`잡히긴 하지만 소음과 차이가 작습니다 (소음 ${lv(floor)} · 목소리 ${lv(peak)}). 조용한 곳에서 쓰거나 마이크에 가까이.`);
    else ckSet(id,"bad",`소리가 거의 들어오지 않습니다 (최대 ${lv(peak)}). 마이크 선택·음소거를 확인하세요.`);
  }
  else if(id==="echo"){
    if(!TTS.ok) return ckSet(id,"skip","음성 읽기를 지원하지 않아 건너뜁니다.");
    ckSet(id,"run","마이크 준비 중…");
    if(!(await micStart())) return ckSet(id,"bad","마이크를 쓸 수 없어 확인하지 못했습니다.");
    if(!alive()) return;
    ckSet(id,"run","조용히 계세요 — 주변 소리를 재는 중");
    const base=await ckSample(800,"lvl-echo",my); if(!alive()) return;
    ckSet(id,"run","일본어를 트는 중 — 조용히 계세요");
    const during=[]; let on=true;
    const p=speak("駅には何時ごろ着きますか。確認して、改めてご連絡いたします。","ja").then(()=>{on=false;});
    while(on&&alive()){ const s=await ckSample(200,"lvl-echo",my); during.push(...s); }
    await p; if(!alive()) return;
    const floor=pct(base,.5), mid=pct(during,.5);
    if(!during.length) ckSet(id,"warn","측정하지 못했습니다. 다시 해 보세요.");
    else if(mid>Math.max(floor*2.5,.01)) ckSet(id,"warn",`스피커 소리가 마이크로 들어옵니다 (조용할 때 ${lv(floor)} → 재생 중 ${lv(mid)}). 이어폰을 쓰세요. 스피커로 할 때는 음성 인식을 끄는 게 낫습니다.`);
    else ckSet(id,"ok",`스피커 소리가 마이크로 거의 들어오지 않습니다 (조용할 때 ${lv(floor)} · 재생 중 ${lv(mid)}).`);
  }
  else if(id==="asr"){
    if(!ASR.ok) return ckSet(id,"bad","이 브라우저는 음성 인식을 지원하지 않습니다 (크롬·사파리 최신판 권장). 음성 인식 옵션은 끄고 녹음 다시 듣기로 확인하세요.");
    micOff(); /* 아이폰은 마이크 측정과 음성 인식을 함께 쓰면 하나가 멈출 수 있어 따로 잰다 */
    asrStart();
    for(let s=5;s>0;s--){ if(!alive()) return; ckSet(id,"run",`「お会計お願いします」라고 말하세요 (${s}초)`); await wait(1000); }
    const t=(await asrStop()).trim(); if(!alive()) return;
    const h=normJa(t);
    /* v5.2 기기가 실제로 보낸 결과(원본)를 함께 적는다. F=확정, i=중간, 앞 숫자=resultIndex */
    const raw=ASR.log.length?` · 원본(${ASR.log.length}회): ${ASR.log.join(" / ").slice(0,200)}`:"";
    if(/会計|かいけい|カイケイ/.test(h)) ckSet(id,"ok",`인식: 「${t}」${raw}`);
    else if(h) ckSet(id,"warn",`인식은 되지만 정확하지 않습니다: 「${t}」. 자동 확인은 참고로만 보세요.${raw}`);
    else ckSet(id,"bad","아무것도 인식하지 못했습니다 (마이크 권한·인터넷 연결 확인). 음성 인식 옵션은 끄는 게 낫습니다.");
  }
  else if(id==="rec"){
    if(!REC.ok) return ckSet(id,"bad","이 브라우저는 녹음을 지원하지 않습니다. ⏺ 녹음 옵션은 끄세요.");
    ckSet(id,"run","마이크 준비 중…");
    if(!(await micStart())) return ckSet(id,"bad","마이크를 쓸 수 없습니다.");
    if(!alive()) return;
    recStart(); ckSet(id,"run","아무 말이나 하세요 (3초)");
    await ckSample(3000,"lvl-rec",my); if(!alive()){recAbort();return;}
    const u=await recStop(); if(!alive()) return;
    micOff(); /* v5.1 아이폰: 마이크를 닫아야 재생 소리가 스피커·이어폰으로 제대로 나온다 */
    const fmt=REC.type?` (녹음 형식 ${REC.type.split(";")[0]})`:"";
    if(!u) return ckSet(id,"bad",`녹음이 비었습니다${fmt}. ⏺ 녹음 옵션은 끄세요.`);
    ckSet(id,"ask",`녹음을 재생해 보세요${fmt}. 내 목소리가 들렸나요?`,audioHTML(u));
    CK.res[id].fmt=fmt; CK.res[id].url=u;
    /* v5.2 재생 시작을 기다리지 않는다: 아이폰에서 이 약속이 끝나지 않으면 점검이 「진행 중」으로 남아 다른 테스트 버튼이 잠겼다 */
    const el=document.querySelector("#ck-rec audio"); if(el){try{const p=el.play(); if(p&&p.catch) p.catch(()=>{});}catch(e){}}
  }
  else if(id==="hf"){
    if(!TTS.ok) return ckSet(id,"bad","음성 읽기를 지원하지 않아 핸즈프리를 쓸 수 없습니다.");
    let lock=null, lockSt="지원 안 함", hidden=false; const onVis=()=>{if(document.visibilityState==="hidden")hidden=true;};
    document.addEventListener("visibilitychange",onVis);
    /* v5.2 어디서 멈추는지 보이게 단계마다 표시하고, 화면 켜짐 유지 요청은 1.5초만 기다린다 */
    ckSet(id,"run","화면 켜짐 유지를 요청하는 중…");
    if(navigator.wakeLock){
      lockSt="응답 없음";
      try{ lock=await Promise.race([navigator.wakeLock.request("screen"),wait(1500).then(()=>null)]); lockSt=lock?"켜짐":"응답 없음"; }catch(e){ lockSt="요청 실패"; }
    }
    if(!alive()) return;
    if(TTS.ok){ try{ speechSynthesis.cancel(); if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){} }
    ckSet(id,"run","① 한국어를 읽는 중… (지금 화면을 꺼 보세요)");
    const t0=performance.now();
    const how1=await speak("핸즈프리 점검입니다. 오 초 뒤에 일본어가 나옵니다.","ko");
    for(let s=5;s>0;s--){ if(!alive()) break; ckSet(id,"run",`② 쉬는 중 ${s}초`); await wait(1000); }
    let how2="안 함";
    if(alive()){ ckSet(id,"run","③ 일본어를 읽는 중…"); how2=await speak("これで点検は終わりです。お疲れさまでした。","ja"); }
    document.removeEventListener("visibilitychange",onVis);
    if(lock){try{lock.release()}catch(e){}}
    if(!alive()) return;
    const sec2=Math.round((performance.now()-t0)/1000), hw=x=>x==="end"?"끝까지":x==="timeout"?"응답 없이 시간 초과":x==="error"?"오류":x;
    ckSet(id,"ask",`${sec2}초 걸림 · 화면 켜짐 유지 ${lockSt} · 한국어 ${hw(how1)} · 일본어 ${hw(how2)} · ${hidden?"화면을 끈(다른 앱으로 간) 상태를 거쳤습니다":"화면을 켠 채로 진행됐습니다"}. 일본어까지 끝까지 들렸나요?`);
    Object.assign(CK.res[id],{hidden});
  }
  }finally{ if(my===CK.token){ CK.busy=""; if(TAB==="check") viewCheck(); } }
}
function ckAnswer(id,yes){
  const r=CK.res[id]; if(!r) return;
  if(CK.busy===id){ CK.token++; CK.busy=""; } /* v5.2 답을 골랐으면 그 테스트는 끝난 것으로 보고 다른 버튼을 푼다 */
  if(id==="ko"||id==="ja") ckSet(id,yes?(r.voice?"ok":"warn"):"bad", yes?(r.voice?r.msg.replace(/ 들렸나요\?$/,""):"기본 음성으로 들립니다. 기기 설정에서 이 언어의 음성(TTS)을 내려받으면 발음이 좋아집니다."):"소리가 나지 않습니다. 기기 음량·무음 모드, 기기 설정의 음성(TTS) 언어를 확인하세요.");
  else if(id==="rec"){
    const fmt=r.fmt||"";
    if(yes) ckSet(id,"ok",`녹음과 재생이 됩니다${fmt}.`);
    else if(!r.retried){ /* 처음 「안 들림」: 무음 스위치·음량부터 확인하게 한다 */
      ckSet(id,"ask",`아이폰은 옆면 무음 스위치(벨/무음)가 켜져 있거나 음량이 낮으면 녹음이 안 들릴 수 있습니다. 무음을 풀고 음량을 올린 뒤 다시 재생해 보세요${fmt}. 들렸나요?`,r.url?audioHTML(r.url):"");
      Object.assign(CK.res[id],{fmt,url:r.url,retried:true});
    }
    else ckSet(id,"bad",`무음·음량을 확인해도 녹음이 들리지 않습니다${fmt}. ⏺ 녹음 옵션은 끄세요.`);
  }
  else if(id==="hf") ckSet(id,yes?"ok":"bad",yes?(r.hidden?"화면을 끈 상태에서도 끝까지 읽습니다. 핸즈프리를 화면을 끈 채로 써도 됩니다.":"끝까지 읽습니다. 화면을 끈 상태는 확인하지 않았으니, 화면을 끄고 한 번 더 해 보세요."):"도중에 멈췄습니다. 핸즈프리는 화면을 켠 채로 쓰세요.");
}
function ckAdvice(){
  const R=CK.res, st=id=>R[id]&&R[id].st, a=[];
  if(st("ko")==="bad"||st("ja")==="bad") a.push("음성 읽기가 안 되면 핸즈프리·🎧 듣고 통역을 쓸 수 없습니다. 기기 설정에서 한국어·일본어 음성(TTS)을 확인하세요.");
  if(st("mic")==="bad") a.push("🎤 반응 시간·⏺ 녹음 옵션은 끄세요.");
  if(st("echo")==="warn") a.push("이어폰을 쓰세요. 스피커로 할 때는 음성 인식을 끄세요.");
  if(st("asr")==="bad") a.push("음성 인식 옵션은 끄고, ⏺ 녹음 다시 듣기로 확인하세요.");
  if(st("asr")==="warn") a.push("음성 인식 자동 확인은 참고로만 보세요.");
  if(st("rec")==="bad") a.push("⏺ 녹음 옵션은 끄세요.");
  if(st("hf")==="bad") a.push("핸즈프리는 화면을 켠 채로 쓰세요.");
  const done=CK_TESTS.filter(t=>st(t.id)&&st(t.id)!=="run"&&st(t.id)!=="ask").length;
  if(done===CK_TESTS.length&&!a.length) a.push("모든 기능이 됩니다. 연습 탭에서 🎧·🎤·⏺·음성 인식을 모두 켜고 써도 됩니다.");
  else if(done&&!a.length) a.push(`지금까지 한 테스트(${done}/${CK_TESTS.length})는 문제없습니다. 나머지도 해 보세요.`);
  return {a,done};
}
function ckText(){
  const {a}=ckAdvice();
  let t=`[LA 기기 점검] ${CK.at||stamp()}\n기기: ${navigator.userAgent}\n`;
  CK_TESTS.forEach(x=>{const r=CK.res[x.id];t+=`- ${x.title.replace(/^\S+ /,"")}: ${r?CK_ICON[r.st][0]+" "+(r.msg||""):"안 함"}\n`;});
  if(a.length) t+=`권장: ${a.join(" / ")}\n`;
  return t;
}
function viewCheck(){
  const jaV=voiceFor("ja"),koV=voiceFor("ko");
  const sup=(ok,l)=>`<span class="${ok?"ok":"bad"}">${ok?"✓":"✗"} ${l}</span>`;
  const {a,done}=ckAdvice();
  $("#view").innerHTML=`
  <section class="card">
    <h2>기기 점검</h2>
    <p>핸즈프리·🎧 듣고 통역·측정을 쓰기 전에, 이 기기에서 소리·마이크·음성 인식이 실제로 되는지 확인합니다. <b>실제로 쓸 상태(이어폰을 꽂은 상태)</b>로 위에서부터 하나씩 눌러 보세요. 녹음은 저장하지 않습니다.</p>
    <div class="meas">${sup(TTS.ok,"음성 읽기")}${sup(!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),"마이크")}${sup(ASR.ok,"음성 인식")}${sup(REC.ok,"녹음")}${sup(!!navigator.wakeLock,"화면 켜짐 유지")}</div>
    <p class="note">찾은 음성: 한국어 ${koV?esc(koV.name):"<span class='warn'>없음</span>"} · 일본어 ${jaV?esc(jaV.name):"<span class='warn'>없음</span>"}${TTS.ok&&!TTS.voices.length?" (음성 목록을 아직 못 받았을 수 있음 — 한 번 재생하면 채워집니다)":""}</p>
  </section>
  ${CK_TESTS.map(x=>{const r=CK.res[x.id], ic=r?CK_ICON[r.st]:null, busy=CK.busy===x.id;return `<section class="card ck" id="ck-${x.id}">
    <div class="row" style="justify-content:space-between"><h2>${x.title}</h2>${ic?`<b class="${ic[1]}" style="font-size:1.2rem">${ic[0]}</b>`:""}</div>
    <p class="note">${x.desc}</p>
    ${x.lvl&&busy?`<div class="lvl"><i id="lvl-${x.id}"></i></div>`:""}
    ${r&&r.msg?`<p class="${ic[1]||"note"}" aria-live="polite">${esc(r.msg)}</p>`:""}
    ${r&&r.html?r.html:""}
    <div class="row">
      <button class="btn ${r&&r.st!=="run"?"":"pri"}" data-ck="${x.id}" ${CK.busy&&!busy?"disabled":""}>${busy?"멈추기":r&&r.st!=="run"?"다시 하기":"테스트"}</button>
      ${r&&r.st==="ask"?`<button class="btn o" data-ans="${x.id}" data-v="1">${x.id==="hf"?"끝까지 들림":"들림"}</button><button class="btn x" data-ans="${x.id}" data-v="0">${x.id==="hf"?"중간에 멈춤":"안 들림"}</button>`:""}
    </div>
  </section>`;}).join("")}
  <section class="card">
    <h2>결과 (${done}/${CK_TESTS.length})${CK.at?` <span class="note">${esc(CK.at)}</span>`:""}</h2>
    ${a.length?`<ul style="margin:0;padding-left:1.2em;display:grid;gap:4px">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="note">테스트를 하면 여기에 권장 설정이 나옵니다.</p>`}
    <div class="row"><button class="btn" id="ckcp">점검 결과 복사</button><button class="btn" id="ckclr">결과 지우기</button></div>
  </section>`;
  document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{const id=b.dataset.ck; if(CK.busy===id){stopCheck();micOff();delete CK.res[id];viewCheck();} else ckRun(id);});
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>ckAnswer(b.dataset.ans,b.dataset.v==="1"));
  $("#ckcp").onclick=e=>copyText(ckText(),e.target);
  $("#ckclr").onclick=()=>{stopCheck();CK.res={};CK.at="";DB.dev=undefined;save();viewCheck();};
}

    <p><b>기기 점검</b> 탭에서 한국어·일본어 음성, 마이크, 스피커 소리 새어 들어감, 음성 인식, 녹음, 핸즈프리 연속 재생을 확인하세요. 결과에 맞춰 권장 설정이 나옵니다.</p>
    <p class="note"><b>아이폰 (v5.1)</b>: 마이크가 켜져 있으면 재생 소리가 통화용 수화부로 아주 작게 나갑니다. 그래서 내 녹음·모범 답을 재생할 때는 마이크를 잠시 끄고, 다음 문장을 시작할 때 다시 켭니다. 녹음이 안 들리면 옆면 무음 스위치와 음량을 먼저 확인하세요. 음성 인식이 같은 말을 두 번 적던 문제도 고쳤습니다.</p>
    <p class="note"><b>v5.2</b>: 녹음 테스트 뒤 핸즈프리 테스트 버튼이 눌리지 않던 문제를 고쳤습니다. 핸즈프리 테스트는 단계(① 한국어 → ② 쉬는 중 → ③ 일본어)를 표시하고, 음성 인식 테스트 결과에는 기기가 보낸 원본을 함께 적습니다. 점검 결과를 그대로 Claude에게 붙여 넣으면 원인을 찾을 수 있습니다.</p>

      <li><b>2 빠르게</b>: 제한 시간 안에. 대체 문형이 먼저 튀어나오게. 익숙해지면 🎧 듣고 통역으로</li>
      <li><b>3 섞어서</b>: 모든 세트를 섞어 예고 없이</li>
      <li><b>4 대화 속</b>: 롤플레이 탭. 3회 연속 안 나오면 말하기 졸업</li>

    <p class="note">4단계에서 나오면 2~3단계로 돌아갑니다. 습관 하나가 바뀌는 데는 몇 주가 걸립니다.</p>

  <section class="card">
    <h2>🎧 듣고 통역 (v5)</h2>
    <p>한국어 글자를 가리고 소리로만 냅니다. 읽어 주는 동안에는 제한 시간이 멈추고, 다 읽은 뒤부터 잽니다. 다시 듣기 횟수(0·1·제한 없음)를 고를 수 있습니다. 긴 문장이 버거우면 1회로 시작하고, 종이에 키워드만 적으며 들어도 됩니다 (기호·키워드 메모는 오히려 직역을 줄입니다).</p>

  <section class="card">
    <h2>채점 방식 (v5)</h2>
    <p>답을 연 뒤 두 가지를 누릅니다. ① <b>포인트 중 지킨 것만 체크</b> ② <b>끝까지 말했나(말함/막힘)</b>. 판정은 자동으로: 막힘 = ×, 말함 + 포인트 전부 = ○, 말함 + 빠진 포인트 = △. 포인트는 "동사로 이었다"처럼 예·아니오로 답할 수 있는 항목이라 스스로 해도 덜 관대해집니다. 그래도 정확성의 최종 판단은 <b>녹음을 받아써서 결과지와 함께 보내면 Claude가</b> 합니다(주 1회 정도 권장).</p>
    <p class="note">×·△는 다음 날, ○는 3일 → 7일 → 14일 → 30일 뒤에 다시 나옵니다 (복습 대상). v4까지는 '말함'만으로 복습 간격이 늘어나 직역으로 말해도 30일 뒤로 밀렸는데, v5부터는 포인트를 다 지켜야 늘어납니다.</p>
  </section>
  <section class="card">
    <h2>측정 (선택)</h2>
    <p><b>🎤 반응 시간 재기</b>: 문장이 나온 뒤 첫마디까지 걸린 시간과 중간에 멈춘 횟수를 잽니다. 습관이 바뀌면 이 숫자가 줄어듭니다. 소리 크기만 봅니다. 한국어를 읽어 주는 동안은 재지 않습니다.</p>
    <p><b>⏺ 녹음 다시 듣기</b>: 말한 것을 녹음해, 답을 연 뒤 모범 답과 비교해 들을 수 있습니다. 결과 화면에서도 다시 들을 수 있고, 받아쓰기할 때 씁니다. 이번 세션 동안만 기기 메모리에 있고 저장·전송하지 않습니다.</p>
    <p><b>음성 인식으로 목표 표현 확인 (실험)</b>: 음성 인식은 틀린 말을 그럴듯하게 다듬어 적기 때문에 오류 찾기에는 쓰지 않습니다. 다듬어져도 남는 것만 봅니다: 목표 표현을 썼는지, 피할 표현(及び·確認後 같은 명사 나열, 計算·親旧 같은 음독 직역, 社長さん 같은 경어 방향 실수)이 나왔는지, L1은 결론이 앞쪽에 나왔는지.</p>
    <p class="note">아이폰 사파리는 마이크(🎤·⏺)와 음성 인식을 함께 쓰면 하나가 멈출 수 있습니다. 그럴 때는 하나만 켜세요. 처음 쓸 때 브라우저가 마이크 권한을 묻습니다.</p>

<script>
/* LA 디자인 v3 — 화면 전환 움직임과 숫자 올라가기.
   앱은 화면을 통째로 다시 그린다. 같은 카드를 다시 그릴 때는 움직임을 생략하고(.still),
   새로 나타난 카드에만 떠오르기·숫자 올라가기를 준다. */
(()=>{
  const view=document.getElementById("view"); if(!view) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const keyOf=el=>el.tagName+"."+String(el.className||"").replace(/\bstill\b/,"").trim()+"|"+(el.textContent||"").replace(/\s+/g,"").slice(0,40);
  let prev=new Set();
  const countUp=el=>{
    const n=[...el.childNodes].find(x=>x.nodeType===3&&/\d/.test(x.nodeValue)); if(!n) return;
    const m=n.nodeValue.match(/^(\D*)(\d+)([\s\S]*)$/); if(!m) return;
    const to=+m[2]; if(to<2) return;
    const t0=performance.now(), d=700;
    const step=t=>{const k=Math.min(1,(t-t0)/d); n.nodeValue=m[1]+Math.round(to*(1-Math.pow(1-k,3)))+m[3]; if(k<1) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  };
  new MutationObserver(()=>{
    const now=new Set();
    [...view.children].forEach(el=>{
      const k=keyOf(el); now.add(k);
      if(prev.has(k)) el.classList.add("still");
      else if(!reduce) el.querySelectorAll(".score,.sum b,.stat b").forEach(countUp);
    });
    prev=now;
  }).observe(view,{childList:true});
})();
</script>
