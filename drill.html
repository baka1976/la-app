<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LA 통역 드릴</title>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunken:#f5f7fa; --ink:#1b2331; --muted:#5a6477; --line:#d6dce5;
  --accent:#1f4e8c; --accent-soft:#e2eaf6; --on-accent:#ffffff;
  --red:#c0261b; --red-soft:#fde4e1; --ok:#1d7448; --ok-soft:#e1f2e8; --warn:#9a5a00; --warn-soft:#fbefd9;
  --f-jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-jps:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-ui:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --sunken:#151a22; --ink:#e5e9f0; --muted:#9aa4b5; --line:#2d3644;
  --accent:#8fb2ec; --accent-soft:#1e2b40; --on-accent:#0f1724; --red:#ff8b7f; --red-soft:#3d1d1a; --ok:#62c693; --ok-soft:#173327; --warn:#efb45e; --warn-soft:#3a2c16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --sunken:#151a22; --ink:#e5e9f0; --muted:#9aa4b5; --line:#2d3644;
  --accent:#8fb2ec; --accent-soft:#1e2b40; --on-accent:#0f1724; --red:#ff8b7f; --red-soft:#3d1d1a; --ok:#62c693; --ok-soft:#173327; --warn:#efb45e; --warn-soft:#3a2c16; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hrow{display:flex;align-items:baseline;gap:10px;padding-top:12px}
.brand{font-weight:700;font-size:1.05rem}
.ver{font-size:.78rem;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:.92rem;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
main.wrap{padding-block:18px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;min-width:0}
h2{font-size:1.02rem;margin:0}
h3{font-size:.85rem;margin:0;color:var(--muted)}
p{margin:0}
.note{font-size:.82rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:8px;padding:9px 16px;font:inherit;font-size:.92rem;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.rule b{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.tag{padding:2px 9px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);color:var(--muted)}
.ko{font-size:1.25rem;line-height:1.75;font-weight:600}
.ko.memo{font-size:1.05rem;font-weight:500;white-space:pre-line}
.ja{font-family:var(--f-jp);font-size:1.2rem;line-height:2.2}
.ja.s{font-size:1rem;line-height:2}
ruby rt{font-family:var(--f-jps);font-size:.55em;color:var(--muted)}
.timer{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .2s linear}
.big{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;color:var(--accent)}
.pts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.pts label{display:grid;grid-template-columns:22px 1fr;gap:8px;cursor:pointer;align-items:start}
.pts input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--accent)}
.alt{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--line)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:12px 0;font-size:1.05rem}
.grade .o[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grade .t[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.grade .x[aria-pressed="true"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:.9rem;background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:.8rem;line-height:1.5}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.sum div{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid}
.sum b{font-size:1.4rem}
.sum span{font-size:.76rem;color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--red)}
.hide{display:none!important}
.meas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem}
.meas b{font-family:var(--f-mono)}
.auto{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:.88rem}
.auto .heard{font-family:var(--f-jps);font-size:.95rem;line-height:1.8}
.lvl{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s linear}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.opt input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
details[open] summary{margin-bottom:8px}
@media (max-width:480px){.ko{font-size:1.12rem}.ja{font-size:1.08rem}.card{padding:15px}}
</style>
<style>
/* ==== LA 디자인 v3 — 쪽빛 학습 노트 (문제은행·통역 드릴 공통) ==== */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#f4f6fa; --ink:#172033; --muted:#5d6880; --line:#e1e6ee;
  --accent:#2a4c9a; --accent-2:#5a80d8; --accent-soft:#e8eefb; --accent-ink:#ffffff; --on-accent:#ffffff;
  --ok:#1f8a5a; --ok-soft:#e3f4ec; --bad:#c43b2f; --bad-soft:#fde8e5; --red:#c43b2f; --red-soft:#fde8e5; --warn:#a8650a; --warn-soft:#fcf0dc;
  --shadow:0 1px 2px rgba(20,32,60,.05),0 8px 24px -12px rgba(20,32,60,.18);
  --shadow-up:0 2px 4px rgba(20,32,60,.06),0 14px 30px -12px rgba(20,32,60,.24);
  --ease:cubic-bezier(.2,.7,.2,1); --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#181e28; --sunken:#131821; --ink:#e6eaf2; --muted:#9ba5b8; --line:#283141;
  --accent:#8fb0f0; --accent-2:#6d8fe0; --accent-soft:#1c2840; --accent-ink:#0c1424; --on-accent:#0c1424;
  --ok:#5fcf98; --ok-soft:#14301f; --bad:#ff8f84; --bad-soft:#3a1c1a; --red:#ff8f84; --red-soft:#3a1c1a; --warn:#f0b866; --warn-soft:#3a2b15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); --shadow-up:0 2px 4px rgba(0,0,0,.35),0 14px 30px -12px rgba(0,0,0,.6);
}}
body{background:radial-gradient(1200px 420px at 50% -120px,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed}

/* 머리: 반투명 고정 + 탭 밑줄이 미끄러지듯 */
header{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 3px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.ver{padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
nav button{position:relative;border-bottom-color:transparent!important;transition:color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--accent)!important}
nav button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));animation:tabIn .35s var(--ease) both}

/* 카드: 선 대신 그림자, 둥글게 */
.card{border-color:color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--r);box-shadow:var(--shadow)}
.item{border-color:color-mix(in srgb,var(--line) 75%,transparent);border-radius:12px;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
button.item:hover{transform:translateY(-2px);box-shadow:var(--shadow-up);border-color:var(--accent)}
.tag{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--surface)));border-radius:7px}
.watch{border-radius:12px}
details{border-radius:10px}

/* 버튼·칩: 누를 때 눌리고, 주 버튼은 그라디언트 */
.btn,.chip,.seg button,.grade button,.opt{transition:transform .12s var(--ease),background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.btn{border-radius:10px}
.btn:active:not(:disabled),.chip:active,.seg button:active,.grade button:active{transform:scale(.96)}
.btn.primary,.btn.pri{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover:not(:disabled),.btn.pri:hover:not(:disabled){box-shadow:0 8px 18px -6px color-mix(in srgb,var(--accent) 75%,transparent);transform:translateY(-1px)}
.chip[aria-pressed="true"]{box-shadow:0 2px 8px -3px color-mix(in srgb,var(--accent) 60%,transparent)}
.seg{border-radius:10px}

/* 진행 막대·타이머 */
.prog{height:6px;border-radius:3px;background:var(--sunken)}
.prog i{background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;transition:width .45s var(--ease)}
.timer{height:8px;border-radius:4px}
.timer i{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;box-shadow:0 0 10px color-mix(in srgb,var(--accent-2) 60%,transparent)}
.big{font-variant-numeric:tabular-nums;animation:tick 1s steps(1) infinite}
.lvl{height:8px;border-radius:4px}
.lvl i{background:linear-gradient(90deg,var(--ok),var(--accent-2));border-radius:4px}

/* 문제 풀이: 정답은 살짝 튀고, 오답은 흔들림 */
.opt{border-radius:12px}
.opt:hover:not(:disabled){transform:translateX(3px);box-shadow:var(--shadow)}
.opt.ok{animation:okPop .5s var(--ease);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.opt.bad{animation:shake .4s ease}
.fb{animation:rise .35s var(--ease) both;border-radius:12px}
.stem{letter-spacing:.01em}
.score{background:linear-gradient(135deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.score .muted{-webkit-text-fill-color:var(--muted)}
.grade button[aria-pressed="true"]{animation:okPop .35s var(--ease)}
.wrong{border-radius:12px} .model{border-radius:12px;animation:rise .35s var(--ease) both}

/* 그래프·표가 그려지며 나타남 */
.bar .t i,.pbar .t i,.para .t i,.prog i{transform-origin:left}
.bar .t i,.pbar .t i{animation:grow .8s var(--ease) both .1s}
table.heat td{animation:fade .5s ease both}
.stat div,.sum div{border-radius:12px;border-color:color-mix(in srgb,var(--line) 70%,transparent);background:linear-gradient(180deg,var(--surface),var(--sunken))}

/* 화면이 바뀔 때 카드가 차례로 떠오름 (같은 화면을 다시 그릴 때는 생략) */
#view>*{animation:rise .45s var(--ease) both}
#view>*:nth-child(2){animation-delay:.05s} #view>*:nth-child(3){animation-delay:.1s}
#view>*:nth-child(4){animation-delay:.15s} #view>*:nth-child(n+5){animation-delay:.2s}
#view>.still{animation:none!important}
#view>.still .bar .t i,#view>.still .pbar .t i,#view>.still table.heat td{animation:none!important}

/* 넓은 화면: 목록은 2열, 작문·번역은 과제(왼쪽)와 쓰는 칸(오른쪽) 2단 */
@media (min-width:1000px){
  .wrap{max-width:1080px}
  .stage .list,#view>.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #view:has(>section.task){grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start;column-gap:20px}
  #view:has(>section.task)>*{grid-column:1}
  #view:has(>section.task)>section.card:has(#wt),#view:has(>section.task)>section.card:has(#ko),#view:has(>section.task)>section.card:has(#bk){grid-column:2;grid-row:1/span 6;position:sticky;top:120px}
  #view:has(>section.task) textarea.write{min-height:22rem}
}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tabIn{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes okPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes tick{0%{opacity:1}50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>
  <div class="wrap">
    <div class="hrow"><span class="brand">LA 통역 드릴</span><span class="ver">S3-2 · v4.1 · AI 없이 동작</span></div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="drill">연습</button>

      <button role="tab" data-tab="log">기록</button>

    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>

const normJa=s=>String(s||"").replace(/[\s、。,.!?！？「」]/g,"");
function autoCheck(it,heard){
  const h=normJa(heard); if(!h) return null;
  const base=SET_CHK[it.set]||{kw:[],ng:[]}, own=CHK[it.id]||{}, out=[];
  base.kw.forEach(g=>out.push({label:g.label,ok:g.alts.some(a=>h.includes(a))}));
  (own.kw||[]).forEach(g=>out.push({label:"목표 표현 "+g[0],ok:g.some(a=>h.includes(a))}));

  if(own.lead){const head=h.slice(0,Math.max(12,Math.round(h.length*.35))); out.push({label:"결론 먼저 ("+own.lead[0]+")",ok:own.lead.some(a=>head.includes(a))});}

/* ===== 마이크: 첫마디까지 걸린 시간·멈춤 (v4) =====
   소리 크기만 본다. 음성 인식이 필요 없고, 녹음을 저장하지 않는다. */
const MIC={ok:false,stream:null,ctx:null,an:null,buf:null};
async function micStart(){
  if(MIC.ok){try{await MIC.ctx.resume()}catch(e){} return true;}
  try{
    MIC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const AC=window.AudioContext||window.webkitAudioContext; MIC.ctx=new AC(); await MIC.ctx.resume();
    const src=MIC.ctx.createMediaStreamSource(MIC.stream); MIC.an=MIC.ctx.createAnalyser(); MIC.an.fftSize=1024; src.connect(MIC.an);
    MIC.buf=new Float32Array(MIC.an.fftSize); MIC.ok=true; return true;
  }catch(e){micOff(); return false;}
}
function micOff(){measStop(true); if(MIC.stream) MIC.stream.getTracks().forEach(t=>t.stop()); if(MIC.ctx){try{MIC.ctx.close()}catch(e){}} Object.assign(MIC,{ok:false,stream:null,ctx:null,an:null,buf:null});}
function micLevel(){MIC.an.getFloatTimeDomainData(MIC.buf); let s=0; for(let i=0;i<MIC.buf.length;i++) s+=MIC.buf[i]*MIC.buf[i]; return Math.sqrt(s/MIC.buf.length);}
let MEAS=null;
function measStart(){
  measStop(true); if(!MIC.ok) return;
  MEAS={t0:performance.now(),cal:[],thr:null,run:0,onset:null,lastV:null,silStart:null,pauses:[],hold:false};
  MEAS.iv=setInterval(measTick,40);
}
function measTick(){
  const m=MEAS; if(!m||!MIC.ok) return;
  const now=performance.now(), r=micLevel();
  const bar=document.getElementById("lvl"); if(bar) bar.style.width=Math.min(100,r*900)+"%";
  if(m.hold) return;
  if(m.thr===null){m.cal.push(r); if(now-m.t0>=350){const a=m.cal.slice().sort((x,y)=>x-y); m.thr=Math.max((a[Math.floor(a.length/2)]||.001)*3.2,.012);} return;}
  if(r>m.thr){
    m.run+=40;
    if(m.onset===null&&m.run>=160) m.onset=now-m.run-m.t0;
    if(m.onset!==null){ if(m.silStart!==null){const gap=now-m.silStart; if(gap>=600) m.pauses.push(gap); m.silStart=null;} m.lastV=now-m.t0; }
  } else { m.run=0; if(m.onset!==null&&m.silStart===null) m.silStart=now; }
}
function measHold(on){ if(!MEAS) return; if(on){MEAS.hold=true;} else {Object.assign(MEAS,{hold:false,t0:performance.now(),onset:null,lastV:null,silStart:null,pauses:[],run:0});} }
function measStop(discard){
  const m=MEAS; MEAS=null; if(!m) return null; clearInterval(m.iv);
  if(discard) return null;
  if(m.onset===null) return {lat:null};
  return {lat:Math.round(m.onset),spk:Math.round((m.lastV||m.onset)-m.onset),pz:m.pauses.length,pzMax:m.pauses.length?Math.round(Math.max(...m.pauses)):0};
}
const sec=ms=>ms==null?"-":(ms/1000).toFixed(1)+"초";
function measText(x){ if(!x) return ""; if(x.lat==null) return "목소리를 못 잡음"; return `첫마디 ${sec(x.lat)} · 멈춤 ${x.pz}번${x.pz?` (최장 ${sec(x.pzMax)})`:""}`; }

/* ===== 음성 인식 (실험) ===== */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const ASR={ok:!!SRC,rec:null,keep:false};
function asrStart(){
  if(!ASR.ok) return; asrAbort();
  const r=new SRC(); r.lang="ja-JP"; r.continuous=true; r.interimResults=false; r.maxAlternatives=1; r._t="";
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) r._t+=e.results[i][0].transcript;};
  r.onerror=()=>{}; r.onend=()=>{ if(ASR.rec===r&&ASR.keep){try{r.start()}catch(e){}} };
  ASR.rec=r; ASR.keep=true; try{r.start()}catch(e){}
}
function asrAbort(){const r=ASR.rec; ASR.keep=false; ASR.rec=null; if(r){try{r.abort()}catch(e){}}}
function asrStop(){
  return new Promise(res=>{
    const r=ASR.rec; ASR.keep=false; ASR.rec=null; if(!r){res("");return;}
    let done=false; const fin=()=>{if(!done){done=true; res(r._t||"");}};
    r.onend=fin; try{r.stop()}catch(e){fin()} setTimeout(fin,1800);
  });
}

const RUBY=/([\u3005\u4e00-\u9fff]+)\{([^}]+)\}/g;
const ruby=s=>esc(s).replace(RUBY,"<ruby>$1<rt>$2</rt></ruby>");
const plainJa=s=>s.replace(RUBY,"$1");
const speakJa=s=>s.replace(RUBY,"$2").replace(/\(.*?\)|（.*?）/g,"");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const stamp=()=>{const d=new Date();return today()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rec=id=>DB.items[id]||(DB.items[id]={n:0,streak:0,due:"",g:"",hist:[]});
const isDue=id=>{const r=DB.items[id];return r&&r.n>0&&r.due&&r.due<=today();};
function copyText(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent="복사됨";setTimeout(()=>btn.textContent=o,1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}ta.remove();}
}

/* ===== 음성 읽기 ===== */
const TTS={ok:"speechSynthesis" in window,voices:[]};
function loadVoices(){if(!TTS.ok)return;TTS.voices=speechSynthesis.getVoices();}
if(TTS.ok){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function voiceFor(lang){return TTS.voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang));}
function speak(text,lang,rate){
  return new Promise(res=>{
    if(!TTS.ok){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==="ja"?"ja-JP":"ko-KR";
    const v=voiceFor(lang);if(v)u.voice=v;
    u.rate=rate||1;
    let finished=false;const fin=()=>{if(!finished){finished=true;res();}};
    u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
    setTimeout(fin,Math.max(4000,text.length*400/(rate||1)));
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let SET={src:"P01",stage:1};
let RUN=null;
function pool(src){
  if(src==="MIX")return ITEMS.slice();
  if(src==="DUE")return ITEMS.filter(i=>isDue(i.id));
  return ITEMS.filter(i=>i.set===src);
}

    </div>
    <p class="note">1 천천히: 생각하고 말한 뒤 직접 답을 연다. 2 빠르게: 제한 시간(문장형 10초, 보고 25초)이 지나면 답이 자동으로 열린다. 3 섞어서: 모든 세트를 섞어 빠르게. 4단계(대화 속)는 롤플레이 탭에서.</p>
    ${SET.src in SETS?ruleBox(SET.src):""}
    <h3>측정 (선택, 참고용)</h3>
    <label class="opt"><input type="checkbox" id="optMic" ${DB.opt.mic?"checked":""}><span><b>🎤 반응 시간 재기</b> — 문장이 나온 뒤 첫마디까지 걸린 시간과 중간에 멈춘 횟수(0.6초 이상)를 잽니다. 소리 크기만 보고, 녹음은 저장하지 않습니다.</span></label>
    <label class="opt"><input type="checkbox" id="optAsr" ${DB.opt.asr?"checked":""} ${ASR.ok?"":"disabled"}><span><b>음성 인식으로 목표 표현 확인 (실험)</b> — 말한 것을 글자로 받아 목표 표현을 썼는지, 피할 표현은 안 썼는지, 결론을 먼저 말했는지만 봅니다. 음성 인식은 실수를 다듬어 적으므로 조사·활용 같은 세부는 판정하지 않습니다.${ASR.ok?"":" <span class='warn'>(이 브라우저는 음성 인식을 지원하지 않음)</span>"}</span></label>
    <p class="note" id="micmsg"></p>
    <div class="row"><button class="btn pri" id="go" ${pool(SET.src).length?"":"disabled"}>시작 (${pool(SET.src).length}문장)</button></div>
    ${SET.src==="DUE"&&!due?`<p class="note">오늘 복습할 문장이 없습니다. △×는 다음 날, ○는 3·7·14·30일 뒤에 다시 나옵니다.</p>`:""}
  </section>`;
  document.querySelectorAll("#srcs .chip").forEach(b=>b.onclick=()=>{SET.src=b.dataset.k;viewDrill();});
  document.querySelectorAll("#stages .chip").forEach(b=>b.onclick=()=>{if(!b.disabled){SET.stage=+b.dataset.s;viewDrill();}});
  $("#optMic").onchange=e=>{DB.opt.mic=e.target.checked;save();};
  $("#optAsr").onchange=e=>{DB.opt.asr=e.target.checked;save();};
  $("#go").onclick=async()=>{
    if(DB.opt.mic){
      const ok=await micStart();
      if(!ok){ $("#micmsg").innerHTML="<span class='bad'>마이크를 쓸 수 없습니다. 브라우저 주소창의 마이크 권한을 허용하거나, 측정을 끄고 시작하세요.</span>"; return; }
    } else micOff();
    const items=shuffle(pool(SET.src));
    const stage=SET.src==="MIX"?3:(SET.src==="DUE"?SET.stage:SET.stage);
    RUN={src:SET.src,stage,items:items.map(it=>({it,g:"",miss:[],memo:"",shown:false})),i:0,start:Date.now(),done:false};

}
function ruleBox(k){const s=SETS[k];return `<div class="rule"><b>${s.name}</b><p>${esc(s.rule)}</p><p class="note">대체 문형: <span lang="ja">${esc(s.chunk)}</span></p></div>`;}
let TIMER=null;
function clearTimer(){if(TIMER){clearInterval(TIMER);TIMER=null;}}
function viewCard(){
  clearTimer();
  const c=RUN.items[RUN.i], it=c.it, S=SETS[it.set];
  const timed=RUN.stage>=2&&!c.shown;
  $("#view").innerHTML=`
  <section class="card">
    <div class="meta"><span class="tag">${RUN.i+1} / ${RUN.items.length}</span><span class="tag">${S.short}</span><span class="tag">${it.type}</span><span class="tag">단계 ${RUN.stage}</span></div>
    <p class="note">장면: ${esc(it.scene)}</p>
    <p class="ko ${it.type==="응답형"?"memo":""}">${esc(it.ko)}</p>
    ${timed?`<div class="row"><span class="big" id="sec">${S.limit}</span><span class="note">초 안에 일본어로 말하기</span></div><div class="timer"><i id="bar"></i></div>`:""}
    ${!c.shown&&(DB.opt.mic&&MIC.ok||DB.opt.asr&&ASR.ok)?`${MIC.ok?`<div class="lvl" title="마이크 소리 크기"><i id="lvl"></i></div>`:""}<p class="note">${DB.opt.mic?"🎤 재는 중":""}${DB.opt.mic&&DB.opt.asr?" · ":""}${DB.opt.asr?"음성 인식 중":""} — 다 말했으면 버튼을 누르세요.</p>`:""}
    <div class="row">
      ${TTS.ok?`<button class="btn" id="sayKo">한국어 듣기</button>`:""}
      ${c.shown?"":`<button class="btn pri" id="reveal">말했어요 · 답 보기</button>`}
    </div>
  </section>
  ${c.shown?answerCard(c):""}`;
  if(TTS.ok)$("#sayKo").onclick=async()=>{speechSynthesis.cancel();measHold(true);await speak(it.ko,"ko");measHold(false);};
  const close=()=>{ c.shown=true; if(DB.opt.mic) c.meas=measStop(); else measStop(true);
    if(DB.opt.asr&&ASR.ok){ c.heardPending=true; asrStop().then(t=>{c.heard=t.trim(); c.auto=autoCheck(it,c.heard); c.heardPending=false; const el=$("#auto"); if(el) el.outerHTML=autoHTML(c);}); } };
  if(!c.shown){
    if(DB.opt.mic&&MIC.ok) measStart();
    if(DB.opt.asr&&ASR.ok) asrStart();
    $("#reveal").onclick=()=>{close();viewCard();};
    if(timed){
      const end=Date.now()+S.limit*1000;
      TIMER=setInterval(()=>{
        const left=Math.max(0,end-Date.now());
        const sec=$("#sec"),bar=$("#bar");
        if(!sec){clearTimer();return;}
        sec.textContent=Math.ceil(left/1000);
        bar.style.width=(left/(S.limit*1000)*100)+"%";
        if(left<=0){clearTimer();close();c.timeout=true;viewCard();}
      },200);

}
function answerCard(c){
  const it=c.it;
  return `<section class="card">
    ${c.timeout?`<p class="note warn">시간이 다 됐습니다. 끝까지 말하지 못했으면 막힘을 누르세요.</p>`:""}
    ${c.meas?`<div class="meas"><span>🎤 <b>${esc(measText(c.meas))}</b></span>${c.meas.lat!=null?`<span class="note">말한 길이 ${sec(c.meas.spk)}</span>`:""}</div>`:""}
    ${DB.opt.asr&&ASR.ok?autoHTML(c):""}
    <h3>모범 답</h3>
    <p class="ja" lang="ja">${ruby(it.ja)}</p>
    ${TTS.ok?`<div class="row"><button class="btn" id="sayJa">일본어 듣기</button></div>`:""}
    <h3>이것도 OK</h3>
    <div class="alt">${it.alt.map(a=>`<p class="ja s" lang="ja">${ruby(a)}</p>`).join("")}</div>
    ${it.tip?`<p class="note">참고: <span>${ruby(it.tip)}</span></p>`:""}
    <h3>포인트 (참고)</h3>
    <ul style="margin:0;padding-left:1.2em;display:grid;gap:4px">${it.pts.map(p=>`<li>${ruby(p)}</li>`).join("")}</ul>
    <h3>제한 시간 안에 끝까지 말했나요?</h3>
    <p class="note">정확성은 스스로 채점하지 않습니다. 녹음을 받아써서 결과지와 함께 보내면 Claude가 채점합니다.</p>
    <div class="grade" style="grid-template-columns:repeat(2,1fr)">
      <button class="btn o" data-g="말함" aria-pressed="${c.g==="말함"}">말함</button>
      <button class="btn x" data-g="막힘" aria-pressed="${c.g==="막힘"}">막힘</button>
    </div>
    <input type="text" id="memo" placeholder="메모 (선택): 막힌 곳, 내가 말한 문장 (로마자·한국어 가능)" value="${esc(c.memo)}">
    <div class="row"><button class="btn pri" id="next" ${c.g?"":"disabled"}>${RUN.i+1<RUN.items.length?"다음 문장":"결과 보기"}</button></div>
  </section>`;
}
function autoHTML(c){
  if(c.heardPending) return `<div class="auto" id="auto"><span class="note">음성 인식 결과를 정리하는 중…</span></div>`;
  if(!c.heard) return `<div class="auto" id="auto"><span class="note">음성 인식이 아무것도 받지 못했습니다 (조용한 곳에서, 화면을 켠 채로 말해 보세요).</span></div>`;
  return `<div class="auto" id="auto"><h3>자동 확인 (참고 · 음성 인식이 다듬어 적었을 수 있음)</h3>
    <p class="heard" lang="ja">${esc(c.heard)}</p>
    ${(c.auto||[]).length?`<div class="meas">${c.auto.map(a=>`<span class="${a.ok?"ok":"bad"}">${a.ok?"✓":"✗"} ${esc(a.label)}</span>`).join("")}</div>`:`<span class="note">이 문장은 자동 확인 항목이 없습니다.</span>`}</div>`;
}
function bindAnswer(c){
  if(TTS.ok)$("#sayJa").onclick=()=>{speechSynthesis.cancel();speak(speakJa(c.it.ja),"ja");};
  document.querySelectorAll(".grade button").forEach(b=>b.onclick=()=>{
    c.g=b.dataset.g;
    document.querySelectorAll(".grade button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#next").disabled=false;
  });
  $("#memo").oninput=e=>c.memo=e.target.value;
  $("#next").onclick=()=>{
    c.miss=[];
    commit(c);
    RUN.i++;
    if(RUN.i>=RUN.items.length){RUN.done=true;RUN.end=Date.now();saveSession();viewEnd();}
    else viewCard();
    window.scrollTo(0,0);
  };
}
function commit(c){
  const r=rec(c.it.id);
  r.n++;r.g=c.g;
  if(c.g==="말함"||c.g==="○"){r.streak++;r.due=addDays([3,7,14,30][Math.min(r.streak-1,3)]);}
  else{r.streak=0;r.due=addDays(1);}
  r.hist.push({d:today(),st:RUN.stage,g:c.g,miss:c.miss,lat:c.meas&&c.meas.lat!=null?c.meas.lat:undefined,pz:c.meas&&c.meas.lat!=null?c.meas.pz:undefined,auto:c.auto?c.auto.filter(a=>a.ok).length+"/"+c.auto.length:undefined});
  if(r.hist.length>30)r.hist=r.hist.slice(-30);
  save();
}
function saveSession(){
  const cnt={"말함":0,"막힘":0};RUN.items.forEach(c=>cnt[c.g]=(cnt[c.g]||0)+1);
  const L=RUN.items.map(c=>c.meas&&c.meas.lat).filter(v=>v!=null);
  DB.sessions.push({at:stamp(),src:RUN.src,stage:RUN.stage,n:RUN.items.length,cnt,min:Math.round((RUN.end-RUN.start)/60000),lat:L.length?Math.round(L.reduce((a,b)=>a+b,0)/L.length):undefined});
  if(DB.sessions.length>60)DB.sessions=DB.sessions.slice(-60);
  save();
}
function srcName(s){return s==="MIX"?"섞어서":s==="DUE"?"복습 대상":SETS[s].short+" "+SETS[s].name.replace(SETS[s].short+" ","");}
function talkStatus(k){
  const t=DB.talk[k]||{seq:[]};let run=0;for(let i=t.seq.length-1;i>=0;i--){if(t.seq[i]===false)run++;else break;}
  return {run,total:t.seq.length,grad:run>=3};
}
function drillRate(k,stage){
  const h=[];ITEMS.filter(i=>i.set===k).forEach(i=>{const r=DB.items[i.id];if(r)r.hist.forEach(x=>{if(!stage||x.st===stage)h.push(x);});});
  h.sort((a,b)=>a.d<b.d?-1:1);const last=h.slice(-10);
  if(!last.length)return null;
  return Math.round(last.filter(x=>x.g==="○"||x.g==="말함").length/last.length*100);
}
function drillLat(k){
  const h=[];ITEMS.filter(i=>i.set===k).forEach(i=>{const r=DB.items[i.id];if(r)r.hist.forEach(x=>{if(x.lat!=null)h.push(x);});});
  h.sort((a,b)=>a.d<b.d?-1:1);const last=h.slice(-10); if(!last.length) return null;
  return Math.round(last.reduce((a,x)=>a+x.lat,0)/last.length);
}
function resultText(){
  const cnt={"말함":0,"막힘":0};RUN.items.forEach(c=>cnt[c.g]=(cnt[c.g]||0)+1);
  const bad=RUN.items.filter(c=>c.g==="막힘");
  let t=`[LA 통역 드릴 결과지] ${stamp()} · 세트 ${srcName(RUN.src)} · 단계 ${RUN.stage} · ${RUN.items.length}문장 · 약 ${Math.max(1,Math.round((RUN.end-RUN.start)/60000))}분\n말함 ${cnt["말함"]} · 막힘 ${cnt["막힘"]}\n`;
  t+=`\n── 막힌 문장 (${bad.length})\n`;
  bad.forEach((c,k)=>{const it=c.it; t+=`${k+1}) [${it.id} · ${it.type} · ${it.scene}] ${it.ko.replace(/\n/g," / ")}${c.timeout?" (시간 초과)":""}\n`; if(c.memo)t+=`   메모: ${c.memo}\n`;});
  const memo=RUN.items.filter(c=>c.g==="말함"&&c.memo);
  if(memo.length){t+=`\n── 말한 문장의 메모\n`;memo.forEach(c=>t+=`- [${c.it.id}] ${c.memo}\n`);}
  const measured=RUN.items.filter(c=>c.meas||c.heard);
  if(measured.length){
    const L=RUN.items.map(c=>c.meas&&c.meas.lat).filter(v=>v!=null);
    t+=`\n── 측정 (참고)${L.length?` · 첫마디 평균 ${sec(Math.round(L.reduce((a,b)=>a+b,0)/L.length))}`:""}\n`;
    measured.forEach(c=>{t+=`- [${c.it.id}] ${c.g}${c.meas?` · ${measText(c.meas)}`:""}${c.heard?`\n   자동 인식: ${c.heard}`:""}${c.auto&&c.auto.length?`\n   자동 확인: ${c.auto.map(a=>(a.ok?"✓ ":"✗ ")+a.label).join(" / ")}`:""}\n`;});
  }
  if((RUN.trans||"").trim()){t+=`\n── 녹음 받아쓰기 (내가 실제로 말한 문장)\n${RUN.trans.trim()}\n`;}
  t+=`\n── 말하기 상태\n`;
  Object.keys(SETS).forEach(k=>{const r=drillRate(k);const s=talkStatus(k);const lt=drillLat(k);t+=`${SETS[k].short}: 드릴 최근 10회 말함 ${r===null?"-":r+"%"}${lt!=null?` · 첫마디 평균 ${sec(lt)}`:""} · 대화 속 연속 안 나옴 ${s.run}/3${s.grad?" (말하기 졸업)":""}\n`;});
  t+=`\n── 요청\n`;
  if(RUN.items.some(c=>c.heard)) t+=`자동 인식 문장은 음성 인식이 다듬어 적었을 수 있습니다. 목표 표현을 썼는지·결론을 먼저 말했는지 같은 구조는 자동 인식으로 판정하고, 조사·활용 같은 세부는 받아쓰기한 문장이 있을 때만 판정해 주세요.\n`;
  t+= (RUN.trans||"").trim()
    ? `받아쓴 문장을 문항 번호의 모범 답·포인트 기준으로 채점해 주세요(포인트별 지킴/못 지킴, 틀림/부자연/변이 구분, 한자어는 읽기 병기). 막힌 문장은 원인을 LA-07 패턴으로 짚고, 같은 패턴으로 내용·장면이 다른 새 문장 5개를 (한국어, 모범 답, 허용 표현, 포인트) 형식으로 만들어 주세요.`
    : `막힌 문장의 원인을 LA-07 패턴으로 짚고, 같은 패턴으로 내용·장면이 다른 새 문장 5개를 (한국어, 모범 답, 허용 표현, 포인트) 형식으로 만들어 주세요. 메모에 적은 문장이 있으면 포인트 기준으로 채점해 주세요.`;
  return t;
}
function viewEnd(){
  clearTimer(); asrAbort(); micOff();
  const cnt={"말함":0,"막힘":0};RUN.items.forEach(c=>cnt[c.g]=(cnt[c.g]||0)+1);
  RUN.trans=RUN.trans||"";
  $("#view").innerHTML=`
  <section class="card">

    <h3>녹음 받아쓰기 (선택, 주 1회 권장)</h3>

    <textarea id="trn" lang="ja" placeholder="P01-03: 何か問題が起きたら…">${esc(RUN.trans)}</textarea>
    <h3>결과지 (Claude에게 붙여 넣기)</h3>
    <textarea readonly id="res"></textarea>
    <div class="row"><button class="btn pri" id="cp">결과지 복사</button><button class="btn" id="again">새로 시작</button></div>
  </section>`;
  const upd=()=>{$("#res").value=resultText();};
  upd();
  $("#trn").oninput=e=>{RUN.trans=e.target.value;upd();};
  $("#cp").onclick=e=>copyText(resultText(),e.target);
  $("#again").onclick=()=>{RUN=null;viewDrill();};
}

/* ===== 핸즈프리 ===== */
let HF={src:"P01",rate:0.95,twice:false,running:false,token:0};
function stopHands(){HF.running=false;HF.token++;if(TTS.ok)speechSynthesis.cancel();}
function viewHands(){
  const jaV=voiceFor("ja"),koV=voiceFor("ko");
  $("#view").innerHTML=`
  <section class="card">
    <h2>핸즈프리 (이어폰용)</h2>
    <p>한국어를 읽어 줌 → 말할 시간만큼 쉼 (그동안 일본어로 말하기) → 일본어 모범 답을 읽어 줌 → 다음 문장. 화면을 보지 않아도 됩니다. 채점은 하지 않으니, 틀린 문장은 나중에 연습 탭에서 다시 하세요.</p>
    ${!TTS.ok?`<p class="bad">이 브라우저는 음성 읽기를 지원하지 않습니다.</p>`:`<p class="note">음성: 일본어 ${jaV?esc(jaV.name):"<span class='warn'>찾지 못함 (기본 음성으로 시도)</span>"} · 한국어 ${koV?esc(koV.name):"<span class='warn'>찾지 못함</span>"}</p>`}
    <div class="chips" id="hsrc">${[["P01","P-01"],["P04","P-04"],["L1","L1"],["MIX","섞어서"]].map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${HF.src===k}">${l}</button>`).join("")}</div>
    <div class="row"><label class="note" for="rate">읽기 속도</label><select id="rate" style="width:auto">${[0.8,0.9,0.95,1,1.1].map(r=>`<option value="${r}" ${HF.rate===r?"selected":""}>${r}</option>`).join("")}</select>
      <label class="note"><input type="checkbox" id="tw" ${HF.twice?"checked":""}> 일본어 두 번</label></div>
    <div class="row"><button class="btn pri" id="hgo" ${TTS.ok?"":"disabled"}>${HF.running?"멈추기":"시작"}</button></div>
    <p class="note" id="hnow" aria-live="polite"></p>
    <p class="note">아이폰은 화면이 잠기면 읽기가 멈출 수 있습니다 (기기별 확인 필요). 쉬는 시간: 문장형 ${SETS.P01.limit}초, 보고 ${SETS.L1.limit}초.</p>
  </section>`;
  document.querySelectorAll("#hsrc .chip").forEach(b=>b.onclick=()=>{if(!HF.running){HF.src=b.dataset.k;viewHands();}});
  $("#rate").onchange=e=>HF.rate=+e.target.value;
  $("#tw").onchange=e=>HF.twice=e.target.checked;
  $("#hgo").onclick=()=>{if(HF.running){stopHands();viewHands();}else runHands();};
}
async function runHands(){
  HF.running=true;const my=++HF.token;viewHands();
  const items=shuffle(pool(HF.src));
  const now=t=>{const el=$("#hnow");if(el)el.textContent=t;};
  for(let i=0;i<items.length;i++){
    if(my!==HF.token)return;
    const it=items[i],lim=SETS[it.set].limit;
    now(`${i+1}/${items.length} · ${it.id} · 한국어`);
    await speak((it.type==="응답형"?it.scene+". ":"")+it.ko.replace(/\(메모\)\n?/,"메모. ").replace(/\n/g,", "),"ko",HF.rate);
    for(let s=lim;s>0;s--){if(my!==HF.token)return;now(`${i+1}/${items.length} · 말하기 ${s}초`);await wait(1000);}
    if(my!==HF.token)return;
    now(`${i+1}/${items.length} · 모범 답`);
    await speak(speakJa(it.ja),"ja",HF.rate);
    if(HF.twice){await wait(800);if(my!==HF.token)return;await speak(speakJa(it.ja),"ja",HF.rate);}
    await wait(2000);
  }
  if(my===HF.token){HF.running=false;viewHands();const el=$("#hnow");if(el)el.textContent="끝. 연습 탭에서 채점하며 다시 해 보세요.";}
}

<script>
/* LA 디자인 v3 — 화면 전환 움직임과 숫자 올라가기.
   앱은 화면을 통째로 다시 그린다. 같은 카드를 다시 그릴 때는 움직임을 생략하고(.still),
   새로 나타난 카드에만 떠오르기·숫자 올라가기를 준다. */
(()=>{
  const view=document.getElementById("view"); if(!view) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const keyOf=el=>el.tagName+"."+String(el.className||"").replace(/\bstill\b/,"").trim()+"|"+(el.textContent||"").replace(/\s+/g,"").slice(0,40);
  let prev=new Set();
  const countUp=el=>{
    const n=[...el.childNodes].find(x=>x.nodeType===3&&/\d/.test(x.nodeValue)); if(!n) return;
    const m=n.nodeValue.match(/^(\D*)(\d+)([\s\S]*)$/); if(!m) return;
    const to=+m[2]; if(to<2) return;
    const t0=performance.now(), d=700;
    const step=t=>{const k=Math.min(1,(t-t0)/d); n.nodeValue=m[1]+Math.round(to*(1-Math.pow(1-k,3)))+m[3]; if(k<1) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  };
  new MutationObserver(()=>{
    const now=new Set();
    [...view.children].forEach(el=>{
      const k=keyOf(el); now.add(k);
      if(prev.has(k)) el.classList.add("still");
      else if(!reduce) el.querySelectorAll(".score,.sum b,.stat b").forEach(countUp);
    });
    prev=now;
  }).observe(view,{childList:true});
})();
</script>
</body>
