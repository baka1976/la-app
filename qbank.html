:root{

}

  --seq1:#1f2b3e; --seq2:#2f4a73; --seq3:#5579b2; --seq4:#8fb2ec; --seq-ink:#0f1726; color-scheme:dark}}
:root[data-theme="dark"]{

  --ok:#62c693; --ok-soft:#173327; --bad:#f08b80; --bad-soft:#3a1e1c; --warn:#efb45e; --warn-soft:#3a2c16;

.flag{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--warn)}
.score{font-family:var(--f-jp);font-size:2.4rem;font-weight:700;line-height:1}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:5.5rem 1fr 3.4rem;gap:10px;align-items:center;font-size:.85rem}

.h0{background:var(--sunken);color:var(--muted)} .h1{background:var(--seq1)} .h2{background:var(--seq2)} .h3{background:var(--seq3);color:var(--seq-ink)} .h4{background:var(--seq4);color:var(--seq-ink)}

.para .t{height:8px;background:var(--sunken);border-radius:0 4px 4px 0;overflow:hidden}
.para .t i{display:block;height:100%;background:var(--accent)}
.para.over .t i{background:var(--warn)} .para.over .v{color:var(--warn)}
.para .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.wrong{font-family:var(--f-jps);font-size:1.08rem;line-height:1.9;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px}
.model{font-family:var(--f-jps);font-size:1.08rem;line-height:2.1;border:1px dashed var(--ok);border-radius:8px;padding:10px 12px;color:var(--ink)}

.grade{display:flex;gap:8px}
.grade button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}

.ex{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:8px 0 4px;border-top:1px dashed var(--line);font-size:.86rem;align-items:start}

<style>
/* ==== LA 디자인 v3 — 쪽빛 학습 노트 (문제은행·통역 드릴 공통) ==== */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#f4f6fa; --ink:#172033; --muted:#5d6880; --line:#e1e6ee;
  --accent:#2a4c9a; --accent-2:#5a80d8; --accent-soft:#e8eefb; --accent-ink:#ffffff; --on-accent:#ffffff;
  --ok:#1f8a5a; --ok-soft:#e3f4ec; --bad:#c43b2f; --bad-soft:#fde8e5; --red:#c43b2f; --red-soft:#fde8e5; --warn:#a8650a; --warn-soft:#fcf0dc;
  --shadow:0 1px 2px rgba(20,32,60,.05),0 8px 24px -12px rgba(20,32,60,.18);
  --shadow-up:0 2px 4px rgba(20,32,60,.06),0 14px 30px -12px rgba(20,32,60,.24);
  --ease:cubic-bezier(.2,.7,.2,1); --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#181e28; --sunken:#131821; --ink:#e6eaf2; --muted:#9ba5b8; --line:#283141;
  --accent:#8fb0f0; --accent-2:#6d8fe0; --accent-soft:#1c2840; --accent-ink:#0c1424; --on-accent:#0c1424;
  --ok:#5fcf98; --ok-soft:#14301f; --bad:#ff8f84; --bad-soft:#3a1c1a; --red:#ff8f84; --red-soft:#3a1c1a; --warn:#f0b866; --warn-soft:#3a2b15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); --shadow-up:0 2px 4px rgba(0,0,0,.35),0 14px 30px -12px rgba(0,0,0,.6);
}}
body{background:radial-gradient(1200px 420px at 50% -120px,var(--accent-soft),transparent 70%),var(--bg);background-attachment:fixed}

/* 머리: 반투명 고정 + 탭 밑줄이 미끄러지듯 */
header{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 3px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.ver{padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
nav button{position:relative;border-bottom-color:transparent!important;transition:color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--accent)!important}
nav button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));animation:tabIn .35s var(--ease) both}

/* 카드: 선 대신 그림자, 둥글게 */
.card{border-color:color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--r);box-shadow:var(--shadow)}
.item{border-color:color-mix(in srgb,var(--line) 75%,transparent);border-radius:12px;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
button.item:hover{transform:translateY(-2px);box-shadow:var(--shadow-up);border-color:var(--accent)}
.tag{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 60%,var(--surface)));border-radius:7px}
.watch{border-radius:12px}
details{border-radius:10px}

/* 버튼·칩: 누를 때 눌리고, 주 버튼은 그라디언트 */
.btn,.chip,.seg button,.grade button,.opt{transition:transform .12s var(--ease),background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.btn{border-radius:10px}
.btn:active:not(:disabled),.chip:active,.seg button:active,.grade button:active{transform:scale(.96)}
.btn.primary,.btn.pri{background:linear-gradient(135deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover:not(:disabled),.btn.pri:hover:not(:disabled){box-shadow:0 8px 18px -6px color-mix(in srgb,var(--accent) 75%,transparent);transform:translateY(-1px)}
.chip[aria-pressed="true"]{box-shadow:0 2px 8px -3px color-mix(in srgb,var(--accent) 60%,transparent)}
.seg{border-radius:10px}

/* 진행 막대·타이머 */
.prog{height:6px;border-radius:3px;background:var(--sunken)}
.prog i{background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;transition:width .45s var(--ease)}
.timer{height:8px;border-radius:4px}
.timer i{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;box-shadow:0 0 10px color-mix(in srgb,var(--accent-2) 60%,transparent)}
.big{font-variant-numeric:tabular-nums;animation:tick 1s steps(1) infinite}
.lvl{height:8px;border-radius:4px}
.lvl i{background:linear-gradient(90deg,var(--ok),var(--accent-2));border-radius:4px}

/* 문제 풀이: 정답은 살짝 튀고, 오답은 흔들림 */
.opt{border-radius:12px}
.opt:hover:not(:disabled){transform:translateX(3px);box-shadow:var(--shadow)}
.opt.ok{animation:okPop .5s var(--ease);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.opt.bad{animation:shake .4s ease}
.fb{animation:rise .35s var(--ease) both;border-radius:12px}
.stem{letter-spacing:.01em}
.score{background:linear-gradient(135deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.score .muted{-webkit-text-fill-color:var(--muted)}
.grade button[aria-pressed="true"]{animation:okPop .35s var(--ease)}
.wrong{border-radius:12px} .model{border-radius:12px;animation:rise .35s var(--ease) both}

/* 그래프·표가 그려지며 나타남 */
.bar .t i,.pbar .t i,.para .t i,.prog i{transform-origin:left}
.bar .t i,.pbar .t i{animation:grow .8s var(--ease) both .1s}
table.heat td{animation:fade .5s ease both}
.stat div,.sum div{border-radius:12px;border-color:color-mix(in srgb,var(--line) 70%,transparent);background:linear-gradient(180deg,var(--surface),var(--sunken))}

/* 화면이 바뀔 때 카드가 차례로 떠오름 (같은 화면을 다시 그릴 때는 생략) */
#view>*{animation:rise .45s var(--ease) both}
#view>*:nth-child(2){animation-delay:.05s} #view>*:nth-child(3){animation-delay:.1s}
#view>*:nth-child(4){animation-delay:.15s} #view>*:nth-child(n+5){animation-delay:.2s}
#view>.still{animation:none!important}
#view>.still .bar .t i,#view>.still .pbar .t i,#view>.still table.heat td{animation:none!important}

/* 넓은 화면: 목록은 2열, 작문·번역은 과제(왼쪽)와 쓰는 칸(오른쪽) 2단 */
@media (min-width:1000px){
  .wrap{max-width:1080px}
  .stage .list,#view>.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #view:has(>section.task){grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start;column-gap:20px}
  #view:has(>section.task)>*{grid-column:1}
  #view:has(>section.task)>section.card:has(#wt),#view:has(>section.task)>section.card:has(#ko),#view:has(>section.task)>section.card:has(#bk){grid-column:2;grid-row:1/span 6;position:sticky;top:120px}
  #view:has(>section.task) textarea.write{min-height:22rem}
}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tabIn{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes okPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes tick{0%{opacity:1}50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

 w:["「～ないことには」의 앞은 부정형이어야 한다.","「～ないことには」의 앞은 부정형이어야 한다.","「ことにも」라는 형식은 없다."],
 x:["実際に会ってみないことには、どんな人か分からない。","予算が決まらないことには、計画が立てられない。","現場を見ないことには、何とも言えない。"],s:"rule"},
{id:"G2-10",m:"～たところで",c:"G2",lv:2,q:"今さら＿＿、一度出た結果は変わらない。",o:["謝ったところで","謝ったからには","謝った以上","謝ったとたん"],
 e:"「～たところで」: '~해 봤자'. 뒤에 소용없다는 결과가 온다.",
 w:["からには는 앞을 근거로 뒤에 결의·의무를 말한다. '사과한 이상 결과는 변하지 않는다'는 근거와 판단으로 이어지지 않는다.","以上도 からには와 같다. 앞이 뒤의 근거가 되지 않는다.","とたん은 '~하자마자' 뒤에 실제로 일어난 변화가 온다. '변하지 않는다'와 맞지 않는다."],
 x:["今から急いだところで、もう間に合わない。","いくら説明したところで、分かってもらえないだろう。","一人で悩んだところで、何も解決しない。"],s:"rule"},
{id:"G2-11",m:"～に先立ち",c:"G2",lv:3,q:"新製品の発売に＿＿、販売店向けの説明会を開きます。",o:["先立ち","先走り","前立ち","先回り"],
 e:"「～に先立ち（先立って）」: '~에 앞서'. 격식 있는 안내문에 자주 쓴다.",
 w:["先走る는 '앞질러 경솔하게 행동하다'. 「～に先走り」로 쓰지 않는다.","前立ち는 이 뜻으로 쓰는 말이 아니다.","先回り는 '앞질러 가서 기다림'. 「発売に先回り」로 쓰지 않는다."],
 x:["開会に先立ち、主催者よりご挨拶申し上げます。","工事に先立って、近隣の方々に説明会を開いた。","契約に先立ち、条件をもう一度確認しておく。"],s:"rule"},

{id:"G3-01",m:"～ておく",c:"G3",lv:1,q:"会議が始まる前に、資料を人数分コピーして＿＿ください。（会議で使うので、前もって準備してほしい）",o:["おいて","あって","いて","くれて"],
 e:"「～ておく」: 앞으로를 위해 미리 해 두는 준비.",
 w:["「～てある」는 이미 된 결과 상태를 묘사한다. 의뢰문에는 쓰지 않는다.","「～ていて」는 그 상태·동작을 계속해 달라는 뜻이라 '미리 준비'가 되지 않는다.","くれる에는 「てください」가 붙지 않는다(명령은 「くれ」)."],
 x:["来客があるので、部屋を片付けておいてください。","明日までに目を通しておきます。","旅行の前に、ホテルを予約しておいた。"],s:"rule",k:"괄호 조건 추가: いて(계속)를 확실히 배제"},
{id:"G3-02",m:"～てある",c:"G3",lv:1,q:"受付の壁には、創業者の写真が＿＿。",o:["掛けてある","掛けておく","掛けている","掛かっておく"],
 e:"누군가 일부러 해 둔 결과 상태 = 타동사+てある. 「掛かっている」도 맞지만 보기에 없다.",
 w:["「～ておく」는 앞으로의 준비(의지)이고, 지금의 상태 묘사가 아니다.","「掛けている」는 누군가 거는 동작이 진행 중이라는 뜻. 사진이 주어가 될 수 없다.","자동사 掛かる에는 「ておく」가 붙지 않는다."],
 x:["机の上にメモが置いてある。","会議室の予約は、もう取ってあります。","窓が開けてあるので、少し寒い。"],s:"rule"},
{id:"G3-03",m:"まだ～ていない",c:"G3",lv:1,q:"A「昼ご飯、もう食べた？」 B「いや、まだ＿＿。」",o:["食べていない","食べなかった","食べない","食べていなかった"],
 e:"「まだ」+아직 끝나지 않은 상태는 「～ていない」. 한국어 '안 먹었어'를 직역해 食べなかった로 하기 쉽다.",
 w:["食べなかった는 과거의 사실(그때 먹지 않았다). 아직 끝나지 않은 상태가 아니다.","食べない는 의지·습관(먹지 않겠다/먹지 않는다).","食べていなかった는 과거 어느 시점의 상태. 지금 묻는 질문의 답이 되지 않는다."],
 x:["報告書は、まだ出していません。","部長は、まだ来ていません。","その映画は、まだ見ていない。"],s:"rule"},
{id:"G3-04",c:"G3",lv:2,q:"日本に＿＿とき、成田空港で財布をなくした。",o:["着いた","着く","着いている","着こう"],
 e:"도착한 뒤 일본 공항에서 생긴 일이므로 「着いたとき」.",
 w:["「着くとき」는 도착하기 전. 나리타 공항에서 생긴 일과 맞지 않는다.","순간 동작 着く에 「ている」를 붙이면 '도착해 있는 상태'가 되어, 도착했을 때의 일을 나타내지 못한다.","의지형(着こう)에는 「とき」가 붙지 않는다."],
 x:["家に帰ったとき、鍵がないことに気づいた。","会社に着いたとき、会議はもう始まっていた。","日本へ行くとき、出発前に空港で両替した。（대비: 가기 전）"],s:"rule"},
{id:"G3-05",m:"～てある",c:"G3",lv:2,q:"A「この件、部長に報告した方がいいですよね。」 B「ああ、それならもう＿＿よ。」",o:["伝えてあります","伝えておきます","伝えるところです","伝えようとします"],
 e:"「もう」+이미 처리해 둔 상태 → 「～てある」.",
 w:["「～ておきます」는 앞으로 할 일. もう와 맞지 않는다.","「～るところです」는 이제 막 하려는 참. もう와 맞지 않는다.","「～ようとします」는 '하려고 한다'. もう와 맞지 않는다."],
 x:["会場の手配は、もう済ませてあります。","その件は、課長に話してあります。","チケットは、もう買ってあるよ。"],s:"rule"},
{id:"G3-06",m:"～るところだ",c:"G3",lv:1,q:"今ちょうど出かける＿＿なので、帰ってからかけ直しますね。",o:["ところ","最中","まま","うち"],
 e:"「사전형+ところ」: 막 ~하려는 참.",
 w:["最中는 진행 중인 동작(会議の最中)에 쓴다. 出かける 같은 순간 동작에는 쓰지 않는다.","まま는 '~한 채(그대로)'. た형이나 명사에 붙는다.","うち는 '~하는 동안에'. 뒤에 다른 일이 이어져야 하고 「なので」로 맺지 않는다."],
 x:["ちょうど今、電話しようとしていたところです。","これから会議に出るところなので、後で連絡します。","今、家を出るところだ。"],s:"rule",k:"오답 교체: ばかり(「出かけるばかり」= 준비 다 됨, 문법상 성립)와 はず 제외"},
{id:"G3-07",m:"～たばかり",c:"G3",lv:2,q:"彼は先月入社した＿＿なので、まだ社内の事情に詳しくない。",o:["ばかり","ところ","最中","まま"],
 e:"「た형+ばかり」: 말하는 사람이 느끼기에 얼마 안 됨(한 달 전도 가능).",
 w:["「たところ」는 바로 직후. 한 달 전 일에는 보통 쓰지 않는다.","最中는 진행 중인 동작에 쓴다.","まま는 변화 없이 그대로인 상태. '들어온 지 얼마 안 됨'의 뜻이 아니다."],
 x:["日本に来たばかりで、まだ慣れていない。","買ったばかりのスマホを落としてしまった。","さっき食べたばかりなのに、もうお腹がすいた。"],s:"rule"},
{id:"G3-08",m:"～ている（経験）",c:"G3",lv:2,q:"この映画、実はもう三回も＿＿んです。",o:["見ている","見る","見ておく","見てある"],
 e:"경험·이력으로서의 「～ている」(횟수와 함께 쓴다). 「見た」도 맞지만 보기에 없다.",
 w:["見る는 앞으로의 일·습관.","「～ておく」는 앞으로를 위한 준비.","「～てある」는 사물의 결과 상태. 사람의 경험에는 쓰지 않는다."],
 x:["この会社は、過去に二度社名を変えている。","彼女は国際大会で三回優勝している。","私は以前にも、この店に来ている。"],s:"rule"},

{id:"G4-01",c:"G4",lv:1,q:"部長が私の企画書に目を通して＿＿。",o:["くださった","さしあげた","いただいた","くれてやった"],
 e:"주어가 部長이고 나를 위해 해 준 행위 → 「～てくださる」.",
 w:["さしあげる는 내가 윗사람에게 해 드리는 것. 주어 部長와 맞지 않는다.","いただく는 주어가 나일 때(「部長に…いただいた」). 「部長が」와 맞지 않는다.","くれてやる는 아랫사람에게 주는 거친 말."],
 x:["先生が推薦状を書いてくださった。","課長が駅まで送ってくださいました。","お客様が丁寧なお礼状をくださった。"],s:"rule"},
{id:"G4-02",c:"G4",lv:1,q:"（当社主催の展示会で）当社から、来場されたお客様に記念品を＿＿。",o:["差し上げた","くださった","いただいた","くれた"],
 e:"우리 쪽이 손님에게 주는 것은 「差し上げる」. 여러 사람에게 나눠 줄 때는 「お配りした」도 자연스럽다(보기에는 없음).",
 w:["くださる는 주는 쪽이 상대(손님)일 때.","「お客様に～いただいた」는 손님에게서 받았다는 뜻이 된다.","くれる는 주는 쪽이 상대일 때이고, 손님에게 쓰기에는 낮은 말이다."],
 x:["ご来店のお客様に、粗品を差し上げております。","先生にお礼の手紙を差し上げた。","参加者全員に資料をお配りしました。"],s:"rule",k:"장면은 주는 방향(우리 → 손님)을 정하는 조건"},
{id:"G4-03",c:"G4",lv:1,q:"この翻訳、一度先生に見て＿＿たいのですが。",o:["いただき","くださり","さしあげ","くれ"],
 e:"나의 희망(～たい)이므로 주어는 나 → 「先生に～ていただきたい」.",
 w:["くださる는 주어가 상대인 말이라 나의 희망(たい)과 이어지지 않는다.","さしあげたい는 내가 선생님께 해 드리고 싶다는 뜻이 된다.","くれる도 주어가 상대인 말이라 たい와 이어지지 않는다."],
 x:["この書類、一度確認していただきたいのですが。","ぜひ先生にご指導いただきたいと思っております。","少しお時間をいただきたいのですが。"],s:"rule"},
{id:"G4-04",c:"G4",lv:1,q:"先方の都合で、打ち合わせの時間が急に＿＿。",o:["変わった","変えた","変えさせた","変わらせた"],
 e:"주어가 時間(사물)이고 「時間が」로 되어 있으니 자동사 「変わる」.",
 w:["変える는 타동사라 「時間を変えた」가 되어야 한다.","사역(変えさせる)은 누군가에게 바꾸게 하는 것. 「時間が」와 맞지 않는다.","자동사 変わる의 사역은 이 문장에서 뜻이 성립하지 않는다."],
 x:["天気が急に変わった。","担当者が来月から変わります。","予定が変わったら、すぐ連絡してください。"],s:"rule"},
{id:"G4-05",c:"G4",lv:2,q:"申し訳ございません。私の不注意で、お借りしたカップを＿＿しまいました。",o:["割って","割れて","割らせて","割られて"],
 e:"내 부주의를 사과할 때는 책임을 드러내는 타동사 「割る」.",
 w:["割れる는 자동사라 「カップを」와 맞지 않는다. 「カップが割れて」로 써도 저절로 깨진 듯해 책임 회피로 들린다.","割らせる는 남에게 깨게 했다는 뜻.","割られる는 누군가에게 깨뜨림을 당했다는 뜻. 「私の不注意で」와 모순된다."],
 x:["不注意で、お借りした本を汚してしまいました。","私の確認不足で、日付を間違えてしまいました。","うっかり大事なファイルを消してしまった。"],s:"rule"},
{id:"G4-06",c:"G4",lv:1,q:"エアコンが＿＿いるので、窓を閉めてください。",o:["ついて","つけて","つけさせて","つかせて"],
 e:"「エアコンが」+지금의 상태 → 자동사 「つく」+ている.",
 w:["つける는 타동사라 「エアコンを」가 되어야 한다.","사역(つけさせる)은 「エアコンが」와 이어지지 않는다.","つく의 사역은 이 문장에서 뜻이 성립하지 않는다."],
 x:["部屋の電気がついている。","ドアが開いているので、閉めてください。","財布が落ちていますよ。"],s:"rule",k:"오답 교체: つけられて(수동 상태, 문법상 성립) 제외"},
{id:"G4-07",c:"G4",lv:2,q:"恩師に推薦状を書いて＿＿ことになった。",o:["いただく","くださる","さしあげる","くれる"],
 e:"「恩師に」는 해 주는 사람. 생략된 주어는 나 → 「～ていただく」.",
 w:["くださる라면 「恩師が書いてくださる」가 되어야 한다. 「恩師に」와 맞지 않는다.","さしあげる는 내가 은사에게 써 드린다는 뜻이 된다.","くれる도 「恩師が」가 되어야 하고, 은사에게 쓰기에는 낮은 말이다."],
 x:["先輩に仕事のコツを教えていただいた。","部長に資料を確認していただくことになった。","友人に引っ越しを手伝ってもらった。"],s:"rule"},
{id:"G4-08",c:"G4",lv:1,q:"大雨の影響で、電車が＿＿います。",o:["止まって","止めて","止めさせて","止まらせて"],
 e:"「電車が」+지금의 상태 → 자동사 「止まる」+ている.",
 w:["止める는 타동사라 「電車を」가 되어야 한다.","사역은 「電車が」와 이어지지 않는다.","자동사 止まる의 사역은 이 문장에서 뜻이 성립하지 않는다."],
 x:["事故の影響で、道路が混んでいます。","時計が止まっている。","エレベーターが点検で止まっています。"],s:"rule",k:"오답 교체: 止められて(수동 상태, 문법상 성립) 제외"},
{id:"G4-09",c:"G4",lv:2,q:"熱が下がらないので、子どもに解熱剤を＿＿。",o:["飲ませた","飲まれた","飲めた","飲まさせた"],
 e:"아이에게 약을 먹게 했다 → 사역 「飲ませる」.",
 w:["「子どもに飲まれた」는 아이가 (내가 곤란하게도) 마셔 버렸다는 피해 수동. 열을 내리려는 목적과 맞지 않는다.","飲める는 가능형. 「子どもに」와 이어지지 않는다.","飲まさせる는 さ入れ言葉로 표준이 아니다(5단 동사의 사역은 飲ませる)."],
 x:["毎朝、子どもに牛乳を飲ませている。","新人に電話を取らせた。","部下に報告書を書かせた。"],s:"rule"},
{id:"G4-10",c:"G4",lv:2,q:"自分の引っ越しなので、友人に手伝って＿＿つもりだったが、都合が悪いと断られてしまった。",o:["もらう","くれる","あげる","やる"],
 e:"내 이사를 친구가 도와주는 것 → 내가 받는 쪽 「友人に…てもらう」.",
 w:["くれる는 주어가 友人일 때(「友人が手伝ってくれる」). 「友人に」와 맞지 않는다.","あげる는 내가 친구를 도와준다는 뜻. 「自分の引っ越し」와 맞지 않는다.","やる도 내가 해 주는 쪽이라 맞지 않는다."],
 x:["同僚に資料のチェックをしてもらった。","駅まで友人に車で送ってもらった。","先輩にコツを教えてもらうつもりだ。"],s:"rule",k:"문장 고침: 원래 문장은 「手伝ってあげる」(내가 친구를 돕는다)도 성립해 정답이 둘이었음. 「自分の引っ越しなので」 추가"},

{id:"G5-01",m:"～そうだ（様態）",c:"G5",lv:1,q:"空が真っ暗になってきた。今にも雨が降り＿＿だ。",o:["そう","よう","らしい","みたい"],
 e:"「今にも～そうだ」: 곧 일어날 듯한 모습. 연용형(降り)에 붙는 것은 そう뿐.",
 w:["「降りよう」는 의지형이 된다. ようだ는 「降るようだ」처럼 기본형에 붙는다.","らしい는 「降るらしい」처럼 기본형에 붙는다.","みたい는 「降るみたい」처럼 기본형에 붙는다."],
 x:["このケーキ、おいしそうだね。","彼は今にも泣き出しそうな顔をしていた。","荷物が落ちそうですよ。"],s:"rule"},
{id:"G5-02",m:"～そうだ（伝聞）",c:"G5",lv:1,q:"天気予報によると、明日は大雪になる＿＿。",o:["そうだ","べきだ","ことだ","そうな"],
 e:"「～によると」+전해 들은 정보 → 기본형+そうだ(らしい・ようだ도 쓴다).",
 w:["べきだ는 당위('~해야 한다'). 날씨에는 맞지 않는다.","「～ことだ」는 충고('~하는 것이 좋다'). 날씨에는 맞지 않는다.","そうな는 명사를 꾸미는 형태라 문장을 끝맺을 수 없다."],
 x:["ニュースによると、来月から電気代が上がるそうだ。","田中さんの話では、部長は来週出張するそうです。","噂によると、あの店は閉店するらしい。"],s:"rule"},
{id:"G5-03",m:"～はずだ",c:"G5",lv:1,q:"田中さんは九時に家を出たと言っていたから、もう会社に着いている＿＿だ。",o:["はず","こと","まま","ほど"],
 e:"근거에서 끌어낸 논리적 확신 → 「はずだ」.",
 w:["「～ていることだ」는 이 자리에서 뜻이 성립하지 않는다.","「～ているままだ」는 '그대로인 상태'라 추측이 되지 않는다.","ほど는 정도를 나타내 추측이 되지 않는다."],
 x:["荷物は昨日送ったので、今日には届くはずだ。","鍵はかばんに入れたはずなのに、見つからない。","彼は経験者だから、この作業はできるはずです。"],s:"rule",k:"오답 교체: わけ(「着いているわけだ」= 결론, 문법상 성립) 제외"},
{id:"G5-04",m:"まるで～のようだ",c:"G5",lv:1,q:"この和菓子は、まるで本物の花の＿＿。",o:["ようだ","そうだ","らしい","はずだ"],
 e:"「まるで～のようだ」: 비유.",
 w:["そうだ는 「花の」 뒤에 붙지 않는다.","らしい는 「花の」 뒤에 붙지 않는다(「花らしい」는 '꽃다운').","はずだ는 추론이라 まるで(비유)와 호응하지 않는다."],
 x:["彼の話し方は、まるでアナウンサーのようだ。","まるで夢のような一日だった。","雪が積もって、まるで別の町のようだ。"],s:"rule"},
{id:"G5-05",m:"～なさそうだ",c:"G5",lv:2,q:"彼は最近、なんだか元気が＿＿。",o:["なさそうだ","なそうだ","なくそうだ","ないようそうだ"],
 e:"ない+そうだ(모습) → 「なさそうだ」. 특수한 활용.",
 w:["「なそうだ」는 없는 활용. ない에는 さ가 들어간다.","「なくそうだ」는 없는 활용.","「ようだ」와 「そうだ」를 겹쳐 쓰지 않는다."],
 x:["この問題は、それほど難しくなさそうだ。","今日は雨が降らなさそうだ。","彼女は時間がなさそうだった。"],s:"rule"},
{id:"G5-06",m:"～みたいだ・ようだ",c:"G5",lv:2,q:"（ドアの外から話し声が聞こえる）誰か来た＿＿。",o:["みたいだ","そうだ","ことだ","べきだ"],
 e:"소리(감각)로 얻은 정보로 추측 → 「みたいだ（ようだ）」. 「来たらしい」도 맞지만 보기에 없다.",
 w:["「た형+そうだ」는 전해 들은 말(전문)이 된다. 직접 들은 소리로 추측하는 뜻이 아니다.","「～ことだ」는 이 자리에서 뜻이 성립하지 않는다.","べきだ는 당위라 추측이 되지 않는다(활용도 「来るべきだ」)."],
 x:["隣の部屋で誰か話しているみたいだ。","この部屋、少し寒いみたいですね。","電気が消えている。もう帰ったようだ。"],s:"rule",k:"오답 교체: はず(「来たはずだ」, 문법상 성립) 제외"},
{id:"G5-07",m:"～らしい",c:"G5",lv:2,q:"最後まで責任を取って身を引くなんて、いかにも彼＿＿決断だ。",o:["らしい","らしく","らしさ","そうな"],
 e:"「명사+らしい」: 그 사람다운 전형성. 명사(決断)를 꾸미니 연체형 らしい.",
 w:["らしく는 연용형이라 명사를 꾸미지 못한다(「彼らしく決断した」처럼 동사 앞에 쓴다).","らしさ는 명사라 다른 명사를 바로 꾸미지 못한다.","そうな는 명사에 바로 붙지 않는다(「彼そうな」×)."],
 x:["いかにも彼らしい、丁寧な仕事ぶりだ。","今日は春らしい暖かい日だった。","子どもらしい素直な感想だ。"],s:"rule",k:"오답 교체: みたいな·ような(구어에서 성립할 여지) 제외, 활용형 대비로 바꿈"},
{id:"G5-08",m:"～ざるを得ない",c:"G5",lv:3,q:"予算と人員を考えると、この計画の実現は難しいと言わざるを＿＿。",o:["得ない","得る","ならない","しない"],
 e:"「～ざるを得ない」: '~하지 않을 수 없다'. 고정 형식.",
 w:["「得る」로 하면 '~하지 않을 수 있다'가 되어 고정 형식이 아니다.","「ざるをならない」라는 형식은 없다.","「ざるをしない」라는 형식은 없다."],
 x:["急な依頼だったが、断らざるを得なかった。","この結果では、計画を見直さざるを得ない。","体調が悪く、欠席せざるを得ません。"],s:"rule"},
{id:"G5-09",m:"～わけでもない",c:"G5",lv:2,q:"このくらいのミスで、すぐに会社が傾く＿＿でもない。",o:["わけ","はず","ところ","ばかり"],
 e:"「～わけでもない」: '꼭 ~인 것도 아니다'(부분 부정).",
 w:["「はずでもない」라는 형식은 쓰지 않는다.","「ところでもない」는 이 뜻으로 쓰지 않는다.","「ばかりでもない」는 '~만 하는 것도 아니다'라 뜻이 맞지 않는다."],
 x:["嫌いなわけでもないが、あまり食べない。","忙しいからといって、休めないわけでもない。","全部が悪いわけでもない。"],s:"rule",k:"오답 교체: もの(「傾くものでもない」, 문법상 성립) 제외"},
{id:"G5-10",m:"～わけにはいかない",c:"G5",lv:2,q:"一度約束した以上、今さら行かない＿＿にはいかない。",o:["わけ","はず","こと","もの"],
 e:"「～わけにはいかない」: 사회적·도의적으로 ~할 수 없다.",
 w:["「はずにはいかない」라는 형식은 없다.","「ことにはいかない」라는 형식은 없다.","「ものにはいかない」라는 형식은 없다."],
 x:["大事な会議なので、休むわけにはいかない。","お客様を待たせるわけにはいかない。","一人だけ先に帰るわけにはいかない。"],s:"rule"},
{id:"G5-11",m:"～たものだ",c:"G5",lv:2,q:"学生時代は、試験前によく徹夜した＿＿だ。",o:["もの","こと","ところ","まま"],
 e:"「た형+ものだ」: 과거의 습관을 그리워하며 회상.",
 w:["「た형+ことだ」는 이 뜻으로 쓰지 않는다.","「たところだ」는 '막 ~했다'. 学生時代·よく와 맞지 않는다.","「たままだ」는 '~한 채 그대로'. 회상이 되지 않는다."],
 x:["子どもの頃は、よく川で遊んだものだ。","若い頃は、よく夜遅くまで飲んだものです。","昔はこの道を毎日歩いて通ったものだ。"],s:"rule",k:"오답 교체: わけ·はず(문법상 성립할 여지) 제외"},
{id:"G5-12",m:"もし～としたら",c:"G5",lv:2,q:"もしその噂が本当だ＿＿、取引先に説明しなければならない。",o:["としたら","とはいえ","というより","どころか"],
 e:"「もし」는 가정 표현(としたら・なら・ば)과 호응한다. 가정 뒤에 그에 따른 대응.",
 w:["とはいえ는 사실을 인정하는 역접('~라고는 해도'). 「もし」와 호응하지 않는다.","というより는 비교('~라기보다'). 「もし」와 호응하지 않는다.","どころか는 '~는커녕'. 「もし」와 호응하지 않는다."],
 x:["もし明日雨だとしたら、イベントは延期します。","もし私があなただとしたら、断ると思う。","もしその話が事実なら、大問題だ。"],s:"rule",k:"오답 교체: としても(「本当だとしても」, 문법·뜻 모두 성립) 제외"},
{id:"G5-13",m:"～とのことだ",c:"G5",lv:3,q:"（上司への報告）先方は、条件次第では前向きに検討するとの＿＿でした。",o:["こと","もの","わけ","はず"],
 e:"전해 들은 말은 「～とのことです・でした」. 상대의 말을 전하는 보고의 정형.",
 w:["「とのものでした」라는 형식은 없다.","「とのわけでした」라는 형식은 없다.","「とのはずでした」라는 형식은 없다."],
 x:["部長は、少し遅れるとのことです。","先方から、資料は来週届くとのことでした。","担当者は不在とのことなので、改めて電話します。"],s:"rule"},
{id:"K1-01",c:"K1",lv:1,q:"（社内で同僚に）部長は明日、何時ごろ会社に＿＿か。",o:["いらっしゃいます","参ります","伺います","おります"],
 e:"윗사람(部長)의 동작 → 존경어 いらっしゃる.",
 w:["参る는 나·우리 쪽의 이동을 낮추는 말. 部長의 동작에 쓰지 않는다.","伺う는 내가 찾아가는 것을 낮추는 겸양어.","おる는 나·우리 쪽이 있는 것을 낮추는 말."],
 x:["社長は何時ごろお戻りになりますか。","先生は明日の会議にいらっしゃいますか。","部長はもうお帰りになりました。"],s:"keigo",k:"장면 추가: 사내(같은 회사 사람끼리)라 部長에게 존경어"},
{id:"K1-02",c:"K1",lv:1,q:"（お客様に）明日は私が駅までお迎えに＿＿。",o:["参ります","いらっしゃいます","お越しになります","来られます"],
 e:"나의 이동 → 겸양어(정중어) 参る.",
 w:["いらっしゃる는 상대의 동작을 높이는 존경어. 나에게 쓰지 않는다.","お越しになる는 상대의 방문을 높이는 존경어.","来られる는 존경(또는 가능·수동). 나에게 존경을 쓰지 않는다."],
 x:["明日、資料をお届けに参ります。","すぐにそちらへ参ります。","担当の者が参りますので、少々お待ちください。"],s:"keigo"},
{id:"K1-03",c:"K1",lv:1,q:"（社内で同僚に）先日の会議で、社長がそう＿＿。",o:["おっしゃいました","申しました","申し上げました","お言いになりました"],
 e:"사내에서 윗사람(社長)이 말함 → 존경어 おっしゃる.",
 w:["申す는 나·우리 쪽의 말을 낮추는 말. 사내에서 社長에게 쓰지 않는다(사외 사람에게 우리 사장의 말을 전할 때라면 申しておりました가 맞다).","申し上げる는 내가 윗사람에게 말씀드리는 것.","「お言いになる」는 쓰지 않는다. 言う의 존경어는 おっしゃる."],
 x:["部長が、明日は休みだとおっしゃっていました。","先生がおっしゃったとおりでした。","課長が何とおっしゃるか、聞いてみます。"],s:"keigo",k:"장면 추가: 사내/사외에 따라 정답이 바뀌는 문항이라 사내로 고정"},
{id:"K1-04",c:"K1",lv:1,q:"（お客様に）こちらの資料は、もう＿＿か。",o:["ご覧になりました","拝見しました","拝見なさいました","ご覧しました"],
 e:"상대가 보는 것 → 존경어 ご覧になる.",
 w:["拝見する는 내가 보는 것을 낮추는 겸양어.","겸양어 拝見에 존경 なさる를 붙인 섞인 형태. 상대에게 쓰지 않는다.","「ご覧する」라는 형태는 없다(존경은 ご覧になる)."],
 x:["こちらのカタログをご覧ください。","昨日のニュースをご覧になりましたか。","詳しくは資料をご覧いただけますか。"],s:"keigo"},
{id:"K1-05",c:"K1",lv:1,q:"先日お送りいただいた資料、さっそく＿＿。",o:["拝見しました","ご覧になりました","拝見なさいました","お見になりました"],
 e:"(받은 자료를) 내가 보는 것 → 겸양어 拝見する.",
 w:["ご覧になる는 상대가 보는 것을 높이는 존경어. 나에게 쓰지 않는다.","겸양어 拝見에 존경 なさる를 붙인 섞인 형태.","「お見になる」는 쓰지 않는다."],
 x:["お手紙、拝見いたしました。","メールを拝見し、内容を確認いたしました。","資料を拝見してから、改めてご連絡します。"],s:"keigo"},
{id:"K1-06",c:"K1",lv:1,q:"（お客様に）お飲み物は何を＿＿か。",o:["召し上がります","いただきます","お飲みします","頂戴します"],
 e:"상대가 먹고 마시는 것 → 존경어 召し上がる. 「お飲みになりますか」도 맞지만 보기에 없다.",
 w:["いただく는 내가 먹고 마시는 것을 낮추는 겸양어.","「お～する」는 겸양 형식이라 상대의 동작에 쓰지 않는다.","頂戴する는 내가 받는 것을 낮추는 겸양어."],
 x:["温かいうちに召し上がってください。","お昼は何を召し上がりましたか。","どうぞ、ご自由に召し上がってください。"],s:"keigo"},
{id:"K1-07",c:"K1",lv:2,q:"（重そうな荷物を持った取引先の方に）お荷物、お持ち＿＿。",o:["しましょうか","になりましょうか","なさいましょうか","いただきましょうか"],
 e:"상대를 위해 내가 하는 동작 → 겸양 「お～する」.",
 w:["「お持ちになる」는 상대가 드는 것을 높이는 존경 형식.","「お持ちなさる」도 상대의 동작에 쓰는 존경 형식.","「お持ちいただく」는 상대에게 들게 하는 것이라 뜻이 반대가 된다."],
 x:["駅までお送りしましょうか。","資料をお持ちしました。","後ほどお電話いたします。"],s:"keigo"},
{id:"K1-08",c:"K1",lv:2,q:"社長は、この件をすでに＿＿でしょうか。",o:["ご存じ","存じ上げて","存じて","お知り"],
 e:"윗사람이 알고 있다 → 존경어 「ご存じ」.",
 w:["存じ上げる는 내가 (사람을) 아는 것을 낮추는 겸양어.","存じる는 내가 아는 것을 낮추는 겸양어.","「お知りです」는 쓰지 않는다. 知る의 존경은 ご存じ."],
 x:["この件、部長はもうご存じですか。","ご存じのとおり、来月から料金が変わります。","田中さんの連絡先をご存じでしたら、教えていただけますか。"],s:"keigo"},
{id:"K1-09",c:"K1",lv:1,q:"（電話で）お世話になっております。ABC商事の山田と＿＿。",o:["申します","おっしゃいます","言われます","お申しします"],
 e:"자기 이름을 댈 때 → 겸양어(정중어) 申す.",
 w:["おっしゃる는 상대의 말을 높이는 존경어. 자기에게 쓰지 않는다.","言われる는 존경 또는 수동. 자기에게 존경을 쓰지 않는다.","「お申しする」라는 형태는 없다."],
 x:["初めまして、営業部の田中と申します。","私、総務を担当しております佐藤と申します。","受付の者に、山田と申しますとお伝えください。"],s:"keigo"},
{id:"K1-10",c:"K1",lv:2,q:"（社内で上司に）お客様が第一会議室で＿＿。",o:["お待ちになっています","お待ちしています","待っております","お待ちいたしています"],
 e:"손님이 기다리는 것 → 존경 「お待ちになる」. 실제로는 「お待ちです」라고도 많이 한다(보기에는 없음).",
 w:["「お待ちしています」는 겸양이라 '내가 기다리고 있다'가 된다.","「～ております」는 우리 쪽을 낮추는 말. 손님의 동작에 쓰지 않는다.","「お待ちいたす」도 겸양이라 내가 기다린다는 뜻이 된다."],
 x:["社長が応接室でお待ちになっています。","お客様がお見えになりました。","先生がお呼びになっています。"],s:"keigo"},
{id:"K1-11",c:"K1",lv:1,q:"明日の午後、御社に＿＿てもよろしいでしょうか。",o:["伺っ","いらっしゃっ","お越しになっ","参られ"],
 e:"내가 상대 회사를 방문한다 → 겸양어 伺う.",
 w:["いらっしゃる는 상대의 이동을 높이는 존경어. 내 방문에 쓰지 않는다.","お越しになる도 상대의 방문을 높이는 존경어.","「参られる」는 겸양어 参る에 존경 られる를 붙인 것. 주어가 나이므로 존경이 들어간 형태는 쓰지 않는다."],
 x:["明日の十時に、そちらへ伺います。","一度ご挨拶に伺いたいのですが。","資料を受け取りに伺ってもよろしいですか。"],s:"keigo"},
{id:"K1-12",c:"K1",lv:2,q:"部長、お手数ですが、この書類に目を＿＿いただけますか。",o:["通して","お通しして","拝見して","ご覧して"],
 e:"「目を通していただく」: 상대가 훑어보는 행위를 받는다.",
 w:["「お通しする」는 겸양 형식이라 내 동작이 된다.","拝見する는 내가 보는 것. 상대에게 부탁하는 문장과 맞지 않는다.","「ご覧する」라는 형태는 없다."],
 x:["お時間のあるときに、目を通していただけますか。","企画書に目を通していただき、ありがとうございました。","念のため、契約書に目を通しておいてください。"],s:"keigo"},
{id:"K1-13",c:"K1",lv:2,q:"（社外の方に）そのご伝言は、私から課長の鈴木に＿＿。",o:["申し伝えます","お伝えになります","おっしゃいます","お伝えくださいます"],
 e:"사외 사람에게, 우리 쪽 사람(자기 회사 상사)에게 전하는 행위 → 겸양어 「申し伝える」.",
 w:["「お伝えになる」는 상대의 동작을 높이는 존경 형식.","おっしゃる는 상대의 말을 높이는 존경어.","「お伝えくださる」는 상대가 전해 주는 것. 내가 전한다는 뜻이 아니다."],
 x:["戻りましたら、担当の者に申し伝えます。","その旨、部長に申し伝えておきます。","確かに申し伝えました。"],s:"keigo"},
{id:"K1-14",c:"K1",lv:2,q:"先日は、遠いところまでわざわざお越し＿＿、誠にありがとうございました。",o:["いただき","していただき","させていただき","いたし"],
 e:"「お越しいただく」: 상대의 방문을 받는다.",
 w:["「お越ししていただき」는 겸양 형식(お～する)이 섞인 형태.","「させていただく」는 내 동작에 쓴다. 상대의 방문이 아니다.","いたす는 내 동작을 낮추는 말. 상대의 방문에 쓰지 않는다."],
 x:["本日はお越しいただき、ありがとうございます。","ご来場いただき、誠にありがとうございました。","お忙しい中お集まりいただき、ありがとうございます。"],s:"keigo"},

{id:"K2-01",c:"K2",lv:1,q:"（取引先に）その件については、弊社の社長もそのように＿＿。",o:["申しておりました","おっしゃっていました","申されていました","おっしゃられていました"],
 e:"사외 사람 앞에서는 자기 회사 사장도 '우리 쪽'이므로 겸양어 申す.",
 w:["おっしゃる는 존경어. 사외 사람 앞에서 우리 쪽 사람에게 쓰지 않는다.","申される는 겸양어에 존경 れる를 붙인 섞인 형태. 우리 쪽 사람에게 존경을 넣지 않는다.","おっしゃられる는 존경이 두 번 겹친 이중 경어이고, 우리 쪽 사람에게 존경을 쓴 것이기도 하다."],
 x:["部長の田中も、よろしくと申しておりました。","社長が、ぜひ一度お会いしたいと申しております。","担当の者が、明日伺うと申しておりました。"],s:"keigo"},
{id:"K2-02",c:"K2",lv:2,q:"次のうち、二重敬語になっているものはどれか。",o:["おっしゃられる","おっしゃる","申し上げる","お話しになる"],
 e:"おっしゃる(존경)+られる(존경): 같은 종류의 경어가 두 번 겹친 이중 경어. 『敬語の指針』은 이중 경어를 적절하지 않은 것으로 본다(습관으로 정착한 일부 예외는 따로 둔다).",
 w:["おっしゃる는 言う의 존경어 한 번이라 바른 형태.","申し上げる는 겸양어 한 번이라 바른 형태.","「お話しになる」는 「お～になる」 한 번이라 바른 형태."],
 x:["社長がそうおっしゃいました。（○）","部長がお話しになりました。（○）","× 社長がおっしゃられました。"],s:"keigo"},
{id:"K2-03",c:"K2",lv:2,q:"次のうち、二重敬語になっているものはどれか。",o:["お見えになられる","お見えになる","いらっしゃる","お越しになる"],
 e:"「お見えになる」 자체가 존경어인데 られる를 더해 존경이 겹친 이중 경어.",
 w:["「お見えになる」는 습관으로 정착한 존경 표현으로 쓰인다.","いらっしゃる는 존경어 한 번이라 바른 형태.","「お越しになる」는 「お～になる」 한 번이라 바른 형태."],
 x:["お客様がお見えになりました。（○）","先生がいらっしゃいました。（○）","× 社長がお見えになられました。"],s:"keigo"},
{id:"K2-04",c:"K2",lv:1,q:"（上司に）昨日お送りした資料は、もう＿＿。",o:["ご覧になりましたか","ご覧になられましたか","拝見されましたか","拝見なさいましたか"],
 e:"「ご覧になる」만으로 충분한 존경.",
 w:["「ご覧になられる」는 존경이 겹친 이중 경어.","拝見은 겸양어라 상대에게 쓰지 않는다(존경 れる를 붙여도 마찬가지).","拝見(겸양)에 なさる(존경)를 붙인 섞인 형태."],
 x:["もうご覧になりましたか。","メールはご覧いただけましたでしょうか。","お時間のあるときにご覧ください。"],s:"keigo"},
{id:"K2-05",c:"K2",lv:2,q:"（来客への案内）ご不明な点は、受付で＿＿ください。",o:["お尋ね","伺って","お伺い","参って"],
 e:"상대(손님)의 동작 → 「お尋ねください」.",
 w:["伺う는 내가 묻거나 찾아가는 것을 낮추는 겸양어. 손님의 동작에 쓰지 않는다.","「お伺いください」는 겸양어 伺う를 손님의 동작에 쓴 형태.","参る는 나·우리 쪽의 이동을 낮추는 말."],
 x:["詳しくは係の者にお尋ねください。","ご質問は、こちらの窓口でお尋ねください。","分からないことがあれば、いつでもお尋ねください。"],s:"keigo"},
{id:"K2-06",c:"K2",lv:2,q:"（店内で、店員がお客様に）こちらで＿＿か。",o:["召し上がります","いただきます","お召し上がられます","頂戴されます"],
 e:"손님이 먹는 것 → 존경어 召し上がる. 「お召し上がりになる」는 이중 경어지만 습관으로 정착해 쓰인다(『敬語の指針』).",
 w:["いただく는 겸양어. 손님의 동작에 쓰지 않는다.","「お召し上がられる」는 召し上がる에 お와 られる를 더해 존경을 세 겹으로 쌓은 형태.","頂戴する는 겸양어. 존경 れる를 붙여도 손님의 동작에 쓸 수 없다."],
 x:["店内で召し上がりますか、お持ち帰りですか。","冷めないうちに召し上がってください。","どうぞ、お召し上がりください。"],s:"keigo"},
{id:"K2-08",c:"K2",lv:1,q:"（取引先との電話で）自社の田中部長のことを言うとき、適切なのはどれか。",o:["部長の田中は","田中部長は","田中部長様は","田中さんは"],
 e:"사외 사람에게는 자기 회사 사람에게 직함·さん을 붙이지 않고 「部長の田中」처럼 말한다(직함은 이름 앞에 직위로).",
 w:["「田中部長」는 직함이 경칭 역할을 한다. 사외 사람 앞에서 우리 쪽을 높이게 된다.","「様」까지 붙이면 우리 쪽을 더 높이게 된다.","「さん」도 경칭이라 사외 사람 앞에서는 붙이지 않는다."],
 x:["部長の田中は、ただいま外出しております。","課長の佐藤から折り返しご連絡いたします。","担当の鈴木が伺います。"],s:"keigo"},
{id:"K2-09",c:"K2",lv:1,q:"（お客様に）ただいま担当の者が＿＿ので、少々お待ちください。",o:["参ります","いらっしゃいます","来られます","お見えになります"],
 e:"우리 쪽 사람(담당자)의 이동 → 「参る」.",
 w:["いらっしゃる는 존경어. 손님 앞에서 우리 쪽 사람에게 쓰지 않는다.","来られる는 존경. 우리 쪽 사람에게 쓰지 않는다.","お見えになる는 존경. 우리 쪽 사람에게 쓰지 않는다."],
 x:["すぐに係の者が参ります。","後ほど担当者が参りますので、こちらでお待ちください。","私が参りますので、そのままお待ちください。"],s:"keigo"},
{id:"K2-10",c:"K2",lv:2,q:"取引先から「佐藤課長はいらっしゃいますか」と電話があった（佐藤は外出中）。適切な応答はどれか。",o:["申し訳ございません。課長の佐藤はただいま外出しております。","申し訳ございません。佐藤課長はただいま外出されています。","すみません、佐藤課長さんは今いらっしゃいません。","申し訳ございません。佐藤はただいまお出かけになっています。"],
 e:"사외 사람에게는 자기 회사 사람을 「課長の佐藤」, 동작은 「～ております」(겸양·정중).",
 w:["「佐藤課長」+존경 「外出されて」로 우리 쪽 사람을 높였다.","「課長さん」+존경 「いらっしゃいません」으로 우리 쪽 사람을 높였다.","이름 부르는 법은 맞지만, 동작에 존경 「お出かけになる」를 썼다."],
 x:["課長の佐藤は、本日休んでおります。","あいにく部長の田中は会議中でございます。","鈴木はただいま席を外しております。"],s:"keigo"},
{id:"K2-12",c:"K2",lv:1,q:"（来客に）どうぞ、こちらに＿＿ください。",o:["おかけになって","お座りして","おかけして","座られて"],
 e:"상대가 앉는 것 → 존경 「お～になる」.",
 w:["「お座りする」는 겸양 형식이라 상대에게 쓰지 않는다.","「おかけする」는 겸양 형식이라 상대에게 쓰지 않는다.","「座られてください」는 존경 れる에 てください를 붙인 어색한 형태."],
 x:["どうぞ、おかけになってお待ちください。","こちらでお待ちになってください。","ご自由にお取りください。"],s:"keigo"},

{id:"K3-01",m:"～かねる",c:"K3",lv:2,q:"誠に恐縮ですが、そのご要望には＿＿。",o:["お応えしかねます","お応えしかねません","お応えできかねません","お応えできないかねます"],
 e:"「～かねます」: '~하기 어렵다(사실상 못 한다)'의 정중한 거절. 「お応えできかねます」도 업무에서 많이 쓴다(보기에는 없음).",
 w:["「かねません」은 '~할지도 모른다'로 뜻이 반대가 된다.","「かねません」은 '~할지도 모른다'라 거절이 되지 않는다.","かねる는 동사의 ます형 어간에 붙는다. 「ない」 뒤에는 붙지 않는다."],
 x:["その件については、私からはお答えしかねます。","ご希望の日程では、お引き受けいたしかねます。","このままでは、事故が起こりかねません。（대비: かねない = ~할지도 모른다）"],s:"rule"},
{id:"K3-02",c:"K3",lv:1,q:"＿＿、お名前をもう一度お伺いしてもよろしいでしょうか。",o:["恐れ入りますが","おかげさまで","ご苦労様ですが","失礼いたしましたが"],
 e:"부탁 앞에 두는 쿠션어 「恐れ入りますが」.",
 w:["「おかげさまで」는 상대 덕분에 잘됐다고 감사를 전하는 말. 부탁 앞에 두지 않는다.","「ご苦労様」는 수고를 위로하는 말이고, 부탁 앞에 두지 않는다.","「失礼いたしました」는 지난 일에 대한 사과. 부탁의 앞머리가 되지 않는다."],
 x:["恐れ入りますが、少々お待ちいただけますか。","恐れ入りますが、こちらにご記入ください。","恐れ入りますが、もう一度おっしゃっていただけますか。"],s:"fixed"},
{id:"K3-03",c:"K3",lv:1,q:"お忙しいところ＿＿、ご確認いただけますと幸いです。",o:["恐縮ですが","おかげさまで","ご無沙汰しておりますが","お疲れ様ですが"],
 e:"「お忙しいところ恐縮ですが」: 의뢰할 때 쓰는 정형 쿠션어.",
 w:["「おかげさまで」는 감사 표현이라 의뢰 앞에 두지 않는다.","「ご無沙汰しております」는 오랜만에 연락할 때의 인사. 「お忙しいところ」와 이어지지 않는다.","「お疲れ様」는 수고를 위로하는 인사. 「お忙しいところ」와 이어지지 않는다."],
 x:["お忙しいところ恐縮ですが、ご返信をお願いいたします。","お手数ですが、ご確認のほどよろしくお願いいたします。","ご多忙のところ恐れ入りますが、ご出席いただけますと幸いです。"],s:"fixed"},
{id:"K3-04",c:"K3",lv:2,q:"納期の件ですが、＿＿部品の入荷が遅れており、来週末になる見込みです。",o:["あいにく","せっかく","わざわざ","さすがに"],
 e:"「あいにく」: 상대의 기대·형편에 맞지 않는 사정을 전할 때.",
 w:["「せっかく」는 '모처럼(애써)'. 뒤에 아쉬움이 오는 말이지만, 사정을 알리는 앞머리로는 쓰지 않는다.","「わざわざ」는 '일부러'. 부품 입하가 늦는 사정에 맞지 않는다.","「さすがに」는 '역시·아무리 그래도'. 사정을 알리는 말이 아니다."],
 x:["あいにく、その日は予定が入っております。","あいにく担当者が席を外しております。","あいにくの雨でしたが、多くの方にお越しいただきました。"],s:"dict"},
{id:"K3-06",c:"K3",lv:1,q:"＿＿、本日中にご返信いただけますでしょうか。",o:["差し支えなければ","差し支えあれば","差し控えなければ","差し上げなければ"],
 e:"「差し支えなければ」: '괜찮으시다면(지장이 없다면)'. 부탁 앞의 쿠션어.",
 w:["「差し支えあれば」는 '지장이 있다면'이라 부탁의 조건으로 맞지 않는다.","差し控える는 '삼가다'. 뜻이 맞지 않는다.","差し上げる는 '드리다'. 뜻이 맞지 않는다."],
 x:["差し支えなければ、ご連絡先を教えていただけますか。","差し支えなければ、理由をお聞かせください。","差し支えなければ、明日お電話してもよろしいでしょうか。"],s:"dict"},
{id:"K3-07",m:"～させていただく",c:"K3",lv:2,q:"誠に残念ですが、今回は参加を＿＿いただきます。",o:["見送らせて","見送って","見送られて","見送りして"],
 e:"우리 쪽 결정을 정중히 알릴 때 → 「～させていただく」.",
 w:["「見送っていただきます」는 상대가 보류해 달라는 뜻이 된다.","見送られる는 수동·존경. 「いただきます」와 이어지지 않는다.","「見送りしていただく」는 형태가 맞지 않는다."],
 x:["今回は辞退させていただきます。","本日は、これで失礼させていただきます。","詳細は、後日改めてご連絡させていただきます。"],s:"rule"},
{id:"K3-08",c:"K3",lv:1,q:"慎重に検討いたしましたが、＿＿ながら、今回はご期待に沿えない結果となりました。",o:["残念","幸い","当然","偶然"],
 e:"「残念ながら」: 거절·불합격 통지의 정형.",
 w:["「幸いながら」라는 말은 쓰지 않는다. 幸い는 좋은 일에 쓴다.","「当然ながら」는 '당연하지만'이라 거절 통지와 맞지 않는다.","「偶然ながら」는 이 자리에 쓰지 않는다."],
 x:["残念ながら、今回は採用を見送ることとなりました。","残念ながら、その商品は品切れとなっております。","残念ながら、当日は出席できません。"],s:"fixed"},
{id:"K3-09",c:"K3",lv:1,q:"ご連絡が遅くなり、＿＿。",o:["大変失礼いたしました","お世話になりました","お疲れ様でした","ありがとうございました"],
 e:"연락이 늦은 것에 대한 사과의 정형. 「申し訳ございません」도 맞지만 보기에 없다.",
 w:["「お世話になりました」는 도움에 대한 감사. 늦은 것의 사과가 아니다.","「お疲れ様でした」는 수고를 위로하는 인사. 사과가 아니다.","늦은 것에 감사하는 것은 앞뒤가 맞지 않는다."],
 x:["ご返信が遅くなり、大変失礼いたしました。","ご連絡が遅くなり、申し訳ございません。","お待たせしてしまい、失礼いたしました。"],s:"fixed",k:"오답 교체: 恐れ入りました(「恐れ入る」에 사과의 뜻도 있어 성립 여지) 제외"},
{id:"K3-11",m:"～かねる",c:"K3",lv:2,q:"その件につきましては、私の一存では＿＿。",o:["決めかねます","決めかねません","決まりかねます","決めかねるです"],
 e:"「一存では決めかねます」: 권한 밖임을 정중히 밝히는 정형.",
 w:["「かねません」은 '~할지도 모른다'로 뜻이 반대가 된다.","かねる는 의지로 하는 동작(決める)에 붙는다. 자동사 決まる에는 붙지 않는다.","「かねるです」는 활용이 맞지 않는다(「かねます」)."],
 x:["その件は、私の一存ではお答えしかねます。","すぐには判断しかねますので、上の者に確認いたします。","ご要望には、お応えしかねる場合がございます。"],s:"rule"},
{id:"K3-13",c:"K3",lv:3,q:"（来社した取引先に）先日は遠いところ、ご＿＿いただき、ありがとうございました。",o:["足労","苦労","面倒","迷惑"],
 e:"「ご足労いただく」: 일부러 와 주시다. 방문에 대한 감사의 정형.",
 w:["「ご苦労いただく」는 쓰지 않는다. 「ご苦労」는 '와 주심'의 뜻이 아니다.","「ご面倒」는 '번거로움'이라 방문의 뜻이 아니다.","「ご迷惑」는 '폐'라 방문에 감사하는 말이 되지 않는다."],
 x:["本日はご足労いただき、誠にありがとうございます。","わざわざご足労いただき、恐縮です。","ご足労をおかけしますが、よろしくお願いいたします。"],s:"fixed"},
{id:"K3-14",c:"K3",lv:3,q:"（会議で目上の人の前で意見を言うとき）＿＿ながら、一言申し上げます。",o:["僭越","僭称","越権","越境"],
 e:"「僭越ながら」: '주제넘지만'. 윗사람 앞에서 의견·인사를 할 때의 정형 쿠션어.",
 w:["僭称은 '분에 넘치는 칭호를 멋대로 씀'. 「～ながら」로 쓰지 않는다.","越権은 '권한을 넘음'. 「～ながら」로 쓰지 않는다.","越境은 '국경을 넘음'. 뜻이 맞지 않는다."],
 x:["僭越ながら、乾杯の音頭を取らせていただきます。","僭越ながら、私の考えを述べさせていただきます。","僭越ではございますが、一言ご挨拶申し上げます。"],s:"fixed"},
{id:"V1-03",c:"V1",lv:1,q:"今回のプロジェクトの成否の＿＿を握っているのは、物流部門だ。",o:["鍵","頭","手","首"],
 e:"「鍵を握る」: 결정적인 열쇠를 쥐다(관용구).",
 w:["「頭を握る」라는 관용구는 없다.","「手を握る」는 '손을 잡다·손잡다'. 성패의 열쇠라는 뜻이 아니다.","「首を握る」라는 관용구는 없다."],
 x:["事件の鍵を握る人物が見つかった。","この交渉の鍵を握るのは価格だ。","若手の育成が、会社の将来の鍵を握っている。"],s:"idiom"},
{id:"V1-04",c:"V1",lv:2,q:"（取引先との打ち合わせで）大変申し訳ありませんが、この件は一旦＿＿に持ち帰って検討させてください。",o:["社","家","内","手"],
 e:"「社に持ち帰って検討する」: 그 자리에서 답하지 않고 회사로 돌아가 논의하겠다는 비즈니스 정형.",
 w:["거래처와의 업무 자리이므로 집이 아니라 회사로 가져간다(개인 고객이라면 「家に持ち帰って」도 자연스럽다).","「内に持ち帰る」라고는 하지 않는다.","「手に持ち帰る」라고는 하지 않는다."],
 x:["ご提案は一度社に持ち帰り、検討いたします。","その件は持ち帰って、改めてご回答いたします。","社内で検討のうえ、明日ご連絡します。"],s:"fixed",k:"장면(거래처)은 家를 배제하는 조건"},
{id:"V1-06",c:"V1",lv:1,q:"彼は人が話している途中で、すぐに＿＿を挟む。",o:["口","手","目","耳"],
 e:"「口を挟む」: 남의 말 도중에 끼어들다.",
 w:["「手を挟む」는 '손이 끼다'라는 글자 그대로의 뜻.","「目を挟む」라는 관용구는 없다.","「耳に挟む」(우연히 듣다)는 조사가 に이고 뜻도 다르다."],
 x:["人の話に口を挟まないでください。","会議中、彼は何度も口を挟んだ。","部外者が口を挟むことではない。"],s:"idiom"},
{id:"V1-07",c:"V1",lv:2,q:"価格面で折り合わず、交渉は＿＿に乗り上げた。",o:["暗礁","岩礁","座礁","浅瀬"],
 e:"「暗礁に乗り上げる」: 일이 막혀 진행되지 않다(관용구).",
 w:["「岩礁に乗り上げる」는 글자 그대로 배가 바위에 얹히는 뜻. 관용구가 아니다.","座礁는 그 자체가 '배가 얹힘'이라 「座礁に乗り上げる」는 겹친 말.","「浅瀬に乗り上げる」는 글자 그대로의 뜻. 관용구가 아니다."],
 x:["計画は資金不足で暗礁に乗り上げた。","話し合いは暗礁に乗り上げたままだ。","交渉が暗礁に乗り上げ、合意は先送りになった。"],s:"idiom"},
{id:"V1-08",c:"V1",lv:1,q:"送料は当社が＿＿いたします。",o:["負担","担保","負荷","担任"],
 e:"비용을 맡아 내는 것은 「負担する」.",
 w:["担保는 빚의 담보. 비용을 내는 뜻이 아니다.","負荷는 기계·몸에 걸리는 부하.","担任은 학급·과목을 맡는 것."],
 x:["交通費は会社が負担します。","費用の一部をご負担いただきます。","振込手数料はお客様のご負担となります。"],s:"dict",k:"오답 교체: 担当(쓰일 여지) 제외"},
{id:"V1-10",c:"V1",lv:1,q:"日程は、先方のご都合に＿＿ます。",o:["合わせ","慣れ","会わせ","揃い"],
 e:"「都合に合わせる」: 상대 사정에 맞추다(타동사).",
 w:["慣れる는 '익숙해지다'. 상대 사정에 맞춘다는 뜻이 아니다.","会わせる는 '사람을 만나게 하다'. 표기가 다르다.","揃う는 '갖추어지다'. 뜻이 맞지 않는다."],
 x:["時間は皆さんの予定に合わせます。","お客様のご希望に合わせて調整いたします。","サイズを体に合わせて直してもらった。"],s:"dict",k:"오답 교체: 合い(「都合に合う」로 문장이 성립) 제외"},
{id:"V1-11",c:"V1",lv:2,q:"新規事業がようやく＿＿に乗ってきた。",o:["軌道","線路","路線","道路"],
 e:"「軌道に乗る」: 일이 순조롭게 굴러가기 시작하다(관용구).",
 w:["「線路に乗る」는 관용구가 아니다.","路線은 '노선·방침'. 「路線に乗る」로 이 뜻을 나타내지 않는다.","「道路に乗る」라는 관용구는 없다."],
 x:["店の経営がやっと軌道に乗った。","新しい仕組みが軌道に乗るまで、半年かかった。","事業を軌道に乗せるのが、今年の目標だ。"],s:"idiom"},
{id:"V1-12",c:"V1",lv:2,q:"大事な契約なので、念には念を＿＿て確認しよう。",o:["入れ","押し","置い","込め"],
 e:"「念には念を入れる」: 조심에 조심을 더하다(관용구).",
 w:["「念を押す」는 '다짐하다'로 따로 쓰는 관용구. 「念には念を押す」는 아니다.","「念を置く」라는 말은 없다.","「念を込める」는 '마음을 담다'. 이 관용구가 아니다."],
 x:["念には念を入れて、もう一度確認した。","重要な書類なので、念には念を入れてチェックしてください。","明日の集合時間について、念を押しておいた。（대비: 念を押す）"],s:"idiom",k:"오답 교체: 重ね(「念には念を重ねる」 사용 예가 있을 수 있음) 제외"},
{id:"V1-13",c:"V1",lv:1,q:"お手数を＿＿しますが、ご確認のほどよろしくお願いいたします。",o:["おかけ","おさせ","おつけ","おかし"],
 e:"「お手数をおかけしますが」: 의뢰의 정형.",
 w:["「お手数をおさせする」는 없는 형태.","「手数をつける」라고는 하지 않는다.","「おかし」는 활용이 맞지 않는다."],
 x:["お手数をおかけして申し訳ございません。","ご迷惑をおかけしました。","ご心配をおかけしましたが、無事に終わりました。"],s:"fixed"},
{id:"V1-14",c:"V1",lv:2,q:"ご指摘いただいた点は、肝に＿＿ます。",o:["銘じ","命じ","免じ","念じ"],
 e:"「肝に銘じる」: 마음에 깊이 새겨 잊지 않다. 銘(새길 명).",
 w:["「命じる」는 '명령하다'. 「肝に命じる」는 같은 읽기에서 오는 흔한 표기 실수.","免じる는 '면제하다'.","念じる는 '기원하다'."],
 x:["先輩の言葉を肝に銘じて、仕事に取り組みます。","今回の失敗を肝に銘じます。","安全第一を肝に銘じておくこと。"],s:"idiom",k:"오답 교체: 刻み(「肝に刻む」 사용 예가 있을 수 있음) 제외"},
{id:"V1-15",c:"V1",lv:3,q:"（価格交渉で）見積もりの金額について、もう少し＿＿していただけないでしょうか。",o:["勉強","学習","研究","練習"],
 e:"상거래에서 「勉強する」는 '값을 깎아 주다'. 「もう少し勉強していただけませんか」는 할인을 부탁하는 정형 표현.",
 w:["学習에는 '값을 깎다'는 뜻이 없다.","研究에는 '값을 깎다'는 뜻이 없다.","練習에는 '값을 깎다'는 뜻이 없다."],
 x:["まとめて買うので、少し勉強してもらえませんか。","今回は特別に勉強させていただきます。","もう一声、勉強していただけると助かります。"],s:"dict"},
{id:"V1-16",c:"V1",lv:3,q:"その案は一度＿＿に戻して、別の方法を考えましょう。",o:["白紙","空白","原紙","無地"],
 e:"「白紙に戻す」: 없던 일로 하고 처음부터 다시 하다(관용구).",
 w:["「空白に戻す」라는 관용구는 없다.","原紙는 복사의 원본 종이. 관용구가 아니다.","無地는 '무늬 없음'. 관용구가 아니다."],
 x:["契約の話は白紙に戻った。","計画を白紙に戻して、一から考え直す。","合意は白紙撤回された。"],s:"idiom"},
{id:"V1-17",c:"V1",lv:3,q:"この件は営業部と＿＿をそろえてから進めます。",o:["足並み","足取り","足元","足跡"],
 e:"「足並みをそろえる」: 보조를 맞추다.",
 w:["足取り는 '걸음걸이·행적'. 「そろえる」와 함께 쓰지 않는다.","足元는 '발밑'. 「足元をそろえる」는 관용구가 아니다.","足跡는 '발자국·업적'. 뜻이 맞지 않는다."],
 x:["各部署が足並みをそろえて取り組む。","メンバーの足並みが乱れている。","関係機関と足並みをそろえて対応します。"],s:"idiom"},
{id:"V1-18",c:"V1",lv:3,q:"予算の都合で、その企画は＿＿になった。",o:["お蔵入り","蔵出し","箱入り","物入り"],
 e:"「お蔵入り」: 발표·실행되지 못하고 묻힘.",
 w:["蔵出し는 '창고에서 꺼냄(갓 출하)'. 뜻이 반대다.","箱入り는 '상자에 든 것·귀하게 키움'(箱入り娘).","物入り는 '돈이 많이 듦'."],
 x:["撮影した映像は、結局お蔵入りになった。","その新商品は発売直前にお蔵入りした。","お蔵入りしていた企画が、十年ぶりに実現した。"],s:"idiom"},
{id:"V1-19",c:"V1",lv:3,q:"お世話になっております。先日ご依頼の件、＿＿ご報告いたします。",o:["取り急ぎ","急ぎ足で","早急で","速攻で"],
 e:"「取り急ぎ」: 우선 급한 대로. 메일에서 먼저 결과만 알릴 때의 정형. 윗사람에게 남용하면 실례로 보는 사람도 있다.",
 w:["「急ぎ足で」는 '빠른 걸음으로'. 보고문에 쓰지 않는다.","早急는 「早急に」로 쓴다. 「早急で」는 형태가 맞지 않는다.","「速攻で」는 속어. 업무 메일에는 쓰지 않는다."],
 x:["取り急ぎ、ご報告まで。","取り急ぎ、資料のみお送りいたします。","詳細は追ってご連絡しますが、取り急ぎ結果をお知らせします。"],s:"fixed"},

{id:"V2-01",c:"V2",lv:1,q:"電話が鳴っているよ。早く＿＿。",o:["出て","もらって","返して","受け取って"],
 e:"'전화를 받다'는 「電話に出る」. 한국어 '받다'를 직역하기 쉽다. (전화 응대 문맥의 「電話を受ける」는 맞는 말이지만, 울리는 전화를 받으라고 할 때는 「出て」)",
 w:["もらう는 물건을 받는 것. 전화에는 쓰지 않는다.","返す는 '돌려주다'. 걸려 온 전화에 되걸 때는 「折り返す」.","受け取る는 물건·돈을 받아 드는 것. 전화에는 쓰지 않는다."],
 x:["すみません、今電話に出られません。","三回鳴ったら、電話に出てください。","さっき電話に出たのは誰ですか。"],s:"dict",k:"오답 교체: 受けて(「電話を受ける」는 맞는 말) 제외"},
{id:"V2-02",c:"V2",lv:1,q:"食後にこの薬を＿＿ください。",o:["飲んで","食べて","取って","吸って"],
 e:"약은 「飲む」. 한국어 '먹다' 간섭.",
 w:["食べる는 씹어 먹는 음식에 쓴다. 약에는 쓰지 않는다.","「取って」는 '집어 와'라는 뜻이 되어 복용이 되지 않는다.","吸う는 들이마시는 것. 먹는 약에는 쓰지 않는다."],
 x:["一日三回、この薬を飲んでください。","風邪薬を飲んで、早めに寝た。","薬を飲み忘れないようにしてください。"],s:"dict",k:"오답 교체: 摂って(쓰이는 예가 있을 수 있음) 제외"},
{id:"V2-03",c:"V2",lv:2,q:"使う人が迷わないよう、画面のデザインを＿＿した。",o:["工夫","努力","苦労","心配"],
 e:"「工夫する」: 좋은 방법을 궁리해 고안하다(타동사로 「～を工夫する」). 한국어 '공부'와 뜻이 다르다.",
 w:["努力는 「～を努力する」로 쓰지 않는다(「努力して～する」).","苦労는 「～を苦労する」로 쓰지 않는다.","心配는 '걱정'. 디자인을 걱정했다는 뜻이 되어 맞지 않는다."],
 x:["説明の順番を工夫したら、分かりやすくなった。","狭い部屋を広く使えるよう、家具の配置を工夫した。","もう少し工夫すれば、もっと良くなると思う。"],s:"dict",k:"오답 교체: 勉強·研究(「デザインを研究した」는 성립) 제외"},
{id:"V2-04",c:"V2",lv:2,q:"今度の週末、私の＿＿を両親に紹介するつもりです。",o:["恋人","愛人","情人","恋愛人"],
 e:"한국어 '애인'은 일본어 「恋人」. 일본어 「愛人」은 '불륜 상대'라는 뜻이 강하다.",
 w:["愛人은 일본어에서 주로 '불륜 상대'. 부모에게 소개하는 상대가 아니다.","情人은 예스러운 말로 '정을 통한 상대'. 이 자리에 쓰지 않는다.","「恋愛人」이라는 말은 없다."],
 x:["彼女には恋人がいるらしい。","恋人と旅行に行った。","大学時代の恋人と結婚した。"],s:"dict"},
{id:"V2-05",c:"V2",lv:1,q:"申し訳ありません。その日はすでに＿＿がありまして…。",o:["先約","前約","先約束","前約束"],
 e:"'선약'은 「先約」.",
 w:["「前約」이라는 말은 쓰지 않는다.","「先約束」이라는 말은 없다(「前から約束がある」처럼 풀어 쓴다).","「前約束」이라는 말은 없다."],
 x:["あいにく先約がありまして、伺えません。","その日は先約があるので、別の日にしてもらえますか。","先約を優先させていただきます。"],s:"dict"},
{id:"V2-06",c:"V2",lv:1,q:"将来は医者＿＿なりたい。",o:["に","が","を","で"],
 e:"'~가 되다'는 「～になる」. 한국어 '가' 간섭.",
 w:["「医者がなる」는 의사가 무언가가 된다는 뜻이 된다.","なる는 を를 취하지 않는다.","「医者でなる」는 쓰지 않는다."],
 x:["春になると、桜が咲く。","来月から課長になります。","先生になるのが夢です。"],s:"rule"},
{id:"V2-07",c:"V2",lv:1,q:"私は辛い物＿＿苦手です。",o:["が","を","に","で"],
 e:"好き・嫌い・苦手・得意의 대상은 が. 한국어 '을/를' 간섭.",
 w:["苦手의 대상은 を로 나타내지 않는다.","「辛い物に苦手」는 쓰지 않는다.","で는 대상을 나타내지 않는다."],
 x:["私は数学が苦手です。","彼は料理が得意だ。","コーヒーが好きです。"],s:"rule"},
{id:"V2-08",c:"V2",lv:2,q:"彼は誰にでもいい顔をする、いわゆる＿＿だ。",o:["八方美人","多才な人","万能選手","物知り"],
 e:"일본어 「八方美人」은 '누구에게나 잘 보이려는 사람'(부정적). 한국어 '팔방미인(다재다능)'과 느낌이 반대.",
 w:["多才な人은 재주가 많은 사람. 「誰にでもいい顔をする」와 이어지지 않는다(한국어 '팔방미인'의 뜻).","万能選手는 무엇이든 잘하는 사람. 역시 한국어 '팔방미인' 쪽 뜻이다.","物知り는 아는 것이 많은 사람."],
 x:["八方美人だと思われたくない。","彼女は八方美人で、本音が分からない。","誰にでも合わせていると、八方美人と言われる。"],s:"dict",k:"오답 교체: 器用な人(처세에 능하다는 뜻으로 성립 여지) 제외"},
{id:"V2-09",c:"V2",lv:1,q:"明日の会議には、私も＿＿します。",o:["出席","臨席","着席","出場"],
 e:"'참석하다'는 「出席する」. (한국어 '참석'을 그대로 옮기기 쉽다)",
 w:["臨席는 귀빈·윗사람이 그 자리에 나오는 것(「ご臨席」). 자기에게 쓰지 않는다.","着席는 자리에 앉는 것. 회의에 참석한다는 뜻이 아니다.","出場는 대회·경기에 나가는 것."],
 x:["来週の会議に出席します。","会議に出席できない場合は、ご連絡ください。","全員出席のもと、会議が始まった。"],s:"dict",k:"오답 교체: 参席(일본어 사전에도 실린 말) 제외"},
{id:"V2-11",c:"V2",lv:1,q:"明日、取引先の部長＿＿会うことになっている。",o:["に","を","が","へ"],
 e:"'~를 만나다'는 「～に会う」. 「～と会う」(서로 만나다)도 맞지만 보기에 없다.",
 w:["会う는 を를 취하지 않는다(한국어 '를' 간섭).","「部長が会う」는 부장이 누군가를 만난다는 뜻이 된다.","「部長へ会う」는 쓰지 않는다."],
 x:["駅で偶然、先生に会った。","明日、友人と会う約束がある。","初めてお客様に会うので緊張する。"],s:"rule"},
{id:"V2-12",c:"V2",lv:1,q:"毎朝七時のバス＿＿乗って通勤しています。",o:["に","を","で","が"],
 e:"'~를 타다'는 「～に乗る」.",
 w:["乗る는 を를 취하지 않는다(한국어 '를' 간섭).","「バスで通勤する」는 맞지만 「バスで乗る」는 쓰지 않는다.","「バスが乗る」는 버스가 탄다는 뜻이 된다."],
 x:["駅からタクシーに乗った。","電車に乗り遅れた。","初めて飛行機に乗ったのは十歳のときだ。"],s:"rule"},
{id:"V2-15",c:"V2",lv:1,q:"来週から休暇に入るので、担当業務の＿＿を済ませておいた。",o:["引き継ぎ","引き受け","引き取り","引き上げ"],
 e:"'인수인계'는 「引き継ぎ」. ★훈독(ひきつぎ). 교대 근무의 전달 사항은 「申し送り（もうしおくり）」도 쓴다.",
 w:["引き受け는 '일을 떠맡음'. 넘겨주고 휴가에 들어가는 뜻이 아니다.","引き取り는 '물건·사람을 거두어 감'.","引き上げ는 '끌어올림·철수'."],

function dbStore(db){
  const col=db.collection("qb");
  return {kind:"db",
    async load(){ const snap=await col.get(), raw={}, out={}; snap.docs.forEach(d=>{raw[d.id]=d.data()});
      Object.entries(raw).forEach(([id,b])=>{ if(id.includes("~")) return; let s=b.v||""; for(let i=1;i<(b.n||1);i++){const p=raw[id+"~"+i]; s+=p?p.v:""} out[id]={s,n:b.n||1} });
      return out },
    async write(id,s,prevN){ const P=chunks(s); await col.doc(id).set({v:P[0],n:P.length,at:Date.now()}); for(let i=1;i<P.length;i++) await col.doc(id+"~"+i).set({v:P[i]}); for(let i=P.length;i<prevN;i++) await col.doc(id+"~"+i).delete(); return P.length },
    async remove(id,prevN){ await col.doc(id).delete(); for(let i=1;i<prevN;i++) await col.doc(id+"~"+i).delete() },
    async flush(){}
  };
}
/* 구글 시트 저장. records 탭: key | kind | v | json | updatedAt | device. 시트가 입력값을 수식·숫자로 바꾸지 않도록 json 칸 앞에 ~ 를 붙인다 */
const KIND=id=>({items:"item",sessions:"session",notes:"notes",drill:"drillrec",reads:"reads",misc:"conf",src:"drillsrc"})[id]||(id.startsWith("d_")?"draft":"etc");
function sheetStore(t,dev){
  let rowOf={}, end=2, buf=new Map();
  const un=c=>{c=String(c??""); return c.startsWith("~")?c.slice(1):c};
  const index=V=>{V.forEach((r,i)=>{ if(i&&r&&r[0]) rowOf[String(r[0])]=i+1 }); end=Math.max(end,V.length+1)};
  const blank=k=>{const row=rowOf[k]; if(row){buf.set(row,["","","","","",""]); delete rowOf[k]}};
  return {kind:"sheet",dev,
    async load(){ const V=await t.get("records!A1:F"); rowOf={}; end=2; index(V); const raw={};
      V.forEach((r,i)=>{ if(i&&r&&r[0]) raw[String(r[0])]=r });
      const out={}; Object.keys(raw).forEach(k=>{ if(k.includes("~")) return; let s=un(raw[k][3]), n=1; while(raw[k+"~"+n]){ s+=un(raw[k+"~"+n][3]); n++ } out[k]={s,n} });
      return out },
    async write(id,s,prevN){
      const P=chunks(s), keys=P.map((_,i)=>i?id+"~"+i:id);
      if(keys.some(k=>!rowOf[k])) index(await t.get("records!A1:A"));
      const at=stamp();
      P.forEach((p,i)=>{ const k=keys[i]; let row=rowOf[k]; if(!row){row=end++; rowOf[k]=row} buf.set(row,[k,KIND(id),"~1","~"+p,at,dev]) });
      for(let i=P.length;i<prevN;i++) blank(id+"~"+i);
      return P.length },
    async remove(id,prevN){ for(let i=0;i<Math.max(prevN,1);i++) blank(i?id+"~"+i:id) },
    async flush(){ /* 이어진 줄끼리 묶어서 한 번에 쓴다 (한 번에 60만 자 이하) */
      const rows=[...buf.keys()].sort((a,b)=>a-b); buf.size;
      let i=0; while(i<rows.length){ let j=i, size=0; const vals=[];
        while(j<rows.length&&(j===i||rows[j]===rows[j-1]+1)&&size<600000){ const v=buf.get(rows[j]); vals.push(v); size+=v[3].length; j++ }
        await t.update(`records!A${rows[i]}:F${rows[j-1]}`,vals); vals.forEach((_,k)=>buf.delete(rows[i+k])); i=j }
    }
  };
}

function mcpT(mcp){
  const call=async(tool,input)=>{const r=await mcp.callTool("Google Sheets",tool,input,{cache:false}); return r&&r.payload};
  return {async get(range){const p=await call("get_values",{spreadsheetId:SHEET_ID,range}); return (p&&p.values)||[]},
          async update(range,values){await call("update_values",{spreadsheetId:SHEET_ID,range,values})}};
}
function gasCfg(){try{const o=JSON.parse(lsGet(GAS_KEY)||"null"); return o&&o.url&&o.token?o:null}catch(e){return null}}
function gasT(cfg){
  const post=async body=>{
    let r; try{ r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:cfg.token},body))}) }catch(e){ throw {code:"gas_net"} }
    let j; try{ j=await r.json() }catch(e){ throw {code:"gas_net"} }
    if(!j||!j.ok) throw {code:"gas_"+((j&&j.error)||"err")}; return j };
  return {async get(range){return (await post({op:"get",range})).values||[]},
          async update(range,values){await post({op:"update",range,values})}};
}

    gas_net:"Apps Script 주소에 연결하지 못했습니다",gas_token:"Apps Script 토큰이 맞지 않습니다",gas_range:"Apps Script가 요청을 거절했습니다"})[c]||("연결 실패"+(c?` (${c})`:""));

function cloudDirty(){ if(!CLOUD.store) return; clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(()=>{CLOUD.timer=null; cloudSync()},CLOUD.store.kind==="sheet"?2500:1200) }
async function cloudSync(){
  if(!CLOUD.store||CLOUD.pending) return;
  if(CLOUD.busy){CLOUD.again=true; return}
  CLOUD.busy=true; setCloud("saving");
  const st=CLOUD.store;
  try{
    const cur=cloudDocs(), done={};
    for(const [id,s] of Object.entries(cur)){ const l=CLOUD.last[id]; if(l&&l.s===s) continue; done[id]={s,n:await st.write(id,s,l?l.n:0)} }
    const gone=Object.keys(CLOUD.last).filter(id=>!(id in cur));
    for(const id of gone) await st.remove(id,CLOUD.last[id].n);
    await st.flush();
    Object.assign(CLOUD.last,done); gone.forEach(id=>delete CLOUD.last[id]);
    if(!CLOUD.again&&!CLOUD.timer) lsSet(DIRTY_KEY,null);
    CLOUD.err=""; setCloud("ok");
  }catch(e){ CLOUD.err=errText(e); setCloud("err") }
  CLOUD.busy=false; if(CLOUD.again){CLOUD.again=false; cloudSync()}
}
function parseDocs(data){
  const srv={}; Object.entries(data).forEach(([id,o])=>{try{srv[id]=JSON.parse(o.s)}catch(e){}});
  const sdb={items:{},sessions:[],drafts:{},notes:null};
  if(srv.misc) Object.assign(sdb,srv.misc);
  BIG.forEach(k=>{ if(srv[k]!==undefined) sdb[k]=srv[k] });
  Object.entries(srv).forEach(([id,v])=>{ if(id.startsWith("d_")&&v&&v.id) sdb.drafts[v.id]=v.d });
  return {sdb,src:srv.src,any:Object.keys(srv).some(k=>k!=="src")};
}
async function connectStore(){

}

  if(!bad.length) return L.concat(["모두 ○입니다."]).join("\n");

/* ── 오류 노트: 갱신 코드 해석과 통계 ── */
function allDefs(){return Object.assign({},PDEF,DB.notes.defs)}
function importCode(str){
  let added=0, bad=0;
  String(str).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const x=line.match(/^LA7EX\|(P-\d+)\|([^|]+)\|([^|]+)\|([^|]+)\|?(.*)$/);
    if(x){const [,pid,task,o,f,why]=x; DB.notes.ex=DB.notes.ex||{}; const L=DB.notes.ex[pid]=(DB.notes.ex[pid]||[]).filter(e=>!(e[0]===task.trim()&&e[1]===o.trim())); L.push([task.trim(),o.trim(),f.trim(),(why||"").trim()]); added++; return}
    const m=line.match(/^LA7\|([^|]+)\|([^|]+)\|(.+)$/);
    if(!m){bad++;return}
    const [,date,task,body]=m, counts={};
    body.split(",").forEach(part=>{
      const q=part.trim().match(/^(P-\d+)(?:\(([^)]*)\))?=(\d+)$/); if(!q) return;
      const [,pid,def,n]=q; counts[pid]=(counts[pid]||0)+(+n);
      if(def){const k=def.lastIndexOf("/"); DB.notes.defs[pid]={n:(k>0?def.slice(0,k):def).trim(),c:(k>0?def.slice(k+1):"").trim()}}
    });
    if(!Object.keys(counts).length){bad++;return}
    const key=`${date.trim()}|${task.trim()}`;
    DB.notes.entries=DB.notes.entries.filter(e=>e.key!==key);
    DB.notes.entries.push({key,date:date.trim(),task:task.trim(),counts}); added++;
  });
  DB.notes.entries.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return {added,bad};
}
function pstats(){
  const E=DB.notes.entries, N=E.length, out={};
  E.forEach((e,i)=>Object.entries(e.counts).forEach(([p,n])=>{const o=out[p]||(out[p]={id:p,total:0,last:-1,seen:0}); o.total+=n; o.last=i; o.seen++;}));
  Object.values(out).forEach(o=>{
    const recent=o.last>=N-3;
    o.status=recent?(o.total>=3?"집중":o.total>=2?"경계":"관찰"):"졸업";
  });
  return out;
}
const ST_CLASS={"집중":"bad","경계":"warn","관찰":"","졸업":"ok"};
function watchList(){
  const st=Object.values(pstats()).filter(o=>o.status==="집중"||o.status==="경계");
  st.sort((a,b)=>(a.status===b.status?b.total-a.total:a.status==="집중"?-1:1));
  return st.slice(0,3);
}
function exList(pid){const own=(DB.notes.ex&&DB.notes.ex[pid])||[]; const seed=(PEX[pid]||[]).filter(e=>!own.some(o=>o[0]===e[0]&&o[1]===e[1])); return seed.concat(own)}
function exHTML(pid){const L=exList(pid); if(!L.length) return `<p class="note" style="padding-top:6px">저장된 예가 없습니다.</p>`;
  return L.slice().reverse().map(([t,o,f,w])=>`<div class="ex"><span class="tag">${esc(t)}</span><div><div><span class="o">${esc(o)}</span></div><div>→ <span class="f">${esc(f)}</span></div>${w?`<div class="why">${esc(w)}</div>`:""}</div></div>`).join("")}
function watchHTML(withChecks,checked){
  const w=watchList(), D=allDefs(); if(!w.length) return "";
  const sum=o=>`<summary><span class="code">${o.id}</span> ${esc(D[o.id]?.n||o.id)} <span class="pill ${ST_CLASS[o.status]}">${o.status} · ${o.total}회</span></summary>`;
  return `<div class="watch"><b>${withChecks?"다 쓴 뒤 확인하기":"이번에 조심할 것"}</b><span class="note">항목을 누르면 내가 틀렸던 문장이 나옵니다.</span>${w.map(o=>withChecks
    ?`<div class="witem"><input type="checkbox" data-chk="${o.id}" aria-label="${o.id} 확인함" ${checked&&checked[o.id]?"checked":""} style="margin-top:5px"><details>${sum(o)}${exHTML(o.id)}</details></div>`
    :`<details>${sum(o)}${exHTML(o.id)}</details>`).join("")}${withChecks?`<span class="note">해당 실수가 없는지 확인했으면 체크하세요. 체크 결과는 결과지에 들어갑니다.</span>`:""}</div>`;
}

:`<section class="card"><h3>다음 단계</h3><p class="small muted">교정 보고서를 받은 뒤: ① 논리 점수가 낮으면 뼈대 다시 짜기 → ② 고칠 표현 연습(오답 드릴, 보고서의 LA7EX 줄을 오류 노트에 붙여 넣으면 이 과제 문장이 들어옵니다) → ③ 2~3일 뒤 비슷한 주제로 새로 쓰기 → 집중·경계 패턴이 다시 나오지 않으면 마치기.</p><div class="row"><button class="btn primary" id="skr">① 뼈대 다시 짜기</button><button class="btn" id="exr">② 표현 연습</button><button class="btn" id="tr">③ 비슷한 주제로 새로 쓰기</button><span class="spacer"></span><button class="btn" id="fin">이 과제 마치기</button></div></section>`):""}

  const ta=$("#wt"), meter=()=>{const m=$("#wm"); if(m) m.textContent=`${jpLen(ta.value)}자 · ${fmt(d.ms+(S.since?Date.now()-S.since:0))}`};

  meter(); clearInterval(S.tick); S.tick=setInterval(()=>{ if(!document.body.contains(ta)) return clearInterval(S.tick); meter()},1000);
  const pause=()=>{ if(S&&S.since){d.ms+=Date.now()-S.since; S.since=null; save()} };
  S.leave=()=>{pause(); clearInterval(S.tick)};
  if(!locked){
    ta.oninput=()=>{ if(!S.since) S.since=Date.now(); d.text=ta.value; save(); meter(); drawParas()};

function paraList(t){return String(t||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>jpLen(x))}
function parasHTML(t){
  const P=paraList(t), tot=P.reduce((a,b)=>a+b,0); if(P.length<2) return `<p class="note">빈 줄이나 줄바꿈으로 단락을 나누면 단락별 분량이 여기에 나옵니다.</p>`;
  return P.map((n,i)=>{const pc=Math.round(n/tot*100), first=i===0, lastp=i===P.length-1, over=(first&&pc>25)||(lastp&&pc<10);
    return `<div class="para ${over?"over":""}" title="${first?"서론 권장 15~25%":lastp?"결론 권장 10~20%":"본론"}"><span>${first?"서론":lastp?"결론":"본론 "+i}</span><span class="t"><i style="width:${pc}%"></i></span><span class="v">${n}자 · ${pc}%${over?" ⚠":""}</span></div>`}).join("");
}
function writeSheet(w,d,ver){
  const D=allDefs(), V=d.versions, L=[];
  const sfx=ver.mode==="수정본"?"r":ver.mode==="재측정"?"m":ver.mode==="뼈대 수정"?"s":ver.mode==="전이"?"t":"";
  if(ver.mode==="뼈대 수정"){
    const f=V[0], sk2=[["a","결론·주제"],["b","순서·근거"],["c","독자가 모르는 것"],["d","마무리"]];
    L.push(`[LA 뼈대 수정 결과지] ${ver.at}`, `과제: ${w.id} ${w.kind}「${w.title}」 · 글의 목적: ${ver.purpose||"설명"}`, `상황: ${w.situation}`, "");
    L.push("── 처음 뼈대"); sk2.forEach(([k,t])=>L.push(`- ${t}: ${((f&&f.skel&&f.skel[k])||"").trim()||"(비어 있음)"}`));
    L.push("", "── 다시 짠 뼈대"); sk2.forEach(([k,t])=>L.push(`- ${t}: ${(ver.skel[k]||"").trim()||"(비어 있음)"}`));
    if(f&&f.text){L.push("", `── 교정받은 초고 (v${f.n}, 참고)`, f.text.trim())}
    L.push("", "── 요청", `교정 보고서의 논리 점수표 기준으로, 다시 짠 뼈대가 논리 문제를 고쳤는지 6항목별로 짧게 판정해 주세요(각 0~2점 예상과 근거). 일본어 표현은 보지 않습니다. 남은 문제가 있으면 무엇을 바꾸면 되는지 한 줄씩. 과제 표기: ${w.id}s`);
    return L.join("\n");
  }
  L.push(`[LA 작문 결과지] ${ver.at}`);
  L.push(`과제: ${w.id} ${w.kind}「${w.title}」 · v${ver.n} ${ver.mode}`);
  if(ver.mode==="전이"){ L.push(`이번 주제 (같은 종류·조건, 주제만 바꿈): ${ver.topic}`); L.push("넣기로 한 표현: "+ver.exps.map((x,i)=>`${i+1}) ${x}`).join(" / ")); }
  L.push(`상황: ${w.situation}`);
  L.push(`분량 기준: ${w.len} / 실제: ${ver.len}자 (공백 제외) / 쓴 시간: ${fmt(ver.ms)}`);
  L.push("조건:"); w.conds.forEach(c=>L.push(`- ${c}`));
  const sk=[["a","결론·주제"],["b","순서·근거"],["c","독자가 모르는 것"],["d","마무리"]].filter(([k])=>(ver.skel[k]||"").trim());
  if(sk.length){L.push("한국어 뼈대:"); sk.forEach(([k,t])=>L.push(`- ${t}: ${ver.skel[k].trim()}`))}
  L.push(`글의 목적: ${ver.purpose||"설명"}`);
  const P=paraList(ver.text), tot=P.reduce((a,b)=>a+b,0); if(P.length) L.push("단락별 분량: "+P.map((n,i)=>`${i+1}단락 ${n}자(${Math.round(n/tot*100)}%)`).join(" / "));
  const wl=watchList(); if(wl.length) L.push("자기 점검: "+wl.map(o=>`${o.id} ${D[o.id]?.n||""} ${ver.checks[o.id]?"✔":"✘"}`).join(" / "));
  L.push("", `── 내가 쓴 글 (v${ver.n})`, ver.text.trim(), "");
  if(ver.mode==="수정본"&&V.length>1){const p=V[V.length-2]; L.push(`── 이전 글 (v${p.n})`, p.text.trim(), "")}
  if(ver.mode==="재측정"){const f=V[0]; L.push(`── 첫 초고 (v1, 비교용 · 이번 글은 원문을 보지 않고 씀)`, f.text.trim(), "")}
  if(ver.mode==="전이"){const f=V[0]; if(f&&f.text) L.push(`── 원래 과제의 첫 초고 (v1, 패턴 비교용 · 다른 주제)`, f.text.trim(), "")}
  L.push("── 요청");
  if(ver.mode==="초고"){
    L.push("LA-06 5절의 교정 보고서 형식으로, ① 논리 → ② 정확성 → ③ 자연스러움 순서로 봐 주세요.");
  } else if(ver.mode==="수정본"){
    L.push("이전 교정을 반영한 수정본입니다. 고친 곳이 맞게 고쳐졌는지, 남은 문제와 새로 생긴 문제를 같은 보고서 형식으로 짚어 주세요.");
  } else if(ver.mode==="전이"){
    L.push("표현 연습 뒤 비슷한 주제로 새로 쓴 글입니다(전이 과제). 먼저 ① 넣기로 한 표현 3개를 각각 맞게 썼는지(맞음/어색/틀림/안 씀) 판정하고, ② 원래 과제 초고의 패턴(LA-07)이 재발했는지 표시한 뒤, 같은 보고서 형식으로 봐 주세요.");
  } else {
    L.push("며칠 뒤 원문을 보지 않고 다시 쓴 글입니다. 첫 초고와 비교해 패턴별로 재발/개선을 표시하고, 같은 보고서 형식으로 봐 주세요.");
  }
  L.push("① 논리 점수표 (각 0~2점, 점수마다 원문을 인용한 근거 한 줄): 논점 명확성(첫 두 문장 안에 무엇을 말할지·주장이 있는가) / 구성(단락마다 역할이 하나이고 순서가 자연스러운가. 주장·설명은 서론-본론-결론, 경험은 기승전결도 허용) / 근거(주장마다 이유나 예가 직접 이어지는가) / 설득력(근거 없는 단정·과장·일반화가 없는가, 주장글이면 반대 의견을 고려했는가) / 일관성(첫 주장과 결론, 뼈대와 본문이 일치하는가) / 분량 배분(서론 15~25%, 결론 10~20%).");
  L.push("평가는 위에 적은 '글의 목적'을 기준으로 하고, 전문 지식의 양은 감점하지 마세요. 다루지 않은 부분은 범위를 밝혔는지만 봐 주세요. 고친 전체 글도 쓴 사람의 목적과 주장을 바꾸지 말고 고쳐 주세요.");
  L.push("원문에 빨간 표시, 교정마다 원문→수정·읽기(★ 예외 읽기)·유형 코드·패턴(P-번호)·표시(틀림/부자연/변이/취향)·이유 한 줄, 확신이 낮으면 '확인 필요'를 붙여 주세요.");
  L.push(`과제 조건 확인, 고친 전체 글, 마지막에 LA-07 갱신 코드(과제 표기: ${w.id}${sfx}, 변이·취향은 횟수 제외)와 패턴별 예문 줄(LA7EX|패턴|과제|원문|수정|이유)을 주세요.`);
  return L.join("\n");
}

  const lic=x=>x==="open"?`<span class="pill ok">재사용 허락 계열</span>`:`<span class="pill">링크로 읽기</span>`;
  v.innerHTML=`

function bindReadForm(v,R){
  const g=id=>$("#"+id);
  const sync=()=>{R.f=g("rf").value; R.t=g("rt").value; R.s=g("rsrc").value; R.u=g("ru").value; R.lic=g("rl").value; if(g("rbody")) R.body=g("rbody").value; if(g("rsb")) R.sendBody=g("rsb").checked; v.querySelectorAll("[data-sum]").forEach(i=>R.sum[+i.dataset.sum]=i.value); R.exps=g("rx").value; R.again=g("ra").value;};
  g("rl").onchange=()=>{sync(); render()};
  if(g("rbody")) g("rbody").onchange=()=>{sync(); render()};
  g("rcancel").onclick=()=>{S.cur=null; S.sheet=null; render()};
  g("rmk").onclick=()=>{
    sync();
    if(!R.t.trim()||!R.sum.some(x=>x.trim())){ g("rm").textContent="제목과 요약을 먼저 적어 주세요"; return }
    R.at=stamp();
    DB.reads=DB.reads||[]; DB.reads.push({f:R.f,t:R.t,s:R.s,u:R.u,lic:R.lic,body:R.lic==="open"?R.body:"",sum:R.sum.slice(),exps:R.exps,again:R.again,at:R.at});
    DB.sessions.unshift({at:stamp(),kind:"다독",title:R.t,len:0}); save();
    const L=[`[LA 다독 결과지] ${R.at}`,`분야: ${R.f}`,`제목: ${R.t}`,`출처: ${R.s} ${R.u}`,`라이선스: ${R.lic==="open"?"재사용 허락 (출처 표시)":"링크로 읽기만"}`,""];
    L.push("── 3문장 요약", `주장: ${R.sum[0]}`, `근거: ${R.sum[1]}`, `결론: ${R.sum[2]}`, "", "── 수집한 표현", R.exps.trim()||"(없음)");
    if(R.again.trim()) L.push("", "── 다시 만난 표현", R.again.trim());
    if(R.lic==="open"&&R.sendBody&&R.body.trim()) L.push("", `── 본문 (출처: ${R.s} ${R.u})`, R.body.trim());
    L.push("", "── 요청", "① 위 주소의 글을 직접 열어 읽고, 요약이 글의 주장·근거·결론을 맞게 잡았는지 확인해 주세요(열리지 않으면 그렇다고). ② 수집한 표현마다 읽기·뜻·한국어 대응·쓰는 장면을 적고, 사용 어휘/이해 어휘로 나눠 주세요(D-38). 표현을 로마자·한국어 메모로 적었으면 글에서 해당 표현을 찾아 일본어로 바꿔 주세요. ③ 내가 놓친, 업무에서 쓸 만한 표현 3개를 짧게 골라 주세요. ④ 다음 작문의 '넣을 표현' 후보 3개를 골라 주세요. 다시 만난 표현은 만난 횟수에 더해 주세요.");
    S.sheet=L.join("\n"); S.cur=null; render();
  };
}

function transSheet(t,s,d,step){
  const L=[];
  if(step===1){
    L.push(`[LA 번역 결과지] ${stamp()}`, `과제: ${t.id} 「${s.title}」(${s.kind}) · 일→한 번역`, `초점: ${t.focus}`, "", "── 원문", s.text, "", "── 내 번역", d.ko.trim(), "", "── 필자의 의도 (한 줄)", d.intent.trim()||"(적지 않음)", "", "── 요청");
    L.push("① 오독(뜻을 잘못 읽은 곳) ② 뉘앙스 누락(경어·완곡·문말이 전하는 것을 놓친 곳) ③ 한국어 표현(참고)으로 나눠 봐 주세요.");
    L.push("일본어 이해의 문제(①②)와 한국어 표현력(③)을 구분해 평가하고, 내가 놓친 일본어 표현은 읽기와 함께 정리해 주세요.");
    L.push(`의도 한 줄이 맞는지도 확인하고, 마지막에 LA-07 갱신 코드(과제 표기: ${t.id})를 주세요.`);
  } else {
    L.push(`[LA 역번역 결과지] ${stamp()}`, `과제: ${t.id} 「${s.title}」 · 한→일 역번역 (원문을 보지 않고 씀)`, "", "── 원문", s.text, "", "── 내 한국어 번역", d.ko.trim(), "", "── 내 역번역", d.back.trim(), "", "── 요청");
    L.push("원문과 역번역을 비교해 ① 원문에 있는데 내 일본어로는 안 나온 표현(익힐 표현, 읽기 포함) ② 뜻이나 경어 수준이 바뀐 곳 ③ 내 표현이 부자연스러운 곳을 정리해 주세요.");
    L.push(`틀림/부자연/변이/취향 표시를 붙이고, 마지막에 LA-07 갱신 코드(과제 표기: ${t.id}b)를 주세요.`);
  }
  return L.join("\n");
}

function poolFor(){
  let p=MCQ.filter(q=>setup.codes.has(q.code));
  if(setup.mode==="due") p=p.filter(q=>isDue(q.id));
  if(setup.mode==="wrong") p=p.filter(q=>DB.items[q.id]&&DB.items[q.id].lastOk===false);
  p=shuffle(p);
  if(setup.mode==="unseen") p.sort((a,b)=>(DB.items[a.id]?.n||0)-(DB.items[b.id]?.n||0));
  return p;
}

    ${GROUPS.map(([g,cs])=>`<div class="grp"><span class="small muted">${g}</span><div class="chips">${cs.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${setup.codes.has(c)}"><span class="code">${c}</span>${LABEL[c]}<span class="n">${cnt(c)}</span></button>`).join("")}</div></div>`).join("")}

    <p class="small muted">${setup.mode==="due"?"복습은 틀린 날로부터 1일 → 3일 → 7일 뒤에 다시 나옵니다. ":""}조건에 맞는 문항 ${avail}개 중 ${Math.min(avail,setup.count)}개를 냅니다.</p>
    <div class="row"><button class="btn primary" id="start" ${avail?"":"disabled"}>시작</button>${avail?"":`<span class="small muted">조건에 맞는 문항이 없습니다.</span>`}</div>

function startQuiz(kind,title,meta,qs){
  S={kind,title,meta,phase:"quiz",i:0,qs:qs.map(q=>({q,order:shuffle([0,1,2,3]),pick:null,reason:"",flag:false,memo:""})),start:Date.now()};
  render(); window.scrollTo(0,0);
}
function stemHTML(s){return esc(s).replace(/＿＿/g,'<span class="blank">＿＿</span>')}
function renderQuiz(v){
  const it=S.qs[S.i], q=it.q, done=it.pick!==null, last=S.i===S.qs.length-1, ok=done&&it.pick===0;
  v.innerHTML=`
  <section class="card">
    <div class="row"><span class="small muted">${esc(S.title)}</span><span class="spacer"></span><span class="meter">${S.i+1} / ${S.qs.length}</span></div>
    <div class="prog"><i style="width:${(S.i+(done?1:0))/S.qs.length*100}%"></i></div>
  </section>
  ${q.passage?`<section class="card"><div class="row"><span class="tag">${q.passage.id}</span><span class="small muted">${esc(q.passage.kind)}</span></div><div class="ptitle">${esc(q.passage.title)}</div><div class="passage">${esc(q.passage.text)}</div></section>`:""}
  <section class="card">
    <div class="row"><span class="tag">${q.id}</span><span class="small muted">${LABEL[q.code]}</span><span class="spacer"></span><span class="lv">난이도 ${"●".repeat(q.lv)}${"○".repeat(3-q.lv)}</span></div>
    <div class="stem">${stemHTML(q.stem)}</div>
    <div class="opts">${it.order.map((oi,k)=>{let cls=""; if(done){ if(oi===0) cls="ok"; else if(oi===it.pick) cls="bad"; else cls="dim"; }
      return `<button class="opt ${cls}" data-o="${oi}" ${done?"disabled":""}><span class="k">${MARK[k]}</span><span>${esc(q.opts[oi])}</span></button>`}).join("")}</div>
    ${done?`<div class="fb ${ok?"ok":"bad"}"><div>${ok?`<b class="okt">정답</b>`:`<b class="badt">오답</b> · 정답은 <span class="jp">${esc(q.opts[0])}</span>`}</div><div class="small">${esc(q.expl)}</div>${mcDetail(q,it.pick)}</div>
      ${ok?"":`<label class="lb">왜 이걸 골랐나요? (선택, 결과지에 들어갑니다)<textarea id="reason" rows="2">${esc(it.reason)}</textarea></label>`}
      <label class="flag"><input type="checkbox" id="flag" ${it.flag?"checked":""}> 이 문항이 이상해요 (정답이 둘 이상이거나 해설이 틀림)</label>
      <input type="text" id="memo" placeholder="어디가 이상한지 한 줄 메모" value="${esc(it.memo)}" ${it.flag?"":"hidden"}>
      <div class="row"><button class="btn" id="prev" ${S.i?"":"disabled"}>이전</button><span class="spacer"></span><button class="btn primary" id="next">${last?"결과 보기":"다음 문제"}</button></div>`
    :`<div class="row"><button class="btn" id="prev" ${S.i?"":"disabled"}>이전</button><span class="spacer"></span><span class="small muted">보기를 눌러 답하세요</span></div>`}
  </section>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  const keep=()=>{const r=$("#reason"),f=$("#flag"),m=$("#memo"); if(r) it.reason=r.value; if(f) it.flag=f.checked; if(m) it.memo=m.value;};
  const f=$("#flag"); if(f) f.onchange=()=>{$("#memo").hidden=!f.checked; if(f.checked) $("#memo").focus()};
  $("#prev").onclick=()=>{keep(); S.i--; render()};
  const n=$("#next"); if(n) n.onclick=()=>{keep(); if(last) finish(); else {S.i++; render(); window.scrollTo(0,0)}};
}
function answer(oi){
  const it=S.qs[S.i]; if(it.pick!==null) return;
  it.pick=oi; const ok=oi===0, r=rec(it.q.id);
  r.n++; r.last=Date.now(); r.lastOk=ok; if(ok){r.c++; if(r.w) r.streak++;} else {r.w++; r.streak=0;}
  save(); render();
}
function finish(){
  const total=S.qs.length, okN=S.qs.filter(x=>x.pick===0).length, by={};
  S.qs.forEach(x=>{const c=x.q.code; by[c]=by[c]||[0,0]; by[c][1]++; if(x.pick===0) by[c][0]++;});
  S.phase="result"; S.score=[okN,total]; S.by=by; S.end=Date.now();
  DB.sessions.unshift({at:stamp(),kind:S.kind==="mc"?"객관식":"독해",title:S.title,ok:okN,total,by});
  DB.sessions=DB.sessions.slice(0,300); save(); render(); window.scrollTo(0,0);
}
function sheetText(){
  const [ok,total]=S.score, mins=Math.max(1,Math.round((S.end-S.start)/60000)), L=[];
  L.push(`[LA 문제은행 결과지] ${stamp(new Date(S.end))} · ${S.title}`); if(S.meta) L.push(S.meta);
  L.push(`점수: ${ok}/${total} (${Math.round(ok/total*100)}%) · 걸린 시간 약 ${mins}분`);
  L.push(`유형별: `+Object.entries(S.by).map(([c,[a,b]])=>`${c} ${LABEL[c]} ${a}/${b}`).join(" · "));
  const wrong=S.qs.filter(x=>x.pick!==0), fl=S.qs.filter(x=>x.flag);
  L.push("", `── 틀린 문항 (${wrong.length})`); if(!wrong.length) L.push("없음");
  wrong.forEach((x,i)=>{L.push(`${i+1}) [${x.q.id} · ${x.q.code} ${LABEL[x.q.code]}] ${x.q.stem}`, `   내 답: ${x.q.opts[x.pick]}`, `   정답: ${x.q.opts[0]}`, ...(x.q.why?[`   이 보기가 틀린 이유(앱): ${x.q.why[x.pick-1]}`]:[]), `   고른 이유: ${x.reason.trim()||"(적지 않음)"}`)});
  L.push("", `── 이상 신고 문항 (${fl.length})`); if(!fl.length) L.push("없음");
  fl.forEach(x=>{L.push(`- [${x.q.id}] ${x.q.stem}`, `  보기: ${x.q.opts.join(" / ")} (앱의 정답: ${x.q.opts[0]})`, `  메모: ${x.memo.trim()||"(없음)"}`)});
  if(wrong.length||fl.length){
    L.push("", "── 요청");
    if(wrong.length) L.push("틀린 문항을 유형 코드와 LA-07 패턴으로 분류하고, 고른 이유를 보고 약점을 짚어 주세요. 한자어는 읽기를 함께 적어 주세요.");
    if(fl.length) L.push("이상 신고 문항은 문항 자체가 맞는지(정답이 하나인지, 해설이 맞는지, 변이인지) 검토해 주세요.");
  }
  return L.join("\n");
}
function renderResult(v){
  const [ok,total]=S.score, txt=sheetText(), wrong=S.qs.filter(x=>x.pick!==0);
  v.innerHTML=`
  <section class="card">
    <h3>${esc(S.title)}</h3>
    <div class="row"><span class="score">${ok}<span class="muted" style="font-size:1.2rem"> / ${total}</span></span><span class="spacer"></span><span class="pill ${ok/total>=.8?"ok":ok/total>=.6?"warn":"bad"}">${Math.round(ok/total*100)}%</span></div>
    <div class="bars">${Object.entries(S.by).map(([c,[a,b]])=>`<div class="bar"><span><span class="code">${c}</span> <span class="small muted">${LABEL[c]}</span></span><span class="t"><i style="width:${a/b*100}%"></i></span><span class="v">${a}/${b}</span></div>`).join("")}</div>
  </section>
  ${sheetCard("rs","결과지",txt,wrong.length?"복사해 Claude에게 보내면 분류와 검토를 받을 수 있습니다.":"틀린 문항이 없으면 보내지 않아도 됩니다.")}
  ${wrong.length?`<section class="card"><h3>틀린 문항 다시 보기</h3><div class="list">${wrong.map(x=>`<div class="item"><span class="tag">${x.q.id}</span><div class="main"><span class="jp">${esc(x.q.stem)}</span><span class="sub">내 답 <span class="jp">${esc(x.q.opts[x.pick])}</span> → 정답 <span class="jp">${esc(x.q.opts[0])}</span></span><span class="sub">${esc(x.q.expl)}</span>${x.q.why?`<span class="sub">내 답이 틀린 이유: ${esc(x.q.why[x.pick-1])}</span>`:""}</div></div>`).join("")}</div></section>`:""}
  <div class="row">${wrong.length?`<button class="btn" id="retry">틀린 ${wrong.length}문항 다시 풀기</button>`:""}<span class="spacer"></span><button class="btn primary" id="home">처음으로</button></div>`;
  bindCopy(v,{rs:txt});
  const r=$("#retry"); if(r) r.onclick=()=>startQuiz(S.kind,S.title+" (오답 재도전)",S.meta,wrong.map(x=>x.q));
  $("#home").onclick=()=>{S=null; render(); window.scrollTo(0,0)};
}

  </section>
  <section class="card"><h3>기록 지우기</h3>
    <p class="small muted">풀이 기록, 작문·번역 초안과 버전, 오류 노트를 시트와 이 기기에서 모두 지웁니다. 모든 기기에서 사라지며 되돌릴 수 없습니다. (오답 드릴 원문과 가릴 말은 남습니다)</p>
    <div class="row"><button class="btn" id="reset">기록 모두 지우기</button><span id="rc"></span></div>
  </section>`;
  $("#relink").onclick=()=>{$("#rlmsg").textContent="연결 중…"; cloudLoad()};
  $("#gass").onclick=()=>{const url=$("#gasu").value.trim(), token=$("#gast").value.trim(); if(!/^https:\/\/script\.google\.com\//.test(url)||!token){$("#gasm").style.color="var(--bad)"; $("#gasm").textContent="주소(https://script.google.com/…)와 토큰을 넣어 주세요"; return} lsSet(GAS_KEY,JSON.stringify({url,token})); $("#gasm").textContent="연결 중…"; cloudLoad()};
  $("#gasx").onclick=()=>{lsSet(GAS_KEY,null); cloudLoad()};
  $("#mksave").onclick=()=>{DB.mask=$("#mkin").value.split(/\n/).map(x=>x.trim()).filter(Boolean); save(); const m=$("#mkmsg"); m.style.color="var(--ok)"; m.textContent=`${DB.mask.length}개 저장했습니다`};
  $("#exp").onclick=()=>{const t="LAQB1:"+JSON.stringify(DB); const el=$("#bk-s"); el.textContent=t; el.hidden=false; const c=$("#bkcp"); c.hidden=false; c.onclick=()=>copyText(t,el,$("#bk-t"))};
  $("#bkload").onclick=()=>{const m=$("#bkmsg"); try{const t=$("#bkin").value.trim(); if(!t.startsWith("LAQB1:")) throw 0; const n=mergeBackup(JSON.parse(t.slice(6))); save(); render(); const m2=$("#bkmsg"); m2.style.color="var(--ok)"; m2.textContent=`합쳤습니다: 작문·번역 ${n.d}건, 오류 노트 ${n.e}회차, 기록 ${n.s}건`}catch(e){m.style.color="var(--bad)"; m.textContent="형식이 맞지 않습니다 (LAQB1: 로 시작해야 함)"}};
  $("#reset").onclick=()=>{$("#rc").innerHTML=`<span class="row"><span class="small" style="color:var(--bad)">정말 지울까요?</span><button class="btn" id="yes">지우기</button><button class="btn" id="no">취소</button></span>`;
    $("#yes").onclick=()=>{const mk=DB.mask, mg=DB.migratedDb; DB={items:{},sessions:[],drafts:{},notes:{defs:{},entries:[]},mask:mk,migratedDb:mg}; importCode(SEED); save(); render()}; $("#no").onclick=()=>render()};
}

function mergeBackup(o){
  const n={d:0,e:0,s:0};
  Object.entries(o.items||{}).forEach(([k,r])=>{const cur=DB.items[k]; if(!cur||(r.n||0)>(cur.n||0)) DB.items[k]=r});
  const seen=new Set(DB.sessions.map(x=>x.at+"|"+x.title));
  (o.sessions||[]).forEach(x=>{const k=x.at+"|"+x.title; if(!seen.has(k)){DB.sessions.push(x); seen.add(k); n.s++}});
  DB.sessions.sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);
  Object.entries(o.drafts||{}).forEach(([k,d])=>{const cur=DB.drafts[k]; const lv=x=>(x&&x.versions?x.versions.length:0)+(x&&x.done?Object.keys(x.done).length:0);
    if(!cur||(!cur.text&&!cur.ko&&!lv(cur))||lv(d)>lv(cur)){DB.drafts[k]=d; n.d++}});
  const on=o.notes||{}; Object.assign(DB.notes.defs,on.defs||{});
  (on.entries||[]).forEach(e=>{ if(!DB.notes.entries.some(x=>x.key===e.key)){DB.notes.entries.push(e); n.e++} });
  DB.notes.entries.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  DB.notes.ex=DB.notes.ex||{}; Object.entries(on.ex||{}).forEach(([p,L])=>{const cur=DB.notes.ex[p]=DB.notes.ex[p]||[]; L.forEach(e=>{ if(!cur.some(x=>x[0]===e[0]&&x[1]===e[1])) cur.push(e) })});
  DB.drill=DB.drill||{}; Object.entries(o.drill||{}).forEach(([k,r])=>{const cur=DB.drill[k]; if(!cur||(r.n||0)>(cur.n||0)) DB.drill[k]=r});
  DB.reads=DB.reads||[]; (o.reads||[]).forEach(r=>{ if(!DB.reads.some(x=>x.at===r.at&&x.t===r.t)) DB.reads.push(r) });
  if(Array.isArray(o.mask)) DB.mask=[...new Set([...(DB.mask||[]),...o.mask])];
  return n;
}
lsSet(KEY,JSON.stringify(DB));
go("write");
cloudLoad();
</script>
<script>
/* LA 디자인 v3 — 화면 전환 움직임과 숫자 올라가기.
   앱은 화면을 통째로 다시 그린다. 같은 카드를 다시 그릴 때는 움직임을 생략하고(.still),
   새로 나타난 카드에만 떠오르기·숫자 올라가기를 준다. */
(()=>{
  const view=document.getElementById("view"); if(!view) return;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const keyOf=el=>el.tagName+"."+String(el.className||"").replace(/\bstill\b/,"").trim()+"|"+(el.textContent||"").replace(/\s+/g,"").slice(0,40);
  let prev=new Set();
  const countUp=el=>{
    const n=[...el.childNodes].find(x=>x.nodeType===3&&/\d/.test(x.nodeValue)); if(!n) return;
    const m=n.nodeValue.match(/^(\D*)(\d+)([\s\S]*)$/); if(!m) return;
    const to=+m[2]; if(to<2) return;
    const t0=performance.now(), d=700;
    const step=t=>{const k=Math.min(1,(t-t0)/d); n.nodeValue=m[1]+Math.round(to*(1-Math.pow(1-k,3)))+m[3]; if(k<1) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  };
  new MutationObserver(()=>{
    const now=new Set();
    [...view.children].forEach(el=>{
      const k=keyOf(el); now.add(k);
      if(prev.has(k)) el.classList.add("still");
      else if(!reduce) el.querySelectorAll(".score,.sum b,.stat b").forEach(countUp);
    });
    prev=now;
  }).observe(view,{childList:true});
})();
</script>
